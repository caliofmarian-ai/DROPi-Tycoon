name: Temporary reconcile PR 540 with Braila

on:
  push:
    branches:
      - openai/issue-539-district-identity-streets

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: openai/issue-539-district-identity-streets

      - name: Rebuild PR 540 on current main and remove the retired city identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python - <<'PY'
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw)
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = (text
                  .replace('CEDAR CITY', 'BRĂILA')
                  .replace('Cedar City', 'Brăila')
                  .replace('cedar-city', 'braila')
                  .replace('CEDAR', 'BRAILA')
                  .replace('Cedar', 'Brăila')
                  .replace('cedar', 'braila'))
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

          cat > game-web/src/world/brailaIdentity.ts <<'EOF'
          import type Phaser from 'phaser'
          import { CITY_COLORS as C, COLORS } from '../ui/theme'
          import { cityLabel } from './cityArt'
          import {
            WORLD_BUILDINGS, WORLD_ROUTE_POINTS, WORLD_ZONES,
            type WorldBuildingLayout, type WorldZoneId, type WorldZoneLayout,
          } from './worldLayout'

          export type BrailaDistrictCueKind =
            | 'courtyard'
            | 'commerce-plaza'
            | 'industrial-yard'
            | 'logistics-bays'
            | 'quays'
            | 'garden-walk'

          export interface BrailaDistrictIdentityProfile {
            zoneId: WorldZoneId
            cueKind: BrailaDistrictCueKind
            accent: number
          }

          export const BRAILA_DISTRICT_IDENTITY_PROFILES: readonly BrailaDistrictIdentityProfile[] = [
            { zoneId: 'residential', cueKind: 'courtyard', accent: C.roof },
            { zoneId: 'business', cueKind: 'commerce-plaza', accent: COLORS.accentStrong },
            { zoneId: 'storage', cueKind: 'industrial-yard', accent: C.parcel },
            { zoneId: 'company', cueKind: 'logistics-bays', accent: C.roofBlue },
            { zoneId: 'waterfront', cueKind: 'quays', accent: C.water },
            { zoneId: 'garden', cueKind: 'garden-walk', accent: C.leafDark },
          ] as const

          export interface BrailaAddressPlaque {
            buildingId: string
            number: number
            x: number
            y: number
          }

          const stableAddressNumber = (buildingId: string): number => {
            if (buildingId === 'main-hq') return 1
            if (buildingId === 'business-1') return 10
            let hash = 17
            for (const character of buildingId) hash = (hash * 31 + character.charCodeAt(0)) % 997
            return 2 + (hash % 97)
          }

          const plaqueFor = (building: WorldBuildingLayout): BrailaAddressPlaque => ({
            buildingId: building.id,
            number: stableAddressNumber(building.id),
            x: building.x - building.width / 2 + 12,
            y: building.y + (building.entranceFacing === 'up' ? -1 : 1) * (building.height / 2 - 14),
          })

          const addressedBuildingIds = (() => {
            const ids = new Set<string>(['main-hq', 'business-1'])
            for (const point of WORLD_ROUTE_POINTS) {
              if (ids.size >= 18) break
              ids.add(point.buildingId)
            }
            return ids
          })()

          export const BRAILA_ADDRESS_PLAQUES: readonly BrailaAddressPlaque[] = WORLD_BUILDINGS
            .filter(building => addressedBuildingIds.has(building.id))
            .map(plaqueFor)

          const profileFor = (zoneId: WorldZoneId): BrailaDistrictIdentityProfile =>
            BRAILA_DISTRICT_IDENTITY_PROFILES.find(profile => profile.zoneId === zoneId)!

          const drawCourtyard = (g: Phaser.GameObjects.Graphics, zone: WorldZoneLayout): void => {
            const left = zone.x + 28
            const top = zone.y + zone.height - 82
            g.fillStyle(C.pavingLine, 0.55).fillRoundedRect(left, top, 190, 48, 14)
            g.fillStyle(C.sidewalk, 0.9).fillRoundedRect(left + 5, top + 5, 180, 38, 11)
            for (let x = left + 20; x < left + 174; x += 31) g.fillStyle(C.roof, 0.2).fillRect(x, top + 8, 2, 32)
            g.fillStyle(C.leafDark).fillCircle(left + 27, top + 24, 8).fillCircle(left + 157, top + 24, 8)
          }

          const drawCommercePlaza = (g: Phaser.GameObjects.Graphics, zone: WorldZoneLayout): void => {
            const left = zone.x + zone.width - 232
            const top = zone.y + zone.height - 92
            g.fillStyle(C.cream, 0.82).fillRoundedRect(left, top, 198, 58, 10)
            g.lineStyle(1, COLORS.accentStrong, 0.35)
            for (let x = left + 12; x < left + 190; x += 24) g.lineBetween(x, top + 5, x, top + 53)
            for (let y = top + 12; y < top + 53; y += 20) g.lineBetween(left + 5, y, left + 193, y)
            g.fillStyle(C.roofBlue).fillCircle(left + 24, top + 29, 7).fillCircle(left + 174, top + 29, 7)
          }

          const drawIndustrialYard = (g: Phaser.GameObjects.Graphics, zone: WorldZoneLayout): void => {
            const left = zone.x + 28
            const top = zone.y + 270
            g.fillStyle(C.roadEdge, 0.52).fillRoundedRect(left, top, 210, 62, 8)
            for (let x = left + 8; x < left + 202; x += 22) {
              g.fillStyle((x / 22) % 2 < 1 ? C.parcel : C.cream, 0.62).fillRect(x, top + 5, 11, 5)
            }
            g.lineStyle(2, C.metal, 0.55).strokeRoundedRect(left + 8, top + 18, 194, 35, 4)
          }

          const drawLogisticsBays = (g: Phaser.GameObjects.Graphics, zone: WorldZoneLayout): void => {
            const left = zone.x + zone.width - 244
            const top = zone.y + 270
            g.fillStyle(C.metal, 0.2).fillRoundedRect(left, top, 212, 68, 8)
            for (let bay = 0; bay < 4; bay++) {
              const x = left + 10 + bay * 49
              g.lineStyle(2, C.roofBlue, 0.75).strokeRoundedRect(x, top + 9, 39, 49, 3)
              g.fillStyle(C.cream, 0.55).fillRect(x + 15, top + 13, 9, 3)
            }
          }

          const drawQuays = (g: Phaser.GameObjects.Graphics, zone: WorldZoneLayout): void => {
            const left = zone.x + 80
            const top = zone.y + zone.height - 86
            g.fillStyle(C.trunk, 0.4).fillRoundedRect(left, top, 320, 45, 7)
            for (let x = left + 7; x < left + 314; x += 18) g.lineStyle(1, C.cream, 0.38).lineBetween(x, top + 4, x, top + 41)
            g.fillStyle(C.waterLight, 0.4).fillRoundedRect(left + 8, top + 48, 304, 11, 5)
          }

          const drawGardenWalk = (g: Phaser.GameObjects.Graphics, zone: WorldZoneLayout): void => {
            const left = zone.x + 80
            const top = zone.y + 260
            g.fillStyle(C.sidewalk, 0.72).fillRoundedRect(left, top, 330, 34, 17)
            for (let x = left + 15; x < left + 320; x += 34) {
              g.fillStyle(C.leaf, 0.85).fillCircle(x, top + 7, 8)
              g.fillStyle(C.flowerPink, 0.9).fillCircle(x + 2, top + 5, 3)
            }
          }

          /** Static district storytelling layered onto the sourced Brăila plan without altering roads or collision. */
          export const drawBrailaDistrictIdentity = (
            g: Phaser.GameObjects.Graphics,
            zones: readonly WorldZoneLayout[] = WORLD_ZONES,
          ): void => {
            for (const zone of zones) {
              switch (profileFor(zone.id).cueKind) {
                case 'courtyard': drawCourtyard(g, zone); break
                case 'commerce-plaza': drawCommercePlaza(g, zone); break
                case 'industrial-yard': drawIndustrialYard(g, zone); break
                case 'logistics-bays': drawLogisticsBays(g, zone); break
                case 'quays': drawQuays(g, zone); break
                case 'garden-walk': drawGardenWalk(g, zone); break
              }
            }
          }

          /** Addresses are presentation only; real OSM street names continue to come from WORLD_ROADS. */
          export const renderBrailaAddressLabels = (scene: Phaser.Scene): void => {
            for (const plaque of BRAILA_ADDRESS_PLAQUES) {
              cityLabel(scene, plaque.x, plaque.y, `${plaque.number}`, 8, '#175574', '#fff4ce')
                .setDepth(7).setName(`address:${plaque.buildingId}`)
            }
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('game-web/src/world/urbanPresentation.ts')
          text = p.read_text()
          marker = "import { drawCityPavement } from './cityGround'\n"
          addition = marker + "import { drawBrailaDistrictIdentity, renderBrailaAddressLabels } from './brailaIdentity'\n"
          if "from './brailaIdentity'" not in text:
              text = text.replace(marker, addition)
          ground_marker = "  // Real city water and parks replace the former artificial canal pockets.\n  drawCityPavement"
          if 'drawBrailaDistrictIdentity(g, WORLD_ZONES)' not in text:
              text = text.replace(ground_marker, "  drawBrailaDistrictIdentity(g, WORLD_ZONES)\n\n  // Real city water and parks replace the former artificial canal pockets.\n  drawCityPavement")
          render_marker = "  WORLD_DECORATIONS.forEach((tree, index) => {\n"
          if 'renderBrailaAddressLabels(scene)' not in text:
              text = text.replace(render_marker, "  renderBrailaAddressLabels(scene)\n\n" + render_marker, 1)
          p.write_text(text)
          PY

          cat > game-web/tests/braila-identity.test.ts <<'EOF'
          import type Phaser from 'phaser'
          import { describe, expect, it } from 'vitest'
          import {
            BRAILA_ADDRESS_PLAQUES,
            BRAILA_DISTRICT_IDENTITY_PROFILES,
            drawBrailaDistrictIdentity,
          } from '../src/world/brailaIdentity'
          import { WORLD_BUILDINGS, WORLD_ROADS, WORLD_ZONES, WORLD_CITY_NAME } from '../src/world/worldLayout'

          const graphicsRecorder = () => {
            const calls: { method: string; args: unknown[] }[] = []
            const chain = new Proxy({}, {
              get: (_target, method: string) => (...args: unknown[]) => {
                calls.push({ method, args })
                return chain
              },
            })
            return { graphics: chain as Phaser.GameObjects.Graphics, calls }
          }

          describe('Brăila visible district identity', () => {
            it('uses Brăila as the single playable city identity', () => {
              expect(WORLD_CITY_NAME).toBe('Brăila')
            })

            it('gives every gameplay district a unique bounded visual cue', () => {
              expect(BRAILA_DISTRICT_IDENTITY_PROFILES).toHaveLength(WORLD_ZONES.length)
              expect(new Set(BRAILA_DISTRICT_IDENTITY_PROFILES.map(profile => profile.zoneId))).toEqual(
                new Set(WORLD_ZONES.map(zone => zone.id)),
              )
              expect(new Set(BRAILA_DISTRICT_IDENTITY_PROFILES.map(profile => profile.cueKind)).size).toBe(6)
              const mock = graphicsRecorder()
              drawBrailaDistrictIdentity(mock.graphics)
              expect(mock.calls.length).toBeGreaterThan(45)
              expect(mock.calls.length).toBeLessThan(180)
            })

            it('keeps real sourced Brăila street names instead of inventing a parallel street map', () => {
              const named = WORLD_ROADS.filter(road => Boolean(road.name))
              expect(named.length).toBeGreaterThan(50)
              expect(named.some(road => road.name === 'Piața Traian')).toBe(true)
              expect(named.some(road => road.name === 'Bulevardul Independenței')).toBe(true)
            })

            it('keeps address plaques bounded and attached to physical buildings', () => {
              expect(BRAILA_ADDRESS_PLAQUES.length).toBeGreaterThanOrEqual(12)
              expect(BRAILA_ADDRESS_PLAQUES.length).toBeLessThanOrEqual(18)
              expect(BRAILA_ADDRESS_PLAQUES.find(plaque => plaque.buildingId === 'main-hq')?.number).toBe(1)
              expect(BRAILA_ADDRESS_PLAQUES.find(plaque => plaque.buildingId === 'business-1')?.number).toBe(10)
              for (const plaque of BRAILA_ADDRESS_PLAQUES) {
                const building = WORLD_BUILDINGS.find(candidate => candidate.id === plaque.buildingId)
                expect(building, plaque.buildingId).toBeDefined()
                expect(plaque.x).toBeGreaterThanOrEqual(building!.x - building!.width / 2)
                expect(plaque.x).toBeLessThanOrEqual(building!.x + building!.width / 2)
                expect(plaque.y).toBeGreaterThanOrEqual(building!.y - building!.height / 2)
                expect(plaque.y).toBeLessThanOrEqual(building!.y + building!.height / 2)
              }
            })
          })
          EOF

          cat > 09_Development/AI_Reports/2026-09-08_128_BRAILA_IDENTITY_RECONCILIATION.md <<'EOF'
          # AI Report 128 — Brăila Identity Reconciliation

          **Date:** 2026-09-08
          **PR:** #540
          **Coordinates:** #539 #541 #327 #406

          ## Result

          The playable city now has one canonical identity: **Brăila**.

          This reconciliation rebuilds the visual-identity slice on top of the real-map Brăila runtime merged in #541. It removes the retired prototype city naming from repository text/data identifiers, keeps OSM-backed Brăila street names as the street-label authority, and preserves the useful bounded district/address presentation work without restoring a fictional street grid.

          ## Visible scope

          - six gameplay districts keep distinct cached environmental cues;
          - real OSM street names remain the only street-name source;
          - up to 18 representative physical buildings receive stable address plaques;
          - HQ remains address 1 and DROPi Marketplace remains address 10;
          - roads, source centerlines, collisions, entrances, deliveries, hero state and semantic zoom remain owned by the Brăila runtime from #541.

          ## Identity boundary

          Repository text/data identifiers use `braila` for the playable city. Brăila remains mapped to Romania and the source-backed locality identity already established by the world/country catalog.

          ## Acceptance

          Automated gates must pass before merge. After the canonical Railway deployment, owner Android review should verify district readability, real street labels, address plaques, navigation, active-delivery preservation and hero-position preservation across zoom levels.
          EOF

          if git grep -n -i 'cedar'; then
            echo 'ERROR: retired city identity still exists in tracked text'
            exit 1
          fi

          cd game-web
          npm ci
          npm test
          npm run build
          cd ..
          git diff --check

          git config user.name 'dropi-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile PR 540 with canonical Braila identity'
          git push --force-with-lease origin HEAD:openai/issue-539-district-identity-streets
