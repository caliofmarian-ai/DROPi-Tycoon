name: DT-00 Autonomous Pilot

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Pilot queue Issue number; must already be present in runtime-pilot.json'
        required: false
        type: number
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: dt00-autonomous-pilot
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write

jobs:
  execute-bounded-pilot:
    name: Execute cost-bounded pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout canonical main without persisted GitHub credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Verify deterministic governance before any metered decision
        run: |
          set -euo pipefail
          node --test 09_Development/AutonomousAgents/evaluate-merge-gate.test.mjs
          node 09_Development/AI_Project_Memory/validate-memory.mjs

      - name: Read canonical policy, cost hold and bounded pilot queue
        id: policy
        env:
          REQUESTED_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.issue_number || '' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const policy = JSON.parse(fs.readFileSync('09_Development/AI_Project_Memory/AUTONOMOUS_AGENT_POLICY.json', 'utf8'))
          const pilot = JSON.parse(fs.readFileSync('09_Development/AutonomousAgents/runtime-pilot.json', 'utf8'))
          const requested = String(process.env.REQUESTED_ISSUE || '').trim()
          const issue = requested ? Number(requested) : Number(pilot.scheduledIssueQueue?.[0])
          if (!Number.isInteger(issue)) throw new Error('No valid pilot Issue is configured')
          if (!pilot.scheduledIssueQueue.includes(issue)) throw new Error(`Issue #${issue} is outside the bounded pilot queue`)
          if (pilot.pilotMaxConcurrentIssues !== 1) throw new Error('Pilot concurrency must remain exactly 1')
          if (pilot.meteredRuntime?.maxOpenAICallsPerOrchestratorRun !== 2) throw new Error('Pilot must remain capped at two OpenAI calls per run')
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `automation_enabled=${policy.automation_enabled === true}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `cost_hold=${pilot.costHold === true}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `issue_number=${issue}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `max_attempts_24h=${Number(pilot.meteredRuntime?.maxImplementationAttemptsPer24Hours ?? 0)}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `implementation_model=${pilot.meteredRuntime?.implementationModel || ''}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `implementation_effort=${pilot.meteredRuntime?.implementationEffort || ''}\n`)
          NODE

      - name: HOLD - block every metered OpenAI call
        if: steps.policy.outputs.cost_hold == 'true'
        run: |
          echo 'DT-00 COST HOLD is active. No OpenAI call is authorized in this run.'
          echo 'cost_state=HOLD'

      - name: Stop cleanly when autonomous policy is disabled
        if: steps.policy.outputs.cost_hold != 'true' && steps.policy.outputs.automation_enabled != 'true'
        run: echo 'automation_enabled=false; no Issue will be dispatched.'

      - name: Resolve eligible pilot work and enforce 24h attempt ceiling
        id: select
        if: steps.policy.outputs.cost_hold != 'true' && steps.policy.outputs.automation_enabled == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.policy.outputs.issue_number }}
          MAX_ATTEMPTS_24H: ${{ steps.policy.outputs.max_attempts_24h }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs')
            const issueNumber = Number(process.env.ISSUE_NUMBER)
            const maxAttempts24h = Number(process.env.MAX_ATTEMPTS_24H)
            const { owner, repo } = context.repo
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber })
            const labels = (issue.labels || []).map((label) => typeof label === 'string' ? label : label.name).filter(Boolean)
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issueNumber, per_page: 100 })

            if (issue.state !== 'open' || !labels.includes('automation')) {
              core.setOutput('mode', 'idle')
              core.setOutput('reason', issue.state !== 'open' ? 'ISSUE_NOT_OPEN' : 'AUTOMATION_LABEL_MISSING')
              return
            }
            if (comments.some((comment) => (comment.body || '').includes('<!-- DT00-PILOT-VALIDATED -->'))) {
              core.setOutput('mode', 'idle')
              core.setOutput('reason', 'PILOT_ALREADY_VALIDATED')
              return
            }

            const openPrs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 })
            const branchPrefix = `dt00/auto-${issueNumber}-`
            const matches = openPrs.filter((pr) => pr.head?.ref?.startsWith(branchPrefix))
            if (matches.length > 1) {
              core.setFailed('Multiple active DT-00 pilot PRs detected; duplicate execution fails closed.')
              return
            }
            if (matches.length === 1) {
              const pr = matches[0]
              core.setOutput('mode', 'resume')
              core.setOutput('resume_pr_number', String(pr.number))
              return
            }

            const cutoff = Date.now() - 24 * 60 * 60 * 1000
            const attempts24h = comments.filter((comment) =>
              (comment.body || '').includes('<!-- DT00-AUTO-ATTEMPT -->') &&
              new Date(comment.created_at).getTime() >= cutoff
            ).length
            if (maxAttempts24h < 1 || attempts24h >= maxAttempts24h) {
              core.setOutput('mode', 'idle')
              core.setOutput('reason', 'DAILY_METERED_ATTEMPT_CEILING')
              return
            }

            fs.mkdirSync('.dt00', { recursive: true })
            const task = `You are the DT-00 IMPLEMENTATION agent, not the auditor or merge authority.\n` +
              `Work only on Issue #${issueNumber}: ${issue.title}.\n` +
              `Do not scan the repository broadly. Read only BOOTSTRAP.md, AUTONOMOUS_MULTI_AGENT_OPERATION.md, AI_AGENT_EXECUTION_PROTOCOL.md, DT00_RUNTIME_PILOT.md, runtime-pilot.json and directly relevant files.\n` +
              `You may create or modify files ONLY under 09_Development/AutonomousAgents/runtime/.\n` +
              `Never modify workflows, policy, evaluator, schemas, pilot configuration, game-web, game-mobile, secrets, billing, legal authority or external services.\n` +
              `Do not commit, push, call GitHub APIs or read credentials. UNKNOWN stays UNKNOWN.\n` +
              `Implement the smallest useful bounded slice, run only targeted offline tests, and return only JSON matching implementation-result.schema.json.\n\n` +
              `<issue-requirements>\n${issue.body || ''}\n</issue-requirements>\n`
            fs.writeFileSync('.dt00/task.md', task)

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `<!-- DT00-AUTO-ATTEMPT -->\nDT-00 cost-bounded pilot claimed one metered implementation attempt. Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            })
            core.setOutput('mode', 'implement')

      - name: Detect OpenAI runtime credential without exposing it
        id: credential
        if: steps.select.outputs.mode == 'implement'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi

      - name: Fail closed when OpenAI authentication evidence is missing
        if: steps.select.outputs.mode == 'implement' && steps.credential.outputs.ready != 'true'
        run: |
          echo '::error::OPENAI_API_KEY absent; authentication evidence UNKNOWN.'
          exit 1

      - name: Run one low-cost bounded Codex implementation call
        id: implement
        if: steps.select.outputs.mode == 'implement' && steps.credential.outputs.ready == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          model: ${{ steps.policy.outputs.implementation_model }}
          effort: ${{ steps.policy.outputs.implementation_effort }}
          prompt-file: '.dt00/task.md'
          output-file: '.dt00/implementation-result.json'
          output-schema-file: '09_Development/AutonomousAgents/schemas/implementation-result.schema.json'
          allow-bots: true
          allow-bot-users: 'github-actions[bot]'

      - name: Validate result and protected-path boundary before PR
        id: validate
        if: steps.select.outputs.mode == 'implement'
        run: |
          set -euo pipefail
          test -s .dt00/implementation-result.json
          cp .dt00/implementation-result.json /tmp/dt00-implementation-result.json
          STATUS="$(jq -r '.status' /tmp/dt00-implementation-result.json)"
          HARD_STOP="$(jq -r '.hard_stop_detected' /tmp/dt00-implementation-result.json)"
          UNKNOWNS="$(jq '.unknowns | length' /tmp/dt00-implementation-result.json)"
          BAD_TESTS="$(jq '[.tests[] | select(.status != "PASS")] | length' /tmp/dt00-implementation-result.json)"
          rm -rf .dt00

          if [ "$STATUS" != 'READY' ] || [ "$HARD_STOP" = 'true' ] || [ "$UNKNOWNS" -ne 0 ] || [ "$BAD_TESTS" -ne 0 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t CHANGED < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //')
          test "${#CHANGED[@]}" -gt 0
          for path in "${CHANGED[@]}"; do
            case "$path" in
              09_Development/AutonomousAgents/runtime/*) ;;
              *) echo "::error::Implementation crossed protected path: $path"; exit 1 ;;
            esac
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Preserve implementation evidence
        if: steps.select.outputs.mode == 'implement' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dt00-implementation-${{ steps.policy.outputs.issue_number }}-${{ github.run_id }}
          path: /tmp/dt00-implementation-result.json
          if-no-files-found: warn
          retention-days: 7

      - name: Create deterministic branch and PR after implementation PASS
        id: pr
        if: steps.select.outputs.mode == 'implement' && steps.validate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.policy.outputs.issue_number }}
        run: |
          set -euo pipefail
          BRANCH="dt00/auto-${ISSUE_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git config user.name 'DT-00 Autonomous Runtime'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 09_Development/AutonomousAgents/runtime/
          git commit -m "DT-00: autonomous bounded slice for issue #${ISSUE_NUMBER}"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "[DT-00 AUTO PILOT] #${ISSUE_NUMBER} bounded runtime slice" --body "Cost-bounded autonomous pilot. Implementation uses one GPT-5.6 Luna low-effort call. Independent audit is explicit and exact-head bound. Missing evidence blocks merge.")"
          echo "number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve active PR context
        id: active
        if: steps.select.outputs.mode == 'resume' || steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.select.outputs.mode }}
          RESUME_PR: ${{ steps.select.outputs.resume_pr_number }}
          NEW_PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ "$MODE" = 'resume' ]; then PR_NUMBER="$RESUME_PR"; else PR_NUMBER="$NEW_PR"; fi
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          BRANCH="$(jq -r '.head.ref' <<<"$PR_JSON")"
          HEAD_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          MERGE_BASE="$(gh api "repos/$GITHUB_REPOSITORY/compare/${MAIN_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          test "$MERGE_BASE" = "$MAIN_SHA"

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename' >/tmp/dt00-pr-files.txt
          while IFS= read -r path; do
            case "$path" in
              09_Development/AutonomousAgents/runtime/*) ;;
              *) echo "::error::Autonomous PR contains protected path: $path"; exit 1 ;;
            esac
          done </tmp/dt00-pr-files.txt

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Run free deterministic exact-head pre-audit before any audit spend
        if: steps.active.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.active.outputs.branch }}
          HEAD_SHA: ${{ steps.active.outputs.head_sha }}
          BASE_SHA: ${{ steps.active.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git checkout --detach "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node --test 09_Development/AutonomousAgents/evaluate-merge-gate.test.mjs
          node 09_Development/AI_Project_Memory/validate-memory.mjs

          COUNT="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | wc -l | tr -d ' ')"
          BYTES="$(git diff --no-ext-diff "$BASE_SHA" "$HEAD_SHA" | wc -c | tr -d ' ')"
          test "$COUNT" -gt 0
          test "$COUNT" -le 20
          test "$BYTES" -le 250000

          while IFS= read -r json; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$json"; done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.json')

      - name: Reuse existing exact-head audit or dispatch exactly one AI audit
        id: audit
        if: steps.active.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.active.outputs.pr_number }}
          BRANCH: ${{ steps.active.outputs.branch }}
          HEAD_SHA: ${{ steps.active.outputs.head_sha }}
          BASE_SHA: ${{ steps.active.outputs.base_sha }}
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/autonomous-agent-governance.yml/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=100")"
          EXISTING="$(jq -r --arg sha "$HEAD_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .status == "completed")] | sort_by(.created_at) | last | .id // empty' <<<"$RUNS")"
          if [ -n "$EXISTING" ]; then
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXISTING" --jq '.conclusion')"
            echo "run_id=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh workflow run autonomous-agent-governance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH" \
            -f audit_pr_number="$PR_NUMBER" \
            -f audit_head_sha="$HEAD_SHA" \
            -f audit_base_sha="$BASE_SHA" \
            -f run_ai_audit=true

          RUN_ID=''
          for _ in $(seq 1 24); do
            sleep 5
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-agent-governance.yml --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" | head -n 1)"
            [ -n "$RUN_ID" ] && break
          done
          test -n "$RUN_ID"
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then CONCLUSION=success; else CONCLUSION=failure; fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Stop fail-closed when independent audit is not PASS
        if: steps.active.outputs.pr_number != '' && steps.audit.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.policy.outputs.issue_number }}
          PR_NUMBER: ${{ steps.active.outputs.pr_number }}
          HEAD_SHA: ${{ steps.active.outputs.head_sha }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "DT-00 cost-bounded pilot: REWORK — independent audit did not PASS for PR #${PR_NUMBER} exact head ${HEAD_SHA}. No second AI audit will run for this head."
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch || gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"

      - name: Evaluate deterministic merge gate after exact-head audit PASS
        id: gate
        if: steps.active.outputs.pr_number != '' && steps.audit.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.policy.outputs.issue_number }}
          PR_NUMBER: ${{ steps.active.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.active.outputs.head_sha }}
          EXPECTED_BASE: ${{ steps.active.outputs.base_sha }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          FINAL_HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          test "$FINAL_HEAD" = "$EXPECTED_HEAD"
          test "$CURRENT_MAIN" = "$EXPECTED_BASE"
          test "$(jq -r '.mergeable' <<<"$PR_JSON")" != 'false'

          cat > /tmp/dt00-merge-evidence.json <<EOF
          {
            "issue": ${ISSUE_NUMBER},
            "pr": ${PR_NUMBER},
            "gates": {
              "scope_authorized": "PASS",
              "ownership_reconciled": "PASS",
              "canonical_main_reconciled": "PASS",
              "exact_head_identified": "PASS",
              "required_tests": "PASS",
              "required_ci": "PASS",
              "independent_audit": "PASS",
              "mergeability": "PASS"
            },
            "risk": {
              "playerVisible": false,
              "deploymentAffecting": false,
              "persistenceAffecting": false,
              "legalCommercialClaimAffecting": false
            },
            "unresolvedRequiredEvidence": [],
            "prohibitedActionDetected": false,
            "implementerAgentIds": ["codex-luna-implementation-${GITHUB_RUN_ID}"],
            "independentAuditorAgentIds": ["codex-luna-audit-${{ steps.audit.outputs.run_id }}"],
            "finalHeadSha": "${FINAL_HEAD}",
            "auditedHeadSha": "${FINAL_HEAD}",
            "ciHeadSha": "${FINAL_HEAD}"
          }
          EOF
          node 09_Development/AutonomousAgents/evaluate-merge-gate.mjs /tmp/dt00-merge-evidence.json
          echo "final_head=$FINAL_HEAD" >> "$GITHUB_OUTPUT"

      - name: Merge only exact audited head
        id: merge
        if: steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.active.outputs.pr_number }}
          FINAL_HEAD: ${{ steps.gate.outputs.final_head }}
        run: |
          set -euo pipefail
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$FINAL_HEAD" -f merge_method='squash' >/tmp/dt00-merge.json
          test "$(jq -r '.merged' /tmp/dt00-merge.json)" = 'true'
          echo "merge_sha=$(jq -r '.sha' /tmp/dt00-merge.json)" >> "$GITHUB_OUTPUT"

      - name: Verify exact post-merge main without another AI call
        id: postmerge
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout --detach origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          node --test 09_Development/AutonomousAgents/evaluate-merge-gate.test.mjs
          node 09_Development/AI_Project_Memory/validate-memory.mjs
          gh workflow run autonomous-agent-governance.yml --repo "$GITHUB_REPOSITORY" --ref main -f run_ai_audit=false

      - name: Persist successful Romanian pilot report and stop future pilot spend
        if: steps.postmerge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.policy.outputs.issue_number }}
          PR_NUMBER: ${{ steps.active.outputs.pr_number }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          cat > /tmp/dt00-success.md <<EOF
          <!-- DT00-AUTO-SUCCESS -->
          <!-- DT00-PILOT-VALIDATED -->
          DT-00 pilot automat: PASS.

          - PR #${PR_NUMBER}: merged numai după preflight determinist + un audit independent exact-head;
          - model implementare/audit: GPT-5.6 Luna, low effort;
          - noul main: ${MERGE_SHA};
          - post-merge deterministic verification: PASS;
          - pilotul se oprește după această validare.
          EOF
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/dt00-success.md
