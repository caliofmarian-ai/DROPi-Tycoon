name: Temporary clean PR 540 real geography

on:
  push:
    branches:
      - openai/issue-539-district-identity-streets

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: openai/issue-539-district-identity-streets
      - name: Restore unrelated real-world Cedar toponyms and revalidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            game-web/public/data/expanded-localities-v1/countries/036/admin1/04.json \
            game-web/public/data/expanded-localities-v1/countries/124/admin1/01.json \
            game-web/public/data/expanded-localities-v1/countries/124/admin1/02.json \
            game-web/public/data/expanded-localities-v1/countries/124/admin1/08.json \
            game-web/public/data/physical-geography-v1/features.json

          if git grep -n -i -E 'cedar-city|Cedar City' -- ':!.github/workflows/tmp-*'; then
            echo 'ERROR: retired Cedar City identity remains outside temporary workflows'
            exit 1
          fi
          if git grep -n -i 'cedar' -- \
            04_World/City_Plans \
            game-web/src/world \
            game-web/public/data/playable-city-location-v1.json \
            'game-web/tests/city-*'; then
            echo 'ERROR: Cedar remnants remain in playable-city scope'
            exit 1
          fi

          cd game-web
          npm ci
          npm test
          npm run build
          cd ..
          git diff --check

          git config user.name 'dropi-reconciliation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            game-web/public/data/expanded-localities-v1/countries/036/admin1/04.json \
            game-web/public/data/expanded-localities-v1/countries/124/admin1/01.json \
            game-web/public/data/expanded-localities-v1/countries/124/admin1/02.json \
            game-web/public/data/expanded-localities-v1/countries/124/admin1/08.json \
            game-web/public/data/physical-geography-v1/features.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Restore unrelated real-world Cedar toponyms'
          git push origin HEAD:openai/issue-539-district-identity-streets
