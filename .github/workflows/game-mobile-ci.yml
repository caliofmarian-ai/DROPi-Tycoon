name: DROPi Tycoon Mobile Shell CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-mobile-shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.13
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            game-mobile/package-lock.json
            game-web/package-lock.json

      - name: Install mobile dependencies deterministically
        run: npm ci

      - name: Prepare and validate bundled Phaser production runtime
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE: bundled
        run: |
          npm run runtime:prepare
          npm run runtime:validate

      - name: Release version validation
        run: npm run version:validate

      - name: TypeScript validation
        run: npm run typecheck

      - name: Expo production configuration validation
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE: bundled
        run: npx expo config --type public >/tmp/dropi-tycoon-expo-config.json

      - name: Expo Doctor validation
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE: bundled
        run: npm run doctor
