name: Integrate Continuous Orders

on:
  push:
    branches:
      - openai/release-blocker-continuous-orders

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/release-blocker-continuous-orders
          fetch-depth: 0
      - run: python3 scripts/integrate_continuous_orders.py
      - run: |
          grep -q "createNextOrder" game-web/src/scenes/GameWorldScene.ts
          grep -q "spawnNextAvailableOrder" game-web/src/scenes/GameWorldScene.ts
          grep -q "this.packageSprite.setPosition" game-web/src/scenes/GameWorldScene.ts
          grep -q "expectedPickupLocation: this.worldState.activeOrder.pickupLocation" game-web/src/scenes/GameWorldScene.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-web/src/scenes/GameWorldScene.ts
          git commit -m "feat: continue gameplay with generated delivery orders"
          git push origin HEAD:openai/release-blocker-continuous-orders
