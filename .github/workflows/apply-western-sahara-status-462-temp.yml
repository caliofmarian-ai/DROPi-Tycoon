name: TEMP Apply Western Sahara Status Reconciliation

on:
  push:
    branches:
      - openai/western-sahara-status-462
    paths:
      - 'scripts/apply_western_sahara_462_temp.py'
      - '.github/workflows/apply-western-sahara-status-462-temp.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/western-sahara-status-462
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check pycountry
      - name: Apply governed territory-status correction
        run: |
          set -euo pipefail
          python scripts/apply_western_sahara_462_temp.py
          git diff --check
      - name: Regenerate audit manifests and verify
        run: |
          set -euo pipefail
          python scripts/build_country_catalog_chapters.py --all
          python scripts/verify_country_catalog_chapters.py --write-report
          git diff --check
      - name: Commit product changes and remove temporary runners
        run: |
          set -euo pipefail
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_western_sahara_462_temp.py .github/workflows/apply-western-sahara-status-462-temp.yml
          git add \
            game-web/src/world/countrySemanticMetadata.ts \
            game-web/public/data/country-semantic-metadata-v1.json \
            game-web/tests \
            scripts/build_country_catalog_chapters.py \
            04_World/COUNTRY_LAYER_LOCALITY_DATASET.md \
            04_World/Country_Catalog/COUNTRY_REVIEW_REGISTRY.json \
            04_World/Country_Catalog/COUNTRY_SEMANTIC_METADATA.md \
            04_World/Country_Catalog/SPECIAL_TERRITORY_CLASSIFICATION.md \
            04_World/Country_Catalog/Continents \
            04_World/Country_Catalog/GLOBAL_COUNTRY_CATALOG_AUDIT.md
          git diff --cached --check
          git commit -m 'fix: govern Western Sahara territory status'
          git push origin HEAD:openai/western-sahara-status-462
