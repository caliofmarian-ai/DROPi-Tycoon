name: TEMP Estonia Regional Materializer

on:
  push:
    branches:
      - openai/europe-estonia-regional-localities-536
    paths:
      - .github/workflows/estonia-regional-audit-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download retained GeoNames assets
        run: |
          set -euo pipefail
          base='https://github.com/caliofmarian-ai/DROPi-Tycoon/releases/download/source-geonames-cities500-2026-09-08-f3cda4f9'
          curl -fsSL "$base/cities500.zip" -o /tmp/cities500.zip
          curl -fsSL "$base/admin1CodesASCII.txt" -o /tmp/admin1CodesASCII.txt
          printf '%s  %s\n' 'f3cda4f9d256d90045121fb8eebad3ed91695c32370ed93b50fbe0cb616e2bbd' /tmp/cities500.zip | sha256sum -c -
          printf '%s  %s\n' '590651498043f674accda2b7f46d21286cda0e290b02f8561c5005eee9a5448c' /tmp/admin1CodesASCII.txt | sha256sum -c -
      - name: Generate and verify Estonia
        run: |
          set -euo pipefail
          python scripts/build_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/ESTONIA_REGIONAL_CONFIG.json \
            --cities-zip /tmp/cities500.zip \
            --admin1 /tmp/admin1CodesASCII.txt \
            --out game-web/public/data/europe-estonia-regional-localities-v1.json \
            --doc 04_World/Country_Catalog/Continents/Europe/ESTONIA_REGIONAL_LOCALITIES.md
          python scripts/verify_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/ESTONIA_REGIONAL_CONFIG.json \
            --data game-web/public/data/europe-estonia-regional-localities-v1.json
      - name: Run targeted test and production build
        working-directory: game-web
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/estonia-regional-localities.test.ts
          npm run build
      - name: Commit generated country slice and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/estonia-regional-audit-temp.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            04_World/Country_Catalog/Continents/Europe/ESTONIA_REGIONAL_LOCALITIES.md \
            game-web/public/data/europe-estonia-regional-localities-v1.json \
            .github/workflows/estonia-regional-audit-temp.yml
          git commit -m 'world: materialize Estonia county regional localities'
          git push origin HEAD:openai/europe-estonia-regional-localities-536
