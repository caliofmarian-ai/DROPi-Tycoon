name: RBATCH-011 Planning Reconcile

on:
  push:
    branches:
      - openai/rbatch-011-mainmenu-flow

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: openai/rbatch-011-mainmenu-flow
          fetch-depth: 0

      - name: Apply deterministic planning reconciliation
        run: python3 scripts/reconcile_rbatch_011_planning.py

      - name: Verify expected scope markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RBATCH-010 | 1 | M-005 | E-011 | HUD + Notifications | MERGED — pending Railway/public verification' 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F 'RBATCH-011 | 1 | M-005 | E-012 | MainMenu Flow | Draft PR #254 — pending independent review' 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F 'ISSUE-008 | Implement required MainMenu flow | RBATCH-011' 09_Development/Planning/ISSUE_CATALOG.md
          grep -F 'ISSUE-009 | Implement new-game overwrite guard | RBATCH-014 | E-015 | M-007' 09_Development/Planning/ISSUE_CATALOG.md
          grep -F 'REQ-111 and REQ-118..REQ-120 remain owned by BATCH-013' 09_Development/Implementation_Preparation/IMPLEMENTATION_BATCH_PLAN.md

      - name: Commit reconciliation if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_Project/PROJECT_STATUS.md \
            09_Development/CHANGELOG.md \
            09_Development/Implementation_Preparation/IMPLEMENTATION_BATCH_PLAN.md \
            09_Development/Planning/BATCH_ARCHITECTURE.md \
            09_Development/Planning/ISSUE_CATALOG.md \
            09_Development/Planning/github_creation_plan.yaml
          git commit -m 'docs: reconcile RBATCH-010/011 planning state'
          git push origin HEAD:openai/rbatch-011-mainmenu-flow
