name: Temporary Expo 57.0.23 lock sync

on:
  push:
    branches:
      - story/recovery-opening-v2

permissions:
  contents: write

jobs:
  sync-expo-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v7
        with:
          ref: story/recovery-opening-v2
          fetch-depth: 0
      - name: Setup Node 22.13
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Synchronize Expo patch and npm lockfile
        working-directory: game-mobile
        run: npx --yes npm@10.9.2 install expo@~57.0.23 --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- game-mobile/package.json game-mobile/package-lock.json; then
            echo "Expo package and lockfile already synchronized."
            exit 0
          fi
          git config user.name "dropi-ci"
          git config user.email "dropi-ci@users.noreply.github.com"
          git add game-mobile/package.json game-mobile/package-lock.json
          git commit -m "[DT-04] Sync Expo 57.0.23 mobile lockfile"
          git push origin HEAD:story/recovery-opening-v2
