name: DROPi Tycoon Prototype CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: game-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full automated test suite
        run: npm test

      - name: TypeScript and production build
        run: npm run build

      - name: Production server HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/dropi-tycoon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/dropi-tycoon-index.html; then
              test -s /tmp/dropi-tycoon-index.html
              echo "HTTP smoke test: PASS"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dropi-tycoon-server.log
          exit 1

      - name: PR-range whitespace validation
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD

      - name: Confirm archived Game runtime unchanged
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only origin/main...HEAD | grep -q '^Game/'; then
            echo 'Archived Game/ files changed unexpectedly.'
            git diff --name-only origin/main...HEAD | grep '^Game/'
            exit 1
          fi
          echo 'Archived Game/ unchanged: PASS'

      - name: Validate canonical planning YAML syntax
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          path = '09_Development/Planning/github_creation_plan.yaml'
          with open(path, encoding='utf-8') as handle:
              data = yaml.safe_load(handle)
          assert isinstance(data, dict)
          assert data['metadata']['counts']['milestones'] == 21
          assert data['metadata']['counts']['epics'] == 46
          assert data['metadata']['counts']['batches'] == 54
          assert data['metadata']['counts']['executable_issues'] == 34
          print('Planning YAML syntax/count validation: PASS')
          PY

      - name: Validate active planning crosswalk
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          path = '09_Development/Planning/github_creation_plan.yaml'
          with open(path, encoding='utf-8') as handle:
              data = yaml.safe_load(handle)

          batches = {item['id']: item for item in data['batches']}
          epics = {item['id']: item for item in data['epics']}
          issues = {item['id']: item for item in data['issues']}

          assert 'MERGED' in batches['RBATCH-010']['status']
          assert batches['RBATCH-011']['status'].startswith('PR #255')
          assert 'MERGED' in epics['E-011']['status']
          assert epics['E-012']['status'].startswith('PR #255')

          assert issues['ISSUE-008']['batch_id'] == 'RBATCH-011'
          assert issues['ISSUE-008']['epic_id'] == 'E-012'
          assert issues['ISSUE-008']['milestone_id'] == 'M-005'
          assert 'status:in-progress' in issues['ISSUE-008']['label_names']

          assert issues['ISSUE-009']['batch_id'] == 'RBATCH-014'
          assert issues['ISSUE-009']['epic_id'] == 'E-015'
          assert issues['ISSUE-009']['milestone_id'] == 'M-007'
          assert issues['ISSUE-009']['blocked_or_owner_gate'] == 'ODR-001, ODR-003'
          assert 'status:blocked' in issues['ISSUE-009']['label_names']

          print('Active planning crosswalk validation: PASS')
          PY
