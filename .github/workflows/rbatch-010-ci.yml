name: DROPi Tycoon Prototype CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: game-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full automated test suite
        run: npm test

      - name: TypeScript and production build
        run: npm run build

      - name: Production server HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/dropi-tycoon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/dropi-tycoon-index.html; then
              test -s /tmp/dropi-tycoon-index.html
              echo "HTTP smoke test: PASS"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dropi-tycoon-server.log
          exit 1

      - name: PR-range whitespace validation
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD

      - name: Confirm archived Game runtime unchanged
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only origin/main...HEAD | grep -q '^Game/'; then
            echo 'Archived Game/ files changed unexpectedly.'
            git diff --name-only origin/main...HEAD | grep '^Game/'
            exit 1
          fi
          echo 'Archived Game/ unchanged: PASS'

      - name: Validate canonical planning YAML syntax
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml

          path = '09_Development/Planning/github_creation_plan.yaml'
          with open(path, encoding='utf-8') as handle:
              data = yaml.safe_load(handle)

          assert isinstance(data, dict)
          assert data['metadata']['counts']['milestones'] == 21
          assert data['metadata']['counts']['epics'] == 46
          assert data['metadata']['counts']['batches'] == 54
          assert data['metadata']['counts']['executable_issues'] == 34
          print('Planning YAML syntax/count validation: PASS')
          PY

      - name: Validate active planning crosswalk
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml

          path = '09_Development/Planning/github_creation_plan.yaml'
          with open(path, encoding='utf-8') as handle:
              data = yaml.safe_load(handle)

          milestones = {item['id']: item for item in data['milestones']}
          batches = {item['id']: item for item in data['batches']}
          epics = {item['id']: item for item in data['epics']}
          issues = {item['id']: item for item in data['issues']}

          assert milestones['M-006']['status'] == 'In Progress'
          assert milestones['M-007']['status'] == 'In Progress'
          assert milestones['M-007']['owner_gates'].startswith('RESOLVED')
          assert milestones['M-008']['status'].startswith('COMPLETED')
          assert milestones['M-008']['owner_gates'].startswith('RESOLVED 2026-09-02')
          assert milestones['M-009']['status'] == 'In Progress'
          assert milestones['M-009']['owner_gates'].startswith('RESOLVED 2026-09-02')

          for batch_id in ('RBATCH-010', 'RBATCH-011', 'RBATCH-012', 'RBATCH-013', 'RBATCH-014', 'RBATCH-016'):
              assert 'MERGED' in batches[batch_id]['status']
          assert batches['RBATCH-014']['owner_gates'].startswith('RESOLVED')
          assert batches['RBATCH-015']['status'].startswith('COMPLETED')
          assert batches['RBATCH-017']['status'].startswith('COMPLETED')
          assert batches['RBATCH-017']['owner_gates'].startswith('RESOLVED 2026-09-02')
          assert batches['RBATCH-018']['status'].startswith('READY FOR IMPLEMENTATION')
          assert batches['RBATCH-018']['owner_gates'].startswith('RESOLVED 2026-09-02')

          for epic_id in ('E-011', 'E-012', 'E-013', 'E-014', 'E-015'):
              assert 'MERGED' in epics[epic_id]['status']
          assert epics['E-016']['status'].startswith('COMPLETED')
          assert epics['E-017']['status'].startswith('COMPLETED')
          assert epics['E-018']['status'].startswith('READY')

          done_issue_ids = (
              'ISSUE-008', 'ISSUE-009', 'ISSUE-010', 'ISSUE-011', 'ISSUE-012', 'ISSUE-013',
              'ISSUE-014', 'ISSUE-015', 'ISSUE-016', 'ISSUE-017', 'ISSUE-018', 'ISSUE-019',
              'ISSUE-020', 'ISSUE-021', 'ISSUE-022', 'ISSUE-023',
          )
          for issue_id in done_issue_ids:
              assert issues[issue_id]['status'].startswith('COMPLETED')
              assert 'status:done' in issues[issue_id]['label_names']

          for issue_id in ('ISSUE-024', 'ISSUE-026', 'ISSUE-032'):
              assert issues[issue_id]['batch_id'] == 'RBATCH-018'
              assert issues[issue_id]['epic_id'] == 'E-018'
              assert issues[issue_id]['milestone_id'] == 'M-009'
              assert issues[issue_id]['status'].startswith('READY')
              assert issues[issue_id]['blocked_or_owner_gate'].startswith('RESOLVED 2026-09-02')
              assert 'status:ready' in issues[issue_id]['label_names']

          print('Active planning crosswalk validation: PASS')
          PY

      - name: Validate Prototype v0.1 owner progression gate
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checklist = Path('09_Development/PROTOTYPE_RELEASE_CHECKLIST.md').read_text(encoding='utf-8')
          evidence = Path('09_Development/Release_Evidence/PROTOTYPE_V0.1_RELEASE_EVIDENCE.md').read_text(encoding='utf-8')
          owner = Path('09_Development/Release_Evidence/PROTOTYPE_V0.1_OWNER_REVIEW_PACKAGE.md').read_text(encoding='utf-8')
          report = Path('09_Development/AI_Reports/2026-09-02_099_M008_OWNER_SIGNOFF_M009_ACTIVATION.md').read_text(encoding='utf-8')

          assert 'Project opens correctly in GDevelop' not in checklist
          assert 'Deployable web runtime opens correctly' in checklist
          assert 'FINAL OWNER SIGN-OFF RECORDED — PHASE-2 PROGRESSION AUTHORIZED' in checklist
          assert 'FINAL OWNER SIGN-OFF RECORDED — PHASE-2 PROGRESSION AUTHORIZED' in evidence
          assert 'FINAL OWNER PROGRESSION SIGN-OFF — RECORDED 2026-09-02' in owner
          assert 'M-009 is activated' in report
          assert 'No unobserved historical manual check is fabricated' in report
          assert 'not the final product-quality target' in report
          print('Prototype v0.1 owner progression gate: PASS')
          PY
