name: Normalize Country Catalog EOF

on:
  push:
    branches:
      - openai/country-catalog-chapters-v1
    paths:
      - .github/workflows/fix-country-catalog-eof.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-catalog-chapters-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry
      - name: Normalize generator output and Europe manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_country_catalog_chapters.py')
          text = path.read_text()
          text = text.replace("path.write_text(country_markdown(continent, row, nodes, catalog) + '\\n')", "path.write_text(country_markdown(continent, row, nodes, catalog).rstrip() + '\\n')")
          text = text.replace("path.write_text(markdown_for_continent(continent, rows, catalog) + '\\n')", "path.write_text(markdown_for_continent(continent, rows, catalog).rstrip() + '\\n')")
          path.write_text(text)
          PY
          python scripts/build_country_catalog_chapters.py --continent Europe
          git diff --check
      - name: Commit normalized generated output
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build_country_catalog_chapters.py 04_World/Country_Catalog/Continents/europe.md
          git commit -m 'world-data: normalize generated country catalog EOF'
          git push origin HEAD:openai/country-catalog-chapters-v1
