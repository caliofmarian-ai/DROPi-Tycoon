name: Autonomous Agent Governance

on:
  pull_request:
    paths:
      - '09_Development/AUTONOMOUS_MULTI_AGENT_OPERATION.md'
      - '09_Development/AI_AGENT_EXECUTION_PROTOCOL.md'
      - '09_Development/AI_Project_Memory/AUTONOMOUS_AGENT_POLICY.json'
      - '09_Development/AutonomousAgents/**'
      - '.github/workflows/autonomous-agent-governance.yml'
      - '.github/workflows/dt00-autonomous-pilot.yml'
  push:
    branches: [main]
    paths:
      - '09_Development/AUTONOMOUS_MULTI_AGENT_OPERATION.md'
      - '09_Development/AI_AGENT_EXECUTION_PROTOCOL.md'
      - '09_Development/AI_Project_Memory/AUTONOMOUS_AGENT_POLICY.json'
      - '09_Development/AutonomousAgents/**'
      - '.github/workflows/autonomous-agent-governance.yml'
      - '.github/workflows/dt00-autonomous-pilot.yml'
  workflow_dispatch:
    inputs:
      audit_pr_number:
        description: 'PR number for explicit autonomous exact-head audit'
        required: false
        type: string
      audit_head_sha:
        description: 'Exact 40-char PR head SHA to audit'
        required: false
        type: string
      audit_base_sha:
        description: 'Exact 40-char base SHA for the audited diff'
        required: false
        type: string
      run_ai_audit:
        description: 'Explicitly authorize one metered OpenAI audit call for this dispatch'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-autonomous-agent-contract:
    name: Validate autonomous-agent contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.audit_head_sha || github.sha) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact target checkout
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$TARGET_HEAD"
          echo "exact_head=$ACTUAL_HEAD"

      - name: Validate policy JSON
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('09_Development/AI_Project_Memory/AUTONOMOUS_AGENT_POLICY.json','utf8')); if(p.automation_enabled!==true) throw new Error('automation_enabled must be explicit'); if(!Array.isArray(p.requiredMergeGates)||!p.requiredMergeGates.length) throw new Error('requiredMergeGates missing'); console.log('policy schema basic validation PASS')"

      - name: Validate pilot JSON and result schemas when present
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const required = [
            '09_Development/AutonomousAgents/runtime-pilot.json',
            '09_Development/AutonomousAgents/schemas/implementation-result.schema.json',
            '09_Development/AutonomousAgents/schemas/audit-result.schema.json'
          ]
          for (const path of required) {
            if (!fs.existsSync(path)) continue
            JSON.parse(fs.readFileSync(path, 'utf8'))
          }
          console.log('runtime pilot JSON/schema parse PASS')
          NODE

      - name: Validate persistent project memory
        run: node 09_Development/AI_Project_Memory/validate-memory.mjs

      - name: Test fail-closed merge gate
        run: node --test 09_Development/AutonomousAgents/evaluate-merge-gate.test.mjs

  independent-autonomous-agent-audit:
    name: Independent runtime audit
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_ai_audit == true &&
      inputs.audit_pr_number != '' &&
      inputs.audit_head_sha != '' &&
      inputs.audit_base_sha != ''
    needs: validate-autonomous-agent-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      TARGET_PR: ${{ inputs.audit_pr_number }}
      TARGET_HEAD: ${{ inputs.audit_head_sha }}
      TARGET_BASE: ${{ inputs.audit_base_sha }}

    steps:
      - name: Validate explicit audit identifiers
        run: |
          set -euo pipefail
          [[ "$TARGET_PR" =~ ^[0-9]+$ ]]
          [[ "$TARGET_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_BASE" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact implementation head without persisted GitHub credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact audit head and bound audit size before metered call
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$TARGET_HEAD"
          git cat-file -e "$TARGET_BASE^{commit}"

          mapfile -t CHANGED < <(git diff --name-only "$TARGET_BASE" "$TARGET_HEAD")
          test "${#CHANGED[@]}" -gt 0
          if [ "${#CHANGED[@]}" -gt 20 ]; then
            echo "::error::AI audit blocked before spend: changed-file count ${#CHANGED[@]} exceeds pilot ceiling 20."
            exit 1
          fi

          DIFF_BYTES="$(git diff --no-ext-diff "$TARGET_BASE" "$TARGET_HEAD" | wc -c | tr -d ' ')"
          if [ "$DIFF_BYTES" -gt 250000 ]; then
            echo "::error::AI audit blocked before spend: diff size ${DIFF_BYTES} bytes exceeds pilot ceiling 250000."
            exit 1
          fi

          {
            echo "exact_head=$ACTUAL_HEAD"
            echo "base=$TARGET_BASE"
            echo "changed_files=${#CHANGED[@]}"
            echo "diff_bytes=$DIFF_BYTES"
            printf '%s\n' "${CHANGED[@]}"
          } > /tmp/dt00-audit-scope.txt
          cat /tmp/dt00-audit-scope.txt

      - name: Fail closed when OpenAI audit credential is absent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo '::error::OPENAI_API_KEY is absent. independent_audit=UNKNOWN.'
            exit 1
          fi

      - name: Run one cost-bounded independent read-only Codex audit
        id: audit
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          model: 'gpt-5.6-luna'
          effort: 'low'
          output-file: '/tmp/dt00-audit-result.json'
          output-schema-file: '09_Development/AutonomousAgents/schemas/audit-result.schema.json'
          allow-bots: true
          allow-bot-users: 'github-actions[bot]'
          prompt: |
            You are the INDEPENDENT DT-00 AUDIT agent. This is a cost-bounded exact-head review, not an implementation task.

            Audit PR #${{ env.TARGET_PR }} at exact head ${{ env.TARGET_HEAD }} against base ${{ env.TARGET_BASE }}.

            Keep repository reads targeted. Do not scan the repository broadly. Read only:
            - 09_Development/AUTONOMOUS_MULTI_AGENT_OPERATION.md
            - 09_Development/AI_AGENT_EXECUTION_PROTOCOL.md
            - 09_Development/AI_Project_Memory/AUTONOMOUS_AGENT_POLICY.json
            - 09_Development/AutonomousAgents/DT00_RUNTIME_PILOT.md when present
            - 09_Development/AutonomousAgents/runtime-pilot.json when present
            - files changed by git diff ${{ env.TARGET_BASE }}..${{ env.TARGET_HEAD }}
            - directly referenced code only when required to decide a blocking finding.

            Verify exact-head binding, policy weakening, self-approval, secret exposure, permissions, prompt-injection exposure, GitHub credential exposure, uncontrolled spend, fail-closed behavior, retry/concurrency limits and implementer/auditor separation.

            UNKNOWN remains UNKNOWN. PASS requires sufficient evidence and no blocking defect. Do not modify files. Do not output chain-of-thought. Return only JSON matching the provided schema, with exact_head_sha=${{ env.TARGET_HEAD }}.

      - name: Validate independent audit result fail-closed
        run: |
          set -euo pipefail
          test -s /tmp/dt00-audit-result.json
          DECISION="$(jq -r '.decision' /tmp/dt00-audit-result.json)"
          AUDITED_HEAD="$(jq -r '.exact_head_sha' /tmp/dt00-audit-result.json)"
          MISSING="$(jq '.required_evidence_missing | length' /tmp/dt00-audit-result.json)"
          PROHIBITED="$(jq -r '.prohibited_action_detected' /tmp/dt00-audit-result.json)"
          HARD_STOP="$(jq -r '.hard_stop // empty' /tmp/dt00-audit-result.json)"

          test "$AUDITED_HEAD" = "$TARGET_HEAD"
          test "$DECISION" = 'PASS'
          test "$MISSING" -eq 0
          test "$PROHIBITED" = 'false'
          test -z "$HARD_STOP"

      - name: Preserve independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dt00-independent-audit-${{ env.TARGET_PR }}-${{ env.TARGET_HEAD }}
          path: /tmp/dt00-audit-result.json
          if-no-files-found: warn
          retention-days: 7
