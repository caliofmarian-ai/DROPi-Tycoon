name: Release Blocker Camera Integration V2

on:
  push:
    branches:
      - openai/release-blocker-interactive-camera

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/release-blocker-interactive-camera
          fetch-depth: 0
      - run: python3 scripts/integrate_camera_release_blocker.py
      - run: |
          grep -q "CameraGestureController" game-web/src/scenes/GameWorldScene.ts
          grep -q "this.input.on('pointerup'" game-web/src/scenes/GameWorldScene.ts
          grep -q "cameraControlBounds: this.cameraControlBounds" game-web/src/scenes/GameWorldScene.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-web/src/scenes/GameWorldScene.ts
          git commit -m "feat: integrate interactive map camera controls"
          git push origin HEAD:openai/release-blocker-interactive-camera
