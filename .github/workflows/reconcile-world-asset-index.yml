name: Reconcile world asset documentation index

on:
  push:
    branches:
      - openai/world-asset-bible-v2
    paths:
      - '.github/workflows/reconcile-world-asset-index.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: openai/world-asset-bible-v2
          fetch-depth: 0

      - name: Reconcile DOCUMENT_INDEX
        shell: bash
        env:
          REP08_B64: 
          REPBIBLE_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('00_Project/DOCUMENT_INDEX.md')
          text = p.read_text(encoding='utf-8')
          rep08 = base64.b64decode(os.environ['REP08_B64']).decode('utf-8')
          repbible = base64.b64decode(os.environ['REPBIBLE_B64']).decode('utf-8')
          start = text.index('# 08_Assets')
          end = text.index('# 09_Development')
          text = text[:start] + rep08 + text[end:]
          start = text.index('# Future BIBLE-Level Documentation')
          end = text.index('# External DROPi Canonical Reference Package')
          text = text[:start] + repbible + text[end:]
          text = text.replace('Version: 2.0.0', 'Version: 2.1.0', 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_Project/DOCUMENT_INDEX.md
          git commit -m 'docs: authorize and index world asset bible'
          git push origin HEAD:openai/world-asset-bible-v2
