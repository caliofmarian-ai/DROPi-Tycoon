name: DT-23 Commit V2 End Card MP4

on:
  push:
    branches:
      - dt23/add-v2-endcard-mp4
    paths:
      - .github/workflows/dt23-commit-v2-endcard-mp4.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dt23/add-v2-endcard-mp4
          fetch-depth: 0

      - name: Install ffmpeg and font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Render exact DROPi Tycoon MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Marketing/DT23
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          BOLD=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

          ffmpeg -y \
            -f lavfi -i 'color=c=0x071729:s=1280x720:r=30:d=2' \
            -f lavfi -i 'anullsrc=channel_layout=stereo:sample_rate=48000:d=2' \
            -vf "drawbox=x=120:y=116:w=10:h=488:color=0x20d4ff:t=fill,drawtext=fontfile=${BOLD}:text='DELIVERY COMPLETE':fontcolor=white:fontsize=58:x=170:y=160,drawtext=fontfile=${FONT}:text='PERSONAL MONEY':fontcolor=0x20d4ff:fontsize=34:x=172:y=302,drawtext=fontfile=${FONT}:text='XP':fontcolor=0x9cf46d:fontsize=34:x=172:y=370,drawtext=fontfile=${FONT}:text='LOYALTY':fontcolor=0xffbd4a:fontsize=34:x=172:y=438,drawtext=fontfile=${FONT}:text='Your delivery changed your progression.':fontcolor=0xc7d4e2:fontsize=25:x=172:y=535,fade=t=in:st=0:d=0.25,fade=t=out:st=1.65:d=0.35,format=yuv420p" \
            -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 160k -shortest /tmp/result.mp4

          ffmpeg -y \
            -f lavfi -i 'color=c=0x061322:s=1280x720:r=30:d=3' \
            -f lavfi -i 'anullsrc=channel_layout=stereo:sample_rate=48000:d=3' \
            -vf "drawbox=x=0:y=0:w=1280:h=9:color=0x20d4ff:t=fill,drawtext=fontfile=${BOLD}:text='DROPi TYCOON':fontcolor=white:fontsize=82:x=(w-text_w)/2:y=236,drawtext=fontfile=${BOLD}:text='YOUR WORK LEAVES A MARK.':fontcolor=0x20d4ff:fontsize=34:x=(w-text_w)/2:y=352,drawtext=fontfile=${FONT}:text='CINEMATIC / NON-GAMEPLAY - TARGET CANON':fontcolor=0x8395a8:fontsize=19:x=(w-text_w)/2:y=642,fade=t=in:st=0:d=0.35,fade=t=out:st=2.65:d=0.35,format=yuv420p" \
            -c:v libx264 -preset medium -crf 18 -c:a aac -b:a 160k -shortest /tmp/endcard.mp4

          printf "file '/tmp/result.mp4'\nfile '/tmp/endcard.mp4'\n" > /tmp/concat.txt
          ffmpeg -y -f concat -safe 0 -i /tmp/concat.txt -c copy Marketing/DT23/DROPi_Tycoon_V2_Result_And_EndCard.mp4
          test -s Marketing/DT23/DROPi_Tycoon_V2_Result_And_EndCard.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 Marketing/DT23/DROPi_Tycoon_V2_Result_And_EndCard.mp4

      - name: Commit MP4 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dt23-commit-v2-endcard-mp4.yml
          git config user.name 'caliofmarian-ai'
          git config user.email 'dropi.deliveries@gmail.com'
          git add Marketing/DT23/DROPi_Tycoon_V2_Result_And_EndCard.mp4 .github/workflows/dt23-commit-v2-endcard-mp4.yml
          git commit -m '[DT-23] Add V2 end-card MP4 directly to Marketing/DT23'
          git push origin HEAD:dt23/add-v2-endcard-mp4
