name: Patch Generated Notification Context

on:
  push:
    branches:
      - openai/release-blocker-continuous-orders

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/release-blocker-continuous-orders
          fetch-depth: 0
      - run: python3 scripts/patch_generated_notification_context.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-web/src/scenes/GameWorldScene.ts
          git commit -m "fix: pass generated order context to notifications"
          git push origin HEAD:openai/release-blocker-continuous-orders
