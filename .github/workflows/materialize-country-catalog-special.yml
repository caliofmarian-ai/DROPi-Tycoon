name: Materialize Special Country Catalog Chapter

on:
  push:
    branches:
      - openai/country-catalog-special-v1
    paths:
      - .github/workflows/materialize-country-catalog-special.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-catalog-special-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry
      - name: Generate audited Special and Europe chapters
        run: |
          set -euo pipefail
          python scripts/build_country_catalog_chapters.py --continent 'Special'
          python scripts/build_country_catalog_chapters.py --continent 'Europe'
          grep -Fq -- '- countries/territories: **2**' 04_World/Country_Catalog/Continents/special.md
          grep -Fq -- '- structural PASS: **0**' 04_World/Country_Catalog/Continents/special.md
          grep -Fq -- '- REVIEW: **1**' 04_World/Country_Catalog/Continents/special.md
          grep -Fq -- '- documented GAP: **1**' 04_World/Country_Catalog/Continents/special.md
          grep -Fq '#477:' 04_World/Country_Catalog/Continents/special.md
          grep -Fq -- '- countries/territories: **39**' 04_World/Country_Catalog/Continents/europe.md
          grep -Fq -- '- structural PASS: **37**' 04_World/Country_Catalog/Continents/europe.md
          grep -Fq -- '- REVIEW: **2**' 04_World/Country_Catalog/Continents/europe.md
          grep -Fq '#478:' 04_World/Country_Catalog/Continents/europe.md
          grep -Fq '#469:' 04_World/Country_Catalog/Continents/europe.md
          git diff --check
      - name: Commit verified manifests
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_World/Country_Catalog/Continents/special.md 04_World/Country_Catalog/Continents/europe.md
          git commit -m 'world-data: apply Special and Kosovo semantic reviews'
          git push origin HEAD:openai/country-catalog-special-v1
