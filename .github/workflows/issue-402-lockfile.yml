name: Issue 402 lockfile generator

on:
  push:
    branches:
      - openai/issue-402-postgres-authority-repository

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: game-web
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: openai/issue-402-postgres-authority-repository
      - name: Setup Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- game-web/package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-web/package-lock.json
          git commit -m 'Issue #402: synchronize npm lockfile'
          git push origin HEAD:openai/issue-402-postgres-authority-repository
