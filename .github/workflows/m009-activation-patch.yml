name: M-009 Activation Cleanup

on:
  push:
    branches:
      - openai/m008-release-m009-activation
    paths:
      - .github/workflows/m009-activation-patch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/m008-release-m009-activation
          fetch-depth: 0

      - name: Restore legacy line endings and keep only semantic changes
        run: |
          set -euo pipefail
          git checkout origin/main -- 00_Project/PROJECT_STATUS.md 09_Development/CHANGELOG.md 09_Development/PROTOTYPE_RELEASE_CHECKLIST.md
          python - <<'PY'
          def read_raw(path):
              with open(path, 'r', encoding='utf-8', newline='') as handle:
                  return handle.read()

          def write_raw(path, text):
              with open(path, 'w', encoding='utf-8', newline='') as handle:
                  handle.write(text)

          status_path = '00_Project/PROJECT_STATUS.md'
          status = read_raw(status_path)
          status = status.replace(
              'Last Updated: 2026-09-01 (RBATCH-017 merged in PR #267; implementation/verification workstream complete; final owner release review pending)',
              'Last Updated: 2026-09-02 (M-008 owner progression sign-off recorded; M-009/RBATCH-018 activated)',
              1,
          )
          status = status.replace(
              'Prototype v0.1 — RBATCH-010 through RBATCH-017 MERGED; automated implementation/integration evidence complete; M-008 remains open only for final human/device/public review and owner release sign-off',
              'Phase 2 — M-009 Employee & Financial Systems activated; RBATCH-018 Employee Hiring & Onboarding is next',
              1,
          )
          status = status.replace(
              'Perform the final Prototype v0.1 owner review on the public build/Android device using `09_Development/Release_Evidence/PROTOTYPE_V0.1_OWNER_REVIEW_PACKAGE.md`. Do not declare the release complete until the remaining human/device/public/subjective checks are satisfactory and the owner explicitly signs off.',
              'Implement RBATCH-018 Employee Hiring & Onboarding, beginning with the canonical employee data model, then hiring/onboarding and salary-cycle integration.',
              1,
          )
          write_raw(status_path, status)

          checklist_path = '09_Development/PROTOTYPE_RELEASE_CHECKLIST.md'
          checklist = read_raw(checklist_path)
          nl = '\r\n' if '\r\n' in checklist else '\n'
          section_lines = [
              '---',
              '',
              '# Final Owner Progression Decision — 2026-09-02',
              '',
              '**FINAL OWNER SIGN-OFF RECORDED — PHASE-2 PROGRESSION AUTHORIZED**',
              '',
              'After the focused M-008 Android/Railway remediation cycle, the Project Owner confirmed the corrected public build works and explicitly requested progression to the evolution of the game. Prototype v0.1 is accepted as the technical/gameplay foundation for Phase 2.',
              '',
              'This acceptance does **not** assert that every historical manual regression checkbox was individually re-observed in the final session. Any such residual verification is retained as regression debt and must not be fabricated. It is no longer a blocker to M-009 execution.',
              '',
              'The current placeholder visual quality is explicitly not the final quality target.',
          ]
          if 'FINAL OWNER SIGN-OFF RECORDED — PHASE-2 PROGRESSION AUTHORIZED' not in checklist:
              checklist += nl + nl + nl.join(section_lines) + nl
          write_raw(checklist_path, checklist)

          changelog_path = '09_Development/CHANGELOG.md'
          changelog = read_raw(changelog_path)
          nl = '\r\n' if '\r\n' in changelog else '\n'
          entry_lines = [
              '## 2026-09-02 — M-008 owner progression sign-off / M-009 activation',
              '',
              '- Owner confirmed the corrected Android/Railway build works after PR #282.',
              '- Prototype v0.1 accepted as the Phase-2 foundation; current temporary graphics remain below the final quality target.',
              '- M-009 activated and RBATCH-018 / E-018 / ISSUE-024 / ISSUE-026 / ISSUE-032 prepared for execution.',
              '- No unobserved historical manual verification is fabricated; residual regression debt remains non-blocking.',
          ]
          if 'M-008 owner progression sign-off / M-009 activation' not in changelog:
              changelog += nl + nl + nl.join(entry_lines) + nl
          write_raw(changelog_path, changelog)
          PY

          git -c core.whitespace=cr-at-eol diff --check

      - name: Validate transition markers
        run: |
          set -euo pipefail
          grep -F 'M-009 Employee & Financial Systems activated' 00_Project/PROJECT_STATUS.md
          grep -F 'FINAL OWNER SIGN-OFF RECORDED — PHASE-2 PROGRESSION AUTHORIZED' 09_Development/PROTOTYPE_RELEASE_CHECKLIST.md
          grep -F 'M-008 owner progression sign-off / M-009 activation' 09_Development/CHANGELOG.md

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_Project/PROJECT_STATUS.md 09_Development/CHANGELOG.md 09_Development/PROTOTYPE_RELEASE_CHECKLIST.md
          git diff --cached --quiet && { echo 'No cleanup required'; exit 0; }
          git commit -m "[Planning] Preserve canonical document line endings"
          git push origin HEAD:openai/m008-release-m009-activation
