name: DT-19 Blender Asset Factory

on:
  pull_request:
    paths:
      - '08_Assets/Production/BlenderFactory/**'
      - '08_Assets/Production/asset-inventory.v1.json'
      - '08_Assets/Production/Tools/verify_asset_inventory.mjs'
      - '.github/workflows/dt19-asset-factory.yml'
  push:
    branches: [main]
    paths:
      - '08_Assets/Production/BlenderFactory/**'
      - '08_Assets/Production/asset-inventory.v1.json'
      - '08_Assets/Production/Tools/verify_asset_inventory.mjs'
      - '.github/workflows/dt19-asset-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-generate-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REQUEST: 08_Assets/Production/BlenderFactory/requests/ci-proof-building.request.json
      FACTORY: 08_Assets/Production/BlenderFactory/tools/asset_factory.py
      GENERATOR: 08_Assets/Production/BlenderFactory/tools/blender_generate_asset.py
      BUILDING_REQUEST: 08_Assets/Production/BlenderFactory/requests/ci-building-detail-v1.request.json
      BUILDING_GENERATOR: 08_Assets/Production/BlenderFactory/tools/blender_generate_building_v1.py
      PREVIEW_VALIDATOR: 08_Assets/Production/BlenderFactory/tools/validate_preview_png.py

    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical DT-19 asset inventory
        run: node 08_Assets/Production/Tools/verify_asset_inventory.mjs

      - name: Run factory unit tests
        run: python3 -m unittest 08_Assets/Production/BlenderFactory/tools/test_asset_factory.py

      - name: Run building v1 request tests
        run: python3 -m unittest 08_Assets/Production/BlenderFactory/tools/test_building_v1_request.py

      - name: Validate proof request before generator install
        run: python3 "$FACTORY" preflight --request "$REQUEST"

      - name: Validate detailed building request before generator install
        run: python3 "$FACTORY" preflight --request "$BUILDING_REQUEST"

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
          blender --background --python-exit-code 1 --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Generate deterministic CI-only GLB
        run: |
          OUT="$RUNNER_TEMP/dropi-dt19-proof"
          mkdir -p "$OUT"
          blender --background --python-exit-code 1 --python "$GENERATOR" -- \
            --request "$REQUEST" \
            --out-dir "$OUT"
          test -s "$OUT/ci-proof-building.glb"
          test -s "$OUT/ci-proof-building.report.json"
          ls -lh "$OUT"

      - name: Validate generated GLB and report
        run: |
          OUT="$RUNNER_TEMP/dropi-dt19-proof"
          python3 "$FACTORY" postflight \
            --request "$REQUEST" \
            --report "$OUT/ci-proof-building.report.json" \
            --glb "$OUT/ci-proof-building.glb"

      - name: Upload CI-only proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: dt19-blender-ci-proof
          path: |
            ${{ runner.temp }}/dropi-dt19-proof/ci-proof-building.glb
            ${{ runner.temp }}/dropi-dt19-proof/ci-proof-building.report.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate detailed building v1 and preview
        run: |
          OUT="$RUNNER_TEMP/dropi-dt19-building-v1"
          mkdir -p "$OUT"
          blender --background --python-exit-code 1 --python "$BUILDING_GENERATOR" -- \
            --request "$BUILDING_REQUEST" \
            --out-dir "$OUT"
          test -s "$OUT/ci-building-detail-v1.glb"
          test -s "$OUT/ci-building-detail-v1.report.json"
          test -s "$OUT/ci-building-detail-v1.preview.png"
          ls -lh "$OUT"

      - name: Validate detailed building GLB and report
        run: |
          OUT="$RUNNER_TEMP/dropi-dt19-building-v1"
          python3 "$FACTORY" postflight \
            --request "$BUILDING_REQUEST" \
            --report "$OUT/ci-building-detail-v1.report.json" \
            --glb "$OUT/ci-building-detail-v1.glb"

      - name: Validate detailed building preview PNG
        run: |
          OUT="$RUNNER_TEMP/dropi-dt19-building-v1"
          python3 "$PREVIEW_VALIDATOR" \
            --png "$OUT/ci-building-detail-v1.preview.png" \
            --request "$BUILDING_REQUEST"

      - name: Upload detailed building v1 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: dt19-building-v1-preview-proof
          path: |
            ${{ runner.temp }}/dropi-dt19-building-v1/ci-building-detail-v1.glb
            ${{ runner.temp }}/dropi-dt19-building-v1/ci-building-detail-v1.report.json
            ${{ runner.temp }}/dropi-dt19-building-v1/ci-building-detail-v1.preview.png
          if-no-files-found: error
          retention-days: 7
