name: Materialize South America Country Catalog Chapter

on:
  push:
    branches:
      - openai/country-catalog-south-america-v1
    paths:
      - .github/workflows/materialize-country-catalog-south-america.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-catalog-south-america-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry
      - name: Generate audited South America chapter
        run: |
          set -euo pipefail
          python scripts/build_country_catalog_chapters.py --continent 'South America'
          grep -Fq -- '- countries/territories: **13**' 04_World/Country_Catalog/Continents/southamerica.md
          grep -Fq -- '- structural PASS: **10**' 04_World/Country_Catalog/Continents/southamerica.md
          grep -Fq -- '- REVIEW: **3**' 04_World/Country_Catalog/Continents/southamerica.md
          for issue in 472 473 474; do
            grep -Fq "#$issue:" 04_World/Country_Catalog/Continents/southamerica.md
          done
          git diff --check
      - name: Commit generated South America manifest
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_World/Country_Catalog/Continents/southamerica.md
          git commit -m 'world-data: apply South America semantic reviews to chapter manifest'
          git push origin HEAD:openai/country-catalog-south-america-v1
