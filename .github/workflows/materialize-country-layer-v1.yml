            game-web/tests/global-map-runtime.test.ts \
            04_World/COUNTRY_LAYER_LOCALITY_DATASET.md
          git diff --cached --check
          git commit -m 'world: materialize sparse all-country locality layer'
          git push origin HEAD:openai/country-layer-nodes-v1
