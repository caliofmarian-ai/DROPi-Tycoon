name: Materialize Country Layer v1

on:
  push:
    branches:
      - openai/country-layer-nodes-v1
    paths:
      - .github/workflows/materialize-country-layer-v1.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-layer-nodes-v1
          fetch-depth: 0

      - name: Build sparse all-country locality catalog
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pycountry
          python - <<'PY'
          import json, math, pathlib, urllib.request, unicodedata
          import pycountry

          ROOT = pathlib.Path('.')
          SRC_COMMIT = 'ca96624a56bd078437bca8184e78163e5039ad19'
          SRC_URL = f'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/{SRC_COMMIT}/geojson/ne_10m_populated_places_simple.geojson'
          OUT = ROOT / 'game-web/public/data/country-representative-localities-v1.json'
          TOPOLOGY = ROOT / 'game-web/public/data/world-atlas-countries-110m.json'
          MAP_WIDTH = 1440.0
          MAP_HEIGHT = 720.0

          def norm(value):
              value = unicodedata.normalize('NFKD', str(value or ''))
              value = ''.join(ch for ch in value if not unicodedata.combining(ch)).lower()
              return ''.join(ch for ch in value if ch.isalnum())

          with urllib.request.urlopen(SRC_URL, timeout=60) as response:
              places_geo = json.load(response)
          topology = json.loads(TOPOLOGY.read_text())
          rendered = {str(g.get('id')): g.get('properties', {}).get('name', '') for g in topology['objects']['countries']['geometries']}
          rendered_ids = set(rendered)
          name_to_id = {norm(name): cid for cid, name in rendered.items() if name}

          def country_id_for(props):
              iso2 = str(props.get('iso_a2') or '').upper()
              if len(iso2) == 2 and iso2 != '-9':
                  hit = pycountry.countries.get(alpha_2=iso2)
                  if hit and hit.numeric in rendered_ids:
                      return hit.numeric
              for key in ('adm0name', 'sov0name'):
                  cid = name_to_id.get(norm(props.get(key)))
                  if cid:
                      return cid
              return None

          grouped = {cid: [] for cid in rendered_ids}
          for feature in places_geo.get('features', []):
              props = feature.get('properties') or {}
              coords = (feature.get('geometry') or {}).get('coordinates') or []
              if len(coords) < 2:
                  continue
              cid = country_id_for(props)
              if cid not in grouped:
                  continue
              try:
                  lon, lat = float(coords[0]), float(coords[1])
              except Exception:
                  continue
              grouped[cid].append({
                  'name': str(props.get('nameascii') or props.get('name') or '').strip(),
                  'lon': lon,
                  'lat': lat,
                  'population': int(float(props.get('pop_max') or 0)),
                  'scalerank': int(float(props.get('scalerank') or 99)),
                  'featureClass': str(props.get('featurecla') or ''),
                  'admin1': str(props.get('adm1name') or '').strip(),
                  'isCapital': bool(float(props.get('adm0cap') or 0)) or 'Admin-0 capital' in str(props.get('featurecla') or ''),
              })

          directions = {
              'N': (0.0, -1.0), 'NE': (math.sqrt(0.5), -math.sqrt(0.5)),
              'E': (1.0, 0.0), 'SE': (math.sqrt(0.5), math.sqrt(0.5)),
              'S': (0.0, 1.0), 'SW': (-math.sqrt(0.5), math.sqrt(0.5)),
              'W': (-1.0, 0.0), 'NW': (-math.sqrt(0.5), -math.sqrt(0.5)),
          }

          def map_point(place):
              return ((place['lon'] + 180.0) / 360.0 * MAP_WIDTH, (90.0 - place['lat']) / 180.0 * MAP_HEIGHT)

          def choose(country_places):
              if not country_places:
                  return []
              xs, ys = zip(*(map_point(p) for p in country_places))
              # settlement extent is used only to normalize directional scoring; all actual node positions remain real coordinates.
              center_x = (min(xs) + max(xs)) / 2.0
              center_y = (min(ys) + max(ys)) / 2.0
              half_w = max(8.0, (max(xs) - min(xs)) / 2.0)
              half_h = max(8.0, (max(ys) - min(ys)) / 2.0)

              def vector(place):
                  x, y = map_point(place)
                  dx = (x - center_x) / half_w
                  dy = (y - center_y) / half_h
                  mag = max(1e-9, math.hypot(dx, dy))
                  return dx / mag, dy / mag, min(2.5, mag)

              capitals = [p for p in country_places if p['isCapital']]
              capitals.sort(key=lambda p: (p['scalerank'], -p['population'], p['name']))
              capital = capitals[0] if capitals else max(country_places, key=lambda p: (p['population'], -p['scalerank']))
              selected = []
              used = set()

              def add(place, role, sector):
                  key = (round(place['lon'], 6), round(place['lat'], 6), place['name'])
                  if key in used:
                      return False
                  used.add(key)
                  selected.append({
                      'name': place['name'],
                      'role': role,
                      'sector': sector,
                      'longitude': round(place['lon'], 6),
                      'latitude': round(place['lat'], 6),
                      'populationReference': place['population'],
                      'admin1': place['admin1'],
                      'sourceFeatureClass': place['featureClass'],
                  })
                  return True

              add(capital, 'capital', 'CAPITAL')

              def best_for_sector(sector, secondary=False):
                  ux, uy = directions[sector]
                  best = None
                  best_score = -1e9
                  for p in country_places:
                      key = (round(p['lon'], 6), round(p['lat'], 6), p['name'])
                      if key in used or p is capital:
                          continue
                      dx, dy, distance = vector(p)
                      alignment = dx * ux + dy * uy
                      if alignment < 0.36:
                          continue
                      pop_log = min(8.0, math.log10(max(1, p['population']))) / 8.0
                      importance = max(0.0, min(1.0, (12.0 - p['scalerank']) / 12.0))
                      if secondary:
                          smallness = 1.0 - min(1.0, math.log10(max(10, p['population'])) / 6.4)
                          overlarge_penalty = 1.0 if p['population'] > 350000 else 0.0
                          score = alignment * 5.2 + distance * 0.8 + smallness * 1.6 + (1.0 - importance) * 0.45 - overlarge_penalty
                      else:
                          score = alignment * 5.0 + distance * 0.6 + pop_log * 1.3 + importance * 0.65
                      if score > best_score:
                          best, best_score = p, score
                  return best

              for sector in ('N', 'E', 'S', 'W'):
                  p = best_for_sector(sector, secondary=False)
                  if p:
                      add(p, 'urban', sector)
              for sector in ('NE', 'SE', 'SW', 'NW'):
                  p = best_for_sector(sector, secondary=True)
                  if p:
                      add(p, 'secondary', sector)
              return selected[:9]

          countries = {}
          for cid in sorted(rendered_ids):
              nodes = choose(grouped.get(cid, []))
              if nodes:
                  countries[cid] = nodes

          def capital_name(cid):
              for node in countries.get(cid, []):
                  if node['role'] == 'capital':
                      return node['name']
              return None

          assert capital_name('642') in {'Bucharest', 'Bucuresti'}, capital_name('642')
          assert capital_name('372') == 'Dublin', capital_name('372')
          assert all(len(nodes) <= 9 for nodes in countries.values())
          assert len(countries) >= 160, len(countries)

          total_nodes = sum(len(nodes) for nodes in countries.values())
          capital_count = sum(1 for nodes in countries.values() for node in nodes if node['role'] == 'capital')
          payload = {
              'version': '1.0.0',
              'source': {
                  'name': 'Natural Earth 1:10m populated places simple',
                  'upstreamCommit': SRC_COMMIT,
                  'license': 'Public Domain',
              },
              'stats': {
                  'renderedCountries': len(rendered_ids),
                  'countriesWithRepresentativeNodes': len(countries),
                  'capitalNodes': capital_count,
                  'totalRepresentativeNodes': total_nodes,
                  'maxNodesPerCountry': max(len(v) for v in countries.values()),
              },
              'countries': countries,
          }
          OUT.parent.mkdir(parents=True, exist_ok=True)
          OUT.write_text(json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n')
          print(json.dumps(payload['stats'], indent=2))
          print('Romania:', countries['642'])
          print('Ireland:', countries['372'])
          PY

          cat > game-web/src/world/countryLayerNodes.ts <<'TS'
          import type { MapPoint } from './globalMapTopology'

          export type CountryLocalityRole = 'capital' | 'urban' | 'secondary'
          export type CountryLocalitySector = 'CAPITAL' | 'N' | 'NE' | 'E' | 'SE' | 'S' | 'SW' | 'W' | 'NW'

          export interface CountryLocalityNode {
            name: string
            role: CountryLocalityRole
            sector: CountryLocalitySector
            longitude: number
            latitude: number
            populationReference: number
            admin1: string
            sourceFeatureClass: string
          }

          export interface CountryLocalityCatalog {
            version: string
            source: {
              name: string
              upstreamCommit: string
              license: string
            }
            stats: {
              renderedCountries: number
              countriesWithRepresentativeNodes: number
              capitalNodes: number
              totalRepresentativeNodes: number
              maxNodesPerCountry: number
            }
            countries: Record<string, CountryLocalityNode[]>
          }

          export const localityNodesForCountry = (
            catalog: CountryLocalityCatalog | null | undefined,
            countryId: string,
          ): CountryLocalityNode[] => catalog?.countries?.[countryId] ?? []

          export const projectLocalityToGlobalMap = (
            node: Pick<CountryLocalityNode, 'longitude' | 'latitude'>,
            width: number,
            height: number,
          ): MapPoint => ({
            x: (node.longitude + 180) / 360 * width,
            y: (90 - node.latitude) / 180 * height,
          })

          export const nearestLocalityNode = (
            nodes: CountryLocalityNode[],
            point: MapPoint,
            width: number,
            height: number,
            maxDistance: number,
          ): CountryLocalityNode | null => {
            let winner: CountryLocalityNode | null = null
            let bestDistance = maxDistance
            for (const node of nodes) {
              const projected = projectLocalityToGlobalMap(node, width, height)
              const distance = Math.hypot(projected.x - point.x, projected.y - point.y)
              if (distance <= bestDistance) {
                winner = node
                bestDistance = distance
              }
            }
            return winner
          }
          TS

