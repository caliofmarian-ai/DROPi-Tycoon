name: Apply Country Review Registry

on:
  push:
    branches:
      - openai/country-catalog-africa-v1
    paths:
      - .github/workflows/apply-country-review-registry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-catalog-africa-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry
      - name: Wire review registry into generator and regenerate Africa
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/build_country_catalog_chapters.py')
          text = path.read_text()

          anchor = "OUT_ROOT = ROOT / '04_World/Country_Catalog'\n"
          addition = anchor + "REVIEW_REGISTRY = OUT_ROOT / 'COUNTRY_REVIEW_REGISTRY.json'\n"
          if 'REVIEW_REGISTRY =' not in text:
              if anchor not in text:
                  raise SystemExit('OUT_ROOT anchor missing')
              text = text.replace(anchor, addition, 1)

          old_sig = "def audit_country(cid, name, nodes, coverage_gap=False):\n    reasons = []\n"
          new_sig = "def audit_country(cid, name, nodes, coverage_gap=False, manual_review=None):\n    reasons = []\n    if manual_review:\n        issue = manual_review.get('issue')\n        reason = str(manual_review.get('reason') or 'manual semantic review required')\n        reasons.append(f\"#{issue}: {reason}\" if issue else reason)\n"
          if 'manual_review=None' not in text:
              if old_sig not in text:
                  raise SystemExit('audit_country signature anchor missing')
              text = text.replace(old_sig, new_sig, 1)

          old_load = "    countries = catalog.get('countries', {})\n\n    rows_by_continent"
          new_load = "    countries = catalog.get('countries', {})\n    review_registry = load_json(REVIEW_REGISTRY).get('reviews', {}) if REVIEW_REGISTRY.exists() else {}\n\n    rows_by_continent"
          if 'review_registry = load_json(REVIEW_REGISTRY)' not in text:
              if old_load not in text:
                  raise SystemExit('countries load anchor missing')
              text = text.replace(old_load, new_load, 1)

          old_call = "        row = audit_country(cid, name, nodes, cid in coverage_gap_ids)\n"
          new_call = "        row = audit_country(cid, name, nodes, cid in coverage_gap_ids, review_registry.get(cid))\n"
          if new_call not in text:
              if old_call not in text:
                  raise SystemExit('audit_country call anchor missing')
              text = text.replace(old_call, new_call, 1)

          path.write_text(text)
          PY
          python scripts/build_country_catalog_chapters.py --continent Africa
          git diff --check
      - name: Commit registry-aware audit output
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/build_country_catalog_chapters.py 04_World/Country_Catalog/Continents/africa.md
          git commit -m 'world-data: apply governed semantic reviews to Africa chapter'
          git push origin HEAD:openai/country-catalog-africa-v1
