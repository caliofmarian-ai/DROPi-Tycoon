name: M-008 Non-overlap Top Dock Patch

on:
  push:
    branches:
      - openai/m008-nonoverlap-compact-topdock
    paths:
      - .github/workflows/m008-nonoverlap-topdock-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/m008-nonoverlap-compact-topdock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Apply deterministic patch
        run: python scripts/m008_nonoverlap_topdock_patch.py
      - name: Install dependencies
        working-directory: game-web
        run: npm ci
      - name: Run full test suite
        working-directory: game-web
        run: npm test -- --run
      - name: TypeScript and production build
        working-directory: game-web
        run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-web/src game-web/tests
          git diff --cached --check
          git commit -m "[M-008] Reserve map viewport below compact top dock"
          git push origin HEAD:openai/m008-nonoverlap-compact-topdock
