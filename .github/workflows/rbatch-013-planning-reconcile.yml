name: RBATCH-013 Planning Reconcile

on:
  push:
    branches:
      - openai/rbatch-013-bicycle-speed

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/rbatch-013-bicycle-speed
          fetch-depth: 0

      - name: Harden issue-block label updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/reconcile_rbatch_013_planning.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def set_yaml_issue_label_status')
          end = text.index('\n\n# Batch architecture.', start)
          replacement = '''def set_yaml_issue_label_status(text: str, issue_id: str, old: str, new: str) -> str:
              marker = f"- id: {issue_id}\\n"
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f"Could not locate YAML issue block for {issue_id}")
              next_item = text.find("\\n- id: ", start + len(marker))
              end = len(text) if next_item < 0 else next_item + 1
              block = text[start:end]
              if block.count(old) != 1:
                  raise RuntimeError(f"Expected one {old} label in {issue_id}, found {block.count(old)}")
              updated_block = block.replace(old, new)
              return text[:start] + updated_block + text[end:]
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Apply deterministic planning reconciliation
        run: python3 scripts/reconcile_rbatch_013_planning.py

      - name: Verify reconciled markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F "RBATCH-012 | 1 | M-006 | E-013 | CompanyManagement + Upgrade Purchase Flow | MERGED in PR #256" 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F "RBATCH-013 | 1 | M-006 | E-014 | Bicycle Ownership + Speed Increase | PR #257" 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F "E-014 | 1 | M-006 | Bicycle Ownership System | PR #257" 09_Development/Planning/EPIC_CATALOG.md
          grep -F "ISSUE-012 | Implement bicycle ownership" 09_Development/Planning/ISSUE_CATALOG.md | grep -F "PR #257 implementation validated"
          grep -F "ISSUE-013 | Implement bicycle movement-speed" 09_Development/Planning/ISSUE_CATALOG.md | grep -F "PR #257 implementation validated"
          python3 - <<'PY'
          import yaml
          with open('09_Development/Planning/github_creation_plan.yaml', encoding='utf-8') as handle:
              data = yaml.safe_load(handle)
          batches = {item['id']: item for item in data['batches']}
          epics = {item['id']: item for item in data['epics']}
          issues = {item['id']: item for item in data['issues']}
          assert 'MERGED' in batches['RBATCH-012']['status']
          assert batches['RBATCH-013']['status'].startswith('PR #257')
          assert 'MERGED' in epics['E-013']['status']
          assert epics['E-014']['status'].startswith('PR #257')
          for issue_id in ('ISSUE-010', 'ISSUE-011'):
              assert issues[issue_id]['status'].startswith('COMPLETED')
              assert 'status:done' in issues[issue_id]['label_names']
          for issue_id in ('ISSUE-012', 'ISSUE-013'):
              assert issues[issue_id]['status'].startswith('PR #257')
              assert 'status:in-progress' in issues[issue_id]['label_names']
          print('Reconciled YAML markers: PASS')
          PY

      - name: Commit planning reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No reconciliation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            00_Project/PROJECT_STATUS.md \
            09_Development/CHANGELOG.md \
            09_Development/Planning/BATCH_ARCHITECTURE.md \
            09_Development/Planning/EPIC_CATALOG.md \
            09_Development/Planning/ISSUE_CATALOG.md \
            09_Development/Planning/github_creation_plan.yaml \
            .github/workflows/rbatch-010-ci.yml
          git commit -m "docs: reconcile RBATCH-012 merge and RBATCH-013 validation"
          git push origin HEAD:openai/rbatch-013-bicycle-speed
