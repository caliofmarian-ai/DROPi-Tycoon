name: Temporary Surface Source Review
on:
  pull_request:
    paths:
      - '.github/workflows/visual-surface-source-review.yml'
permissions:
  contents: read
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Collect public 1K texture candidates and exact source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/surface-review/textures"
          export SURFACE_REVIEW="$RUNNER_TEMP/surface-review"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path(os.environ['SURFACE_REVIEW'])
          records=[]
          for asset in ['asphalt_02','leafy_grass']:
            for channel in ['diff','nor_gl','arm']:
              filename=f'{asset}_{channel}_1k.jpg'
              url=f'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/{asset}/{filename}'
              req=urllib.request.Request(url,headers={'User-Agent':'DROPi-Tycoon-Internal-Asset-Review/1.0'})
              with urllib.request.urlopen(req,timeout=45) as response:
                data=response.read(8*1024*1024+1)
              if not data.startswith(b'\xff\xd8') or len(data)>8*1024*1024: raise ValueError('Invalid bounded JPEG candidate')
              (root/'textures'/filename).write_bytes(data)
              records.append(dict(asset=asset,channel=channel,file=filename,url=url,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          (root/'download-review.json').write_text(json.dumps({'classification':'SOURCE_REVIEW_ONLY_NOT_RELEASE_CLEARANCE','head':os.environ['EXPECTED_HEAD'],'files':records},indent=2)+'\n')
          PY
          git archive --format=tar HEAD 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1 .github | gzip > "$RUNNER_TEMP/surface-review/exact-source.tar.gz"
          cd "$RUNNER_TEMP/surface-review"
          sha256sum exact-source.tar.gz textures/*.jpg > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surface-source-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/surface-review
          retention-days: 2
          if-no-files-found: error
