name: RBATCH-012 Test Reconcile

on:
  push:
    branches:
      - openai/rbatch-012-company-management-upgrades

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/rbatch-012-company-management-upgrades
          fetch-depth: 0

      - name: Update legacy company-shape assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game-web/tests/orderSystem.test.ts')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "expect(result.company).toEqual({ money: 100, reputation: 52 })": "expect(result.company).toMatchObject({ money: 100, reputation: 52 })",
              "expect(result.company).toEqual({ money: 0, reputation: 45 })": "expect(result.company).toMatchObject({ money: 0, reputation: 45 })",
              "settleDeliveryOutcome(previousOrder, successOrder, { money: 0, reputation: 99 })": "settleDeliveryOutcome(previousOrder, successOrder, { ...freshCompany(), reputation: 99 })",
              "settleDeliveryOutcome(previousOrder, failOrder, { money: 0, reputation: 3 })": "settleDeliveryOutcome(previousOrder, failOrder, { ...freshCompany(), reputation: 3 })",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}; found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit test reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-web/tests/orderSystem.test.ts
          git commit -m 'test: preserve RBATCH-009 assertions with expanded CompanyState'
          git push origin HEAD:openai/rbatch-012-company-management-upgrades
