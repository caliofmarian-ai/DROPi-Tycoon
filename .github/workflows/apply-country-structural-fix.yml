name: Apply structural country data regeneration

on:
  push:
    branches:
      - openai/country-data-structural-fix-v1
    paths:
      - .github/workflows/apply-country-structural-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-data-structural-fix-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: python -m pip install --disable-pip-version-check pycountry
      - name: Enumerate all rendered geometries without usable source IDs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          topology = json.loads(Path('game-web/public/data/world-atlas-countries-110m.json').read_text())
          missing = []
          for index, geometry in enumerate(topology['objects']['countries']['geometries']):
              raw = geometry.get('id')
              text = '' if raw is None else str(raw).strip()
              if not text or text.casefold() in {'none', 'null'}:
                  name = str((geometry.get('properties') or {}).get('name') or '').strip()
                  missing.append({'index': index, 'name': name, 'sourceId': raw})
          print('MISSING_SOURCE_IDS=' + json.dumps(missing, ensure_ascii=False, sort_keys=True))
          print('MISSING_SOURCE_ID_COUNT=' + str(len(missing)))
          PY
      - name: Patch runtime scene and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          scene = Path('game-web/src/scenes/GlobalMapScene.ts')
          text = scene.read_text()
          old = "  localityNodesForCountry,\n"
          new = "  geometryIdentityByRenderedName,\n  localityNodesForCountry,\n"
          if old not in text or 'geometryIdentityByRenderedName,' in text:
              raise SystemExit('GlobalMapScene import anchor missing or already patched')
          text = text.replace(old, new, 1)
          old = "    const topology = this.cache.json.get(COUNTRY_DATA_KEY) as WorldTopology | undefined\n    this.countries = topology ? decodeWorldTopology(topology, MAP_WIDTH, MAP_HEIGHT) : []\n    this.localityCatalog = (this.cache.json.get(LOCALITY_DATA_KEY) as CountryLocalityCatalog | undefined) ?? null\n"
          new = "    const topology = this.cache.json.get(COUNTRY_DATA_KEY) as WorldTopology | undefined\n    this.localityCatalog = (this.cache.json.get(LOCALITY_DATA_KEY) as CountryLocalityCatalog | undefined) ?? null\n    this.countries = topology\n      ? decodeWorldTopology(topology, MAP_WIDTH, MAP_HEIGHT, geometryIdentityByRenderedName(this.localityCatalog))\n      : []\n"
          if old not in text:
              raise SystemExit('GlobalMapScene create anchor missing')
          scene.write_text(text.replace(old, new, 1))

          test = Path('game-web/tests/global-map-runtime.test.ts')
          text = test.read_text()
          old = "    const ireland = localityCatalog.countries['372'] ?? []\n"
          new = "    const ireland = localityCatalog.countries['372'] ?? []\n    const unitedKingdom = localityCatalog.countries['826'] ?? []\n    const kosovo = localityCatalog.countries['XKX'] ?? []\n"
          if old not in text:
              raise SystemExit('runtime test locality anchor missing')
          text = text.replace(old, new, 1)
          old = "    expect(ireland.find(node => node.role === 'capital')?.name).toBe('Dublin')\n"
          new = "    expect(ireland.find(node => node.role === 'capital')?.name).toBe('Dublin')\n    expect(unitedKingdom.find(node => node.role === 'capital')?.name).toBe('London')\n    expect(unitedKingdom.some(node => node.name === 'Hamilton')).toBe(false)\n    expect(kosovo.find(node => node.role === 'capital')?.name).toBe('Pristina')\n    expect(localityCatalog.geometryIdentity?.byRenderedName.Kosovo).toBe('XKX')\n    expect(localityCatalog.countries.None).toBeUndefined()\n"
          if old not in text:
              raise SystemExit('runtime test capital anchor missing')
          text = text.replace(old, new, 1)
          old = "    const countries = decodeWorldTopology(topology, 1440, 720)\n"
          new = "    const countries = decodeWorldTopology(topology, 1440, 720, localityCatalog.geometryIdentity?.byRenderedName ?? {})\n"
          if old not in text:
              raise SystemExit('runtime decode anchor missing')
          text = text.replace(old, new, 1)
          old = "    expect(names.has('Romania')).toBe(true)\n"
          new = "    expect(names.has('Romania')).toBe(true)\n    expect(countries.find(country => country.name === 'Kosovo')?.id).toBe('XKX')\n    expect(countries.every(country => !country.id.startsWith('unresolved:'))).toBe(true)\n"
          if old not in text:
              raise SystemExit('runtime names anchor missing')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Regenerate runtime country catalog and all audit chapters
        run: |
          set -euo pipefail
          python scripts/build_country_locality_catalog.py
          python scripts/build_country_catalog_chapters.py --all
          python scripts/verify_country_catalog_chapters.py --write-report
          git diff --check
      - name: Commit deterministic generated outputs
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            game-web/src/scenes/GlobalMapScene.ts \
            game-web/tests/global-map-runtime.test.ts \
            game-web/public/data/country-representative-localities-v1.json \
            04_World/Country_Catalog/Continents/*.md \
            04_World/Country_Catalog/GLOBAL_COUNTRY_CATALOG_AUDIT.md
          git commit -m 'world-data: regenerate stable country identities and locality ownership'
          git push origin HEAD:openai/country-data-structural-fix-v1
