name: Import candidate asset crops

on:
  push:
    branches:
      - openai/assets-audit-board-crops-v1
    paths:
      - '08_Assets/.candidate-import/**'
      - '.github/workflows/import-candidate-crops.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: openai/assets-audit-board-crops-v1
          fetch-depth: 0

      - name: Reconstruct and validate candidate crop package
        shell: bash
        run: |
          set -euo pipefail
          src='08_Assets/.candidate-import'
          dest='08_Assets/Candidate_Board_Crops_v1'
          {
            cat "$src/chunk_00.b64"
            cat "$src/chunk_01.b64"
            cat "$src/chunk_02.b64"
            cat "$src/chunk_03.b64"
            cat "$src/chunk_04.b64"
            cat "$src/chunk_05.b64"
            cat "$src/chunk_06.b64"
            cat "$src/chunk_07a.b64"
            cat "$src/chunk_07b.b64"
            cat "$src/chunk_08.b64"
            cat "$src/chunk_09a.b64"
            cat "$src/chunk_09b.b64"
            cat "$src/chunk_10.b64"
            cat "$src/chunk_11.b64"
            cat "$src/chunk_12.b64"
            cat "$src/chunk_13.b64"
          } | tr -d '\r\n' | base64 -d > /tmp/dropi-candidate-crops.zip

          unzip -t /tmp/dropi-candidate-crops.zip
          rm -rf "$dest"
          mkdir -p "$dest"
          unzip -q /tmp/dropi-candidate-crops.zip -d "$dest"

          count="$(find "$dest" -type f -name '*.webp' | wc -l | tr -d ' ')"
          test "$count" = '50'
          test -f "$dest/README.md"
          echo "Validated candidate crops: $count"

      - name: Commit individual review assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 08_Assets/.candidate-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assets: import 50 candidate board crops for owner review'
          git push origin HEAD:openai/assets-audit-board-crops-v1
