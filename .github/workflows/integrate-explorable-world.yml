name: Integrate Explorable World

on:
  push:
    branches:
      - openai/release-blocker-explorable-map

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/release-blocker-explorable-map
          fetch-depth: 0
      - run: python3 scripts/integrate_explorable_world.py
      - run: |
          grep -q "WORLD_ZONES" game-web/src/scenes/GameWorldScene.ts
          grep -q "renderWorldLayout" game-web/src/scenes/GameWorldScene.ts
          grep -q "DELIVERY_ROUTE_POINTS" game-web/src/scenes/GameWorldScene.ts
          ! grep -q "const ROAD_POSITIONS" game-web/src/scenes/GameWorldScene.ts
          ! grep -q "const BUILDINGS" game-web/src/scenes/GameWorldScene.ts
          ! grep -q "const DELIVERY_POINTS" game-web/src/scenes/GameWorldScene.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-web/src/scenes/GameWorldScene.ts
          git commit -m "feat: render explorable zone-structured prototype map"
          git push origin HEAD:openai/release-blocker-explorable-map
