name: Visual Quality Candidate Review
on:
  push:
    branches: ['visual/clarity-materials-silhouettes-v2']
    paths:
      - '09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/**'
      - '.github/workflows/visual-quality-workspace.yml'
permissions:
  contents: read
concurrency:
  group: visual-quality-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
      - name: Build and render exact candidate head
        working-directory: 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VITE_COMMIT_SHA"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: visual-quality-review-${{ github.sha }}
          path: 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/dist/evidence/
          retention-days: 7
          if-no-files-found: warn
