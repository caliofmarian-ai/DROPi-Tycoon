name: Visual Quality Reproducible Workspace
on:
  push:
    branches: ['visual/clarity-materials-silhouettes-v2']
    paths: ['.github/workflows/visual-quality-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
      - name: Package exact-source isolated validation workspace
        shell: bash
        run: |
          set -euo pipefail
          cd 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1
          npm ci --ignore-scripts --no-audit --no-fund
          git rev-parse HEAD > SOURCE_SHA.txt
          tar --exclude='.env' --exclude='.env.*' -czf "$RUNNER_TEMP/visual-quality-workspace.tar.gz" src scripts public package.json package-lock.json tsconfig.json vite.config.ts index.html node_modules SOURCE_SHA.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-quality-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/visual-quality-workspace.tar.gz
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
