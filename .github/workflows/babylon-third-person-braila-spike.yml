name: Babylon Third-Person Brăila Spike

on:
  pull_request:
    paths:
      - '09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/**'
      - '.github/workflows/babylon-third-person-braila-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babylon-braila-spike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DROPI_TRIGGER_EVENT: ${{ github.event_name }}
  DROPI_TRIGGER_REF: ${{ github.ref }}
  DROPI_TRIGGER_SHA: ${{ github.sha }}
  DROPI_PR_NUMBER: ${{ github.event.pull_request.number || 'NOT_APPLICABLE' }}
  DROPI_BASE_SHA: ${{ github.event.pull_request.base.sha || 'NOT_APPLICABLE' }}
  DROPI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DROPI_RUN_ID: ${{ github.run_id }}
  DROPI_RUN_ATTEMPT: ${{ github.run_attempt }}

jobs:
  build-spike:
    runs-on: ubuntu-latest
    env:
      VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout identity
        run: |
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_CHECKOUT_SHA" != "$DROPI_HEAD_SHA" ]; then
            echo "Expected checkout $DROPI_HEAD_SHA but found $ACTUAL_CHECKOUT_SHA." >&2
            exit 1
          fi
          echo "DROPI_CHECKOUT_SHA=$ACTUAL_CHECKOUT_SHA" >> "$GITHUB_ENV"

      - name: Setup Node 22.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/package-lock.json

      - name: Verify pinned Node and npm toolchain
        run: |
          node --version | grep -Fx 'v22.13.0'
          npm --version | grep -Fx '10.9.2'

      - name: Install lockfile-pinned spike dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Strict TypeScript and Vite build
        run: npm run build

      - name: Reject disabled spike type checking
        run: |
          if grep -Eq '"noCheck"[[:space:]]*:[[:space:]]*true' tsconfig.json; then
            echo 'tsconfig.json must not disable type checking.' >&2
            exit 1
          fi

      - name: Record exact source and bundled-runtime provenance
        run: node scripts/writeAndroidRuntimeManifest.mjs

      - name: Verify deterministic spike truth labels
        run: |
          grep -q "NON-AUTHORITATIVE VISUAL SPIKE" index.html
          grep -q "NOT AUTHENTIC GAMEPLAY" index.html
          grep -q "DROPi TYCOON" index.html
          grep -R -F -q "$DROPI_HEAD_SHA" dist/assets
          grep -R -F -q 'dropi:native-back' dist/assets
          grep -R -F -q 'dropi:exit-game' dist/assets
          grep -F -q "head_sha=$DROPI_HEAD_SHA" dist/build-evidence.txt
          grep -F -q "checkout_sha=$DROPI_HEAD_SHA" dist/build-evidence.txt
          grep -F -q '"productionEligible": false' dist/dropi-runtime-manifest.json
          grep -F -q '"authenticGameplay": false' dist/dropi-runtime-manifest.json

      - name: Record preview payload
        run: |
          du -sh dist
          find dist -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Verify static preview server
        run: |
          npm run preview -- --port 4173 > /tmp/dropi-babylon-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill ${PREVIEW_PID} || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ | grep -q "DROPi TYCOON"
          echo 'Static preview serves correctly. CI visual WebGL capture is intentionally not used as acceptance evidence.'

      - name: Upload exact static spike build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropi-babylon-third-person-braila-v1
          path: |
            09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/dist
            09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/INSTALL_ANDROID_EVALUATION_APK.md
          if-no-files-found: error
          retention-days: 14

  android-evaluation-apk:
    name: Android evaluation APK
    needs: build-spike
    runs-on: ubuntu-latest
    env:
      DROPI_ANDROID_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout identity
        run: |
          ACTUAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_CHECKOUT_SHA" != "$DROPI_HEAD_SHA" ]; then
            echo "Expected checkout $DROPI_HEAD_SHA but found $ACTUAL_CHECKOUT_SHA." >&2
            exit 1
          fi
          echo "DROPI_CHECKOUT_SHA=$ACTUAL_CHECKOUT_SHA" >> "$GITHUB_ENV"

      - name: Define isolated runner-temporary paths
        run: |
          echo "DROPI_STAGE_ROOT=$RUNNER_TEMP/dropi-babylon-android-evaluation-$DROPI_RUN_ID-$DROPI_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "DROPI_APK_OUTPUT=$RUNNER_TEMP/dropi-babylon-android-eval-$DROPI_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Setup Node 22.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: game-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify pinned Node and npm toolchain
        run: |
          node --version | grep -Fx 'v22.13.0'
          npm --version | grep -Fx '10.9.2'
          java -version
          test -n "$ANDROID_HOME"

      - name: Download exact static spike build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dropi-babylon-third-person-braila-v1
          path: ${{ runner.temp }}/dropi-babylon-static

      - name: Prepare isolated CI-only Android evaluation stage
        run: |
          node 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/prepareAndroidEvaluationStage.mjs \
            "$GITHUB_WORKSPACE/game-mobile" \
            "$RUNNER_TEMP/dropi-babylon-static/dist" \
            "$DROPI_STAGE_ROOT"

      - name: Install lockfile-pinned mobile dependencies
        run: |
          cd "$DROPI_STAGE_ROOT/game-mobile"
          npm ci --no-audit --no-fund

      - name: Validate CI-only mobile overlay TypeScript
        env:
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE: bundled
        run: |
          cd "$DROPI_STAGE_ROOT/game-mobile"
          npm run typecheck

      - name: Generate isolated Android native project
        env:
          CI: '1'
          NODE_ENV: production
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE: bundled
        run: |
          cd "$DROPI_STAGE_ROOT/game-mobile"
          ./node_modules/.bin/expo prebuild --platform android --clean --no-install

      - name: Verify isolated native configuration and bundled spike
        run: |
          grep -F -q "applicationId 'com.dropi.tycoon.babyloneval'" "$DROPI_STAGE_ROOT/game-mobile/android/app/build.gradle"
          grep -F -q "versionCode $DROPI_ANDROID_VERSION_CODE" "$DROPI_STAGE_ROOT/game-mobile/android/app/build.gradle"
          grep -F -q '<string name="app_name">DROPi Babylon Eval</string>' "$DROPI_STAGE_ROOT/game-mobile/android/app/src/main/res/values/strings.xml"
          grep -F -q 'BUNDLED_RUNTIME_PORT = 17832' "$DROPI_STAGE_ROOT/game-mobile/src/bundledRuntime.ts"
          test -f "$DROPI_STAGE_ROOT/game-mobile/android/app/src/main/assets/dropi-game/index.html"
          test -f "$DROPI_STAGE_ROOT/game-mobile/android/app/src/main/assets/dropi-game/dropi-runtime-manifest.json"
          cmp \
            "$RUNNER_TEMP/dropi-babylon-static/dist/dropi-runtime-manifest.json" \
            "$DROPI_STAGE_ROOT/game-mobile/android/app/src/main/assets/dropi-game/dropi-runtime-manifest.json"

      - name: Build debug-signed release-mode evaluation APK
        env:
          CI: '1'
          NODE_ENV: production
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE: bundled
        run: |
          cd "$DROPI_STAGE_ROOT/game-mobile/android"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Verify APK payload and write attestation
        run: |
          APK_PATH="$DROPI_STAGE_ROOT/game-mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          unzip -t "$APK_PATH"
          unzip -Z1 "$APK_PATH" | grep -Fx 'assets/dropi-game/index.html'
          unzip -Z1 "$APK_PATH" | grep -Fx 'assets/dropi-game/dropi-runtime-manifest.json'
          unzip -Z1 "$APK_PATH" | grep -E '^assets/index\.android\.bundle$|^assets/index\.android\.bundle\.pack$'
          node 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/attestAndroidEvaluationApk.mjs \
            "$APK_PATH" \
            "$DROPI_STAGE_ROOT" \
            "$DROPI_APK_OUTPUT"
          cp \
            09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/INSTALL_ANDROID_EVALUATION_APK.md \
            "$DROPI_APK_OUTPUT/"
          cd "$DROPI_APK_OUTPUT"
          sha256sum -c SHA256SUMS.txt

      - name: Upload installable Android evaluation APK and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropi-babylon-android-eval-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dropi-babylon-android-eval-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
