name: Babylon Third-Person Brăila Spike

on:
  pull_request:
    paths:
      - '09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/**'
      - '.github/workflows/babylon-third-person-braila-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install pinned spike dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: TypeScript + Vite build
        run: npm run build

      - name: Verify deterministic spike truth labels
        run: |
          grep -q "NON-AUTHORITATIVE VISUAL SPIKE" index.html
          grep -q "NOT AUTHENTIC GAMEPLAY" index.html
          grep -q "DROPi TYCOON" index.html

      - name: Record bundle size
        run: du -sh dist && find dist -maxdepth 2 -type f -printf '%p %k KB\n' | sort

      - name: Capture exact-build screenshot
        run: |
          mkdir -p evidence
          npm run preview -- --port 4173 > /tmp/dropi-babylon-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill ${PREVIEW_PID} || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo 'No headless Chrome binary available'; exit 1; }
          timeout 30s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=swiftshader \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --hide-scrollbars \
            --window-size=1280,720 \
            --virtual-time-budget=5000 \
            --screenshot=evidence/babylon-third-person-braila-v1.png \
            http://127.0.0.1:4173/
          test -s evidence/babylon-third-person-braila-v1.png

      - name: Upload static spike build and exact-build evidence
        uses: actions/upload-artifact@v4
        with:
          name: dropi-babylon-third-person-braila-v1
          path: |
            09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/dist
            09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/evidence
          retention-days: 14
