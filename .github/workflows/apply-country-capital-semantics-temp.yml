name: TEMP Apply Country Capital Semantics

on:
  push:
    branches:
      - openai/country-capital-semantics-v1
    paths:
      - 'scripts/build_country_locality_catalog.py'
      - '04_World/Country_Catalog/COUNTRY_LOCALITY_ROLE_OVERRIDES.json'
      - '.github/workflows/apply-country-capital-semantics-temp.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-capital-semantics-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check pycountry
      - name: Regenerate governed country data
        run: |
          set -euo pipefail
          python scripts/build_country_locality_catalog.py
          python scripts/build_country_catalog_chapters.py --all
          python scripts/verify_country_catalog_chapters.py --write-report
          git diff --check
      - name: Commit deterministic outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            game-web/public/data/country-representative-localities-v1.json \
            04_World/Country_Catalog/Continents \
            04_World/Country_Catalog/GLOBAL_COUNTRY_CATALOG_AUDIT.md
          if git diff --cached --quiet; then
            echo 'No generated output changes.'
            exit 0
          fi
          git commit -m 'chore: regenerate governed country catalog outputs'
          git push origin HEAD:openai/country-capital-semantics-v1
