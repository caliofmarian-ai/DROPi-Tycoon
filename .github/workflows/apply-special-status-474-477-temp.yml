name: TEMP Apply Special Status 474-477

on:
  push:
    branches:
      - openai/special-status-falkland-antarctica-474-477

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/special-status-falkland-antarctica-474-477
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply governed status semantics
        run: |
          set -euo pipefail
          python scripts/apply_special_status_474_477_temp.py
          git diff --check
      - name: Regenerate country catalog manifests and verify
        run: |
          set -euo pipefail
          python scripts/build_country_catalog_chapters.py --all
          python scripts/verify_country_catalog_chapters.py --write-report
          git diff --check
          grep -F '| 238 | Falkland Is. | Stanley |' 04_World/Country_Catalog/Continents/southamerica.md
          grep -F '| 010 | Antarctica | McMurdo Station |' 04_World/Country_Catalog/Continents/special.md
      - name: Commit product changes and remove temporary runners
        run: |
          set -euo pipefail
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_special_status_474_477_temp.py .github/workflows/apply-special-status-474-477-temp.yml
          git add 04_World game-web
          git diff --cached --check
          git commit -m 'fix: govern Falkland and Antarctic status semantics'
          git push origin HEAD:openai/special-status-falkland-antarctica-474-477
