name: RBATCH-014 Post-Merge Checkpoint

on:
  push:
    branches:
      - openai/post-rbatch-014-checkpoint

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/post-rbatch-014-checkpoint
          fetch-depth: 0

      - name: Reconcile canonical planning after PR 259 merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          ISSUE_IDS = ('ISSUE-009','ISSUE-014','ISSUE-015','ISSUE-016','ISSUE-017')

          def load(path_str):
              path = ROOT / path_str
              raw = path.read_bytes().decode('utf-8')
              nl = '\r\n' if '\r\n' in raw else '\n'
              return path, raw.replace('\r\n','\n'), nl

          def save(path, text, nl):
              path.write_bytes(text.replace('\n', nl).encode('utf-8'))

          def one(text, old, new):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected one occurrence of {old!r}, found {count}')
              return text.replace(old, new, 1)

          def update_row(text, prefix, updater):
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise RuntimeError(f'Expected one row {prefix!r}, found {len(matches)}')
              idx = matches[0]
              cells = [c.strip() for c in lines[idx].strip().strip('|').split('|')]
              updater(cells)
              lines[idx] = '| ' + ' | '.join(cells) + ' |'
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          def yaml_block(text, item_id):
              marker = f'- id: {item_id}\n'
              start = text.find(marker)
              if start < 0:
                  raise RuntimeError(f'Missing YAML block {item_id}')
              nxt = text.find('\n- id: ', start + len(marker))
              end = len(text) if nxt < 0 else nxt + 1
              return start, end, text[start:end]

          def yaml_field(text, item_id, field, value):
              start, end, block = yaml_block(text, item_id)
              pattern = rf'(^  {re.escape(field)}: ).+$'
              updated, count = re.subn(pattern, rf"\1'{value}'", block, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise RuntimeError(f'Cannot update {field} in {item_id}')
              return text[:start] + updated + text[end:]

          def yaml_label(text, item_id, old, new):
              start, end, block = yaml_block(text, item_id)
              if block.count(old) != 1:
                  raise RuntimeError(f'Expected one {old} in {item_id}, found {block.count(old)}')
              return text[:start] + block.replace(old, new, 1) + text[end:]

          # Batch architecture.
          path, text, nl = load('09_Development/Planning/BATCH_ARCHITECTURE.md')
          def legacy(cells): cells[2] = 'MERGED in PR #259 — pending Railway/public verification'
          text = update_row(text, '| BATCH-013 | RBATCH-014 |', legacy)
          def batch(cells): cells[5] = 'MERGED in PR #259 — pending Railway/public verification'
          text = update_row(text, '| RBATCH-014 |', batch)
          save(path, text, nl)

          # Epic catalog.
          path, text, nl = load('09_Development/Planning/EPIC_CATALOG.md')
          def epic(cells): cells[4] = 'MERGED in PR #259 — pending Railway/public verification'
          text = update_row(text, '| E-015 |', epic)
          save(path, text, nl)

          # Issue catalog.
          path, text, nl = load('09_Development/Planning/ISSUE_CATALOG.md')
          for issue_id in ISSUE_IDS:
              def issue(cells):
                  cells[6] = 'COMPLETED — merged PR #259; Railway/public verification pending at RBATCH-014 level'
                  cells[7] = cells[7].replace('status:in-progress','status:done')
              text = update_row(text, f'| {issue_id} |', issue)
          save(path, text, nl)

          # Machine-readable plan.
          path, text, nl = load('09_Development/Planning/github_creation_plan.yaml')
          text = yaml_field(text, 'RBATCH-014', 'status', 'MERGED in PR #259 — pending Railway/public verification')
          text = yaml_field(text, 'E-015', 'status', 'MERGED in PR #259 — pending Railway/public verification')
          for issue_id in ISSUE_IDS:
              text = yaml_field(text, issue_id, 'status', 'COMPLETED — merged PR #259; Railway/public verification pending at RBATCH-014 level')
              text = yaml_label(text, issue_id, 'status:in-progress', 'status:done')
          save(path, text, nl)

          # Project status.
          path, text, nl = load('00_Project/PROJECT_STATUS.md')
          text = re.sub(
              r'Last Updated: .*',
              'Last Updated: 2026-09-01 (RBATCH-014 merged in PR #259; RBATCH-015 Mobile Optimization ready)',
              text,
              count=1,
          )
          text = re.sub(
              r'Prototype v0\.1 — .*?\n\n---',
              'Prototype v0.1 — RBATCH-010/011/012/013/014 MERGED pending Railway/public verification; RBATCH-015 Mobile Optimization is the next implementation batch\n\n---',
              text,
              count=1,
              flags=re.DOTALL,
          )
          text = re.sub(
              r'# Current Objective\n\n.*?\n\n---',
              '# Current Objective\n\nExecute RBATCH-015 Mobile Optimization (ISSUE-018/#204 viewport fit and ISSUE-019/#205 comfortable touch targets) while preserving the merged Save/Load contract and the canonical long-term visual-quality direction.\n\n---',
              text,
              count=1,
              flags=re.DOTALL,
          )
          text = text.replace('E-015 status: PR #259 — validation complete; pending merge', 'E-015 status: MERGED in PR #259 — pending Railway/public verification')
          text = text.replace('RBATCH-014 status: PR #259 — validation complete; pending merge', 'RBATCH-014 status: MERGED in PR #259 — pending Railway/public verification')
          text = text.replace('ISSUE-009/ISSUE-014/ISSUE-015/ISSUE-016/ISSUE-017 status: PR #259 implementation validated — pending merge', 'ISSUE-009/ISSUE-014/ISSUE-015/ISSUE-016/ISSUE-017 status: COMPLETED — merged PR #259; Railway/public verification pending at RBATCH-014 level')
          save(path, text, nl)

          # Changelog checkpoint.
          path, text, nl = load('09_Development/CHANGELOG.md')
          marker = '# [2026-09-01] - RBATCH-014 SAVE/LOAD VALIDATION'
          section = '''# [2026-09-01] - RBATCH-014 MERGE CHECKPOINT\n\n## Merged\n\n- PR #259 / RBATCH-014 merged into `main` as `6faf7e5f932d33dac766d1d73109e290310c1edc`.\n- Main post-merge CI run `33560288015` succeeded.\n- ISSUE-009 and ISSUE-014 through ISSUE-017 closed as completed.\n\n## Planning\n\n- RBATCH-014 / E-015 now record merged status pending Railway/public gameplay verification.\n- M-007 remains In Progress until public verification is observed.\n- RBATCH-015 Mobile Optimization remains the next ready implementation batch.\n\n---\n\n'''
          if section.strip() not in text:
              text = one(text, marker, section + marker)
          save(path, text, nl)

          print('Post-RBATCH-014 planning reconciliation prepared: PASS')
          PY

      - name: Verify checkpoint
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RBATCH-014 | 1 | M-007 | E-015 | Save/Load Implementation | MERGED in PR #259' 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F 'E-015 | 1 | M-007 | Save & Load System | MERGED in PR #259' 09_Development/Planning/EPIC_CATALOG.md
          for id in ISSUE-009 ISSUE-014 ISSUE-015 ISSUE-016 ISSUE-017; do
            grep -F "| $id |" 09_Development/Planning/ISSUE_CATALOG.md | grep -F 'COMPLETED — merged PR #259' | grep -F 'status:done'
          done
          python3 - <<'PY'
          import yaml
          with open('09_Development/Planning/github_creation_plan.yaml', encoding='utf-8') as handle:
              data = yaml.safe_load(handle)
          batches = {x['id']:x for x in data['batches']}
          epics = {x['id']:x for x in data['epics']}
          issues = {x['id']:x for x in data['issues']}
          assert 'MERGED' in batches['RBATCH-014']['status']
          assert 'MERGED' in epics['E-015']['status']
          for issue_id in ('ISSUE-009','ISSUE-014','ISSUE-015','ISSUE-016','ISSUE-017'):
              assert issues[issue_id]['status'].startswith('COMPLETED')
              assert 'status:done' in issues[issue_id]['label_names']
          assert 'status:ready' in issues['ISSUE-018']['label_names']
          assert 'status:ready' in issues['ISSUE-019']['label_names']
          print('Post-RBATCH-014 YAML checkpoint: PASS')
          PY

      - name: Commit checkpoint ordinary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            00_Project/PROJECT_STATUS.md \
            09_Development/CHANGELOG.md \
            09_Development/Planning/BATCH_ARCHITECTURE.md \
            09_Development/Planning/EPIC_CATALOG.md \
            09_Development/Planning/ISSUE_CATALOG.md \
            09_Development/Planning/github_creation_plan.yaml
          if git diff --cached --quiet; then
            echo 'No checkpoint changes to commit.'
            exit 0
          fi
          git commit -m 'docs: reconcile RBATCH-014 merge checkpoint'
          git push origin HEAD:openai/post-rbatch-014-checkpoint
