name: DT-23 Full Target Canon Film v1 — REJECTED HISTORICAL

# REJECTED / SUPERSEDED on 2026-09-12 by Owner Directive 004.
# This workflow is intentionally manual-only and exists solely for audit/history.
# It must not be used to produce current visual-target material.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DT23_FILM_OUT: artifacts/dt23/full-target-canon-v1/DROPi_Tycoon_Full_Target_Canon_Film_v1.mp4
    steps:
      - name: Historical warning
        shell: bash
        run: |
          echo 'REJECTED / SUPERSEDED visual target.'
          echo 'Current authority: 00_Project/THIRD_PERSON_OPEN_WORLD_VISUAL_EXPERIENCE_CANON.md'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi

      - name: Render rejected historical film
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dt23/render_full_target_canon_film_v1.py
          test -s "$DT23_FILM_OUT"

      - name: Write rejected provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/dt23/full-target-canon-v1
          cat > "$OUT/ARTIFACT_PROVENANCE.txt" <<EOF
          DROPi Tycoon — Full Target Canon Film v1
          repository=${GITHUB_REPOSITORY}
          commit=${GITHUB_SHA}
          workflow_run_id=${GITHUB_RUN_ID}
          classification=HISTORICAL / REJECTED — DO NOT USE AS VISUAL TARGET
          authentic_gameplay_claim=false
          current_visual_authority=00_Project/THIRD_PERSON_OPEN_WORLD_VISUAL_EXPERIENCE_CANON.md
          superseded_by=09_Development/Owner_Directives/2026-09-12_MASTER_OWNER_DIRECTIVE_004_THIRD_PERSON_OPEN_WORLD_VISUAL_EXPERIENCE.md
          EOF

      - name: Upload rejected historical artifact
        uses: actions/upload-artifact@v4
        with:
          name: dropi-tycoon-full-target-canon-film-v1-REJECTED-HISTORICAL
          path: artifacts/dt23/full-target-canon-v1/
          if-no-files-found: error
          retention-days: 7
