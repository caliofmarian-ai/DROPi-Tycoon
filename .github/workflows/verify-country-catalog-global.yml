name: Verify Country Catalog Chapters

on:
  push:
    branches:
      - main
    paths:
      - '04_World/Country_Catalog/**'
      - 'game-web/public/data/world-atlas-countries-110m.json'
      - 'game-web/public/data/expanded-localities-v1/**'
      - 'game-web/public/data/europe-romania-regional-localities-v1.json'
      - 'game-web/public/data/europe-albania-regional-localities-v1.json'
      - 'game-web/public/data/europe-austria-regional-localities-v1.json'
      - 'scripts/verify_country_catalog_chapters.py'
      - 'scripts/verify_expanded_locality_catalog.py'
      - 'scripts/verify_romania_regional_localities.py'
      - 'scripts/verify_representative_regional_localities.py'
      - '.github/workflows/verify-country-catalog-global.yml'
  pull_request:
    branches:
      - main
    paths:
      - '04_World/Country_Catalog/**'
      - 'game-web/public/data/world-atlas-countries-110m.json'
      - 'game-web/public/data/expanded-localities-v1/**'
      - 'game-web/public/data/europe-romania-regional-localities-v1.json'
      - 'game-web/public/data/europe-albania-regional-localities-v1.json'
      - 'game-web/public/data/europe-austria-regional-localities-v1.json'
      - 'scripts/verify_country_catalog_chapters.py'
      - 'scripts/verify_expanded_locality_catalog.py'
      - 'scripts/verify_romania_regional_localities.py'
      - 'scripts/verify_representative_regional_localities.py'
      - '.github/workflows/verify-country-catalog-global.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Country Catalog and representative regional models
        run: |
          set -euo pipefail
          python scripts/verify_country_catalog_chapters.py
          python scripts/verify_expanded_locality_catalog.py
          python scripts/verify_romania_regional_localities.py
          python scripts/verify_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/ALBANIA_REGIONAL_CONFIG.json \
            --data game-web/public/data/europe-albania-regional-localities-v1.json
          python scripts/verify_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/AUSTRIA_REGIONAL_CONFIG.json \
            --data game-web/public/data/europe-austria-regional-localities-v1.json
          git diff --check
