name: Integrate Global Map Runtime

on:
  push:
    branches:
      - openai/global-map-runtime-v1
    paths:
      - .github/workflows/integrate-global-map-runtime.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/global-map-runtime-v1
          fetch-depth: 0

      - name: Apply deterministic runtime integration patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected integration anchor missing in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          patch(
              'game-web/src/config/gameConfig.ts',
              "import { GameWorldScene } from '../scenes/GameWorldScene'\n",
              "import { GameWorldScene } from '../scenes/GameWorldScene'\nimport { GlobalMapScene } from '../scenes/GlobalMapScene'\n",
          )
          patch(
              'game-web/src/config/gameConfig.ts',
              '    GameWorldScene,\n    HQInteriorScene,',
              '    GameWorldScene,\n    GlobalMapScene,\n    HQInteriorScene,',
          )

          patch(
              'game-web/src/ui/UrbanHUD.ts',
              "  recenter: () => void\n}",
              "  recenter: () => void\n  worldMap: () => void\n}",
          )
          patch(
              'game-web/src/ui/UrbanHUD.ts',
              'inside(l.minimap.x - 5, l.minimap.y - 5, l.minimap.width + 10, l.minimap.height + 66)',
              'inside(l.minimap.x - 5, l.minimap.y - 5, l.minimap.width + 10, l.minimap.height + 118)',
          )
          patch(
              'game-web/src/ui/UrbanHUD.ts',
              "    this.button(zoom.x + 38, zoom.y, zoom.size, zoom.size, '+', () => callbacks.zoom('in'))\n\n    this.createDPad()",
              "    this.button(zoom.x + 38, zoom.y, zoom.size, zoom.size, '+', () => callbacks.zoom('in'))\n    this.button(zoom.x, zoom.y + 48, 112, 40, 'World map', callbacks.worldMap)\n\n    this.createDPad()",
          )

          patch(
              'game-web/src/scenes/GameWorldScene.ts',
              "      recenter: () => this.recenterCamera(),\n    })",
              "      recenter: () => this.recenterCamera(),\n      worldMap: () => this.openGlobalMap(),\n    })",
          )
          patch(
              'game-web/src/scenes/GameWorldScene.ts',
              "  private navigate(scene: string): void {\n",
              "  private openGlobalMap(): void {\n    this.clearInput()\n    this.syncRuntimeSession()\n    this.scene.start('GlobalMap')\n  }\n\n  private navigate(scene: string): void {\n",
          )

          patch(
              'game-web/src/platform/nativeBackNavigation.ts',
              "  CompanyManagement: 'GameWorld',\n  GameWorld: 'MainMenu',",
              "  CompanyManagement: 'GameWorld',\n  GlobalMap: 'GameWorld',\n  GameWorld: 'MainMenu',",
          )
          PY

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add game-web/src/config/gameConfig.ts game-web/src/ui/UrbanHUD.ts game-web/src/scenes/GameWorldScene.ts game-web/src/platform/nativeBackNavigation.ts
          git diff --cached --check
          git commit -m 'world-map: integrate global map navigation'
          git push origin HEAD:openai/global-map-runtime-v1
