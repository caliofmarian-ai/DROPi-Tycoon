name: TEMP Finland and Åland Regional Audit

on:
  push:
    branches:
      - openai/europe-finland-regional-localities-538
    paths:
      - .github/workflows/finland-regional-audit-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit retained Finland and Åland source hierarchy
        run: |
          set -euo pipefail
          base='https://github.com/caliofmarian-ai/DROPi-Tycoon/releases/download/source-geonames-cities500-2026-09-08-f3cda4f9'
          curl -fsSL "$base/cities500.zip" -o /tmp/cities500.zip
          curl -fsSL "$base/admin1CodesASCII.txt" -o /tmp/admin1CodesASCII.txt
          printf '%s  %s\n' 'f3cda4f9d256d90045121fb8eebad3ed91695c32370ed93b50fbe0cb616e2bbd' /tmp/cities500.zip | sha256sum -c -
          printf '%s  %s\n' '590651498043f674accda2b7f46d21286cda0e290b02f8561c5005eee9a5448c' /tmp/admin1CodesASCII.txt | sha256sum -c -
          python - <<'PY'
          import collections, io, json, zipfile
          from pathlib import Path

          fields = [
              'geonameid','name','asciiname','alternatenames','latitude','longitude',
              'feature_class','feature_code','country_code','cc2','admin1_code',
              'admin2_code','admin3_code','admin4_code','population','elevation',
              'dem','timezone','modification_date'
          ]
          admin_rows = {}
          for line in Path('/tmp/admin1CodesASCII.txt').read_text(encoding='utf-8').splitlines():
              if line.startswith(('FI.', 'AX.')):
                  f = line.split('\t')
                  cc, code = f[0].split('.', 1)
                  admin_rows[(cc, code)] = {'name': f[1], 'asciiName': f[2], 'sourceRef': f'geonames:{f[3]}'}

          groups = collections.defaultdict(list)
          with zipfile.ZipFile('/tmp/cities500.zip') as zf:
              with zf.open('cities500.txt') as raw:
                  for line in io.TextIOWrapper(raw, encoding='utf-8'):
                      row = dict(zip(fields, line.rstrip('\n').split('\t')))
                      if row['country_code'] in {'FI', 'AX'}:
                          groups[(row['country_code'], row['admin1_code'])].append(row)

          priority = {'PPLC': 0, 'PPLA': 1, 'PPLA2': 2, 'PPLA3': 3, 'PPLA4': 4, 'PPL': 5}
          for cc in ('FI', 'AX'):
              admin = {code: data for (country, code), data in admin_rows.items() if country == cc}
              country_groups = {code: rows for (country, code), rows in groups.items() if country == cc}
              print(f'{cc}_ADMIN1_COUNT', len(admin))
              print(f'{cc}_SOURCE_LOCALITIES', sum(len(rows) for rows in country_groups.values()))
              print(f'{cc}_ADMIN1_WITH_LOCALITIES', sum(bool(country_groups.get(code)) for code in admin))
              for code in sorted(admin):
                  rows = country_groups.get(code, [])
                  ranked = [r for r in rows if r['feature_code'] in priority]
                  ranked.sort(key=lambda r: (priority[r['feature_code']], -int(r['population'] or 0), r['name'].casefold(), int(r['geonameid'])))
                  print(json.dumps({
                      'countryCode': cc,
                      'code': code,
                      'region': admin[code]['name'],
                      'regionAscii': admin[code]['asciiName'],
                      'regionSourceRef': admin[code]['sourceRef'],
                      'candidateCount': len(rows),
                      'adminCandidates': [{
                          'name': r['name'], 'asciiName': r['asciiname'], 'featureCode': r['feature_code'],
                          'population': int(r['population'] or 0), 'sourceRef': f"geonames:{r['geonameid']}",
                          'lat': float(r['latitude']), 'lon': float(r['longitude'])
                      } for r in ranked[:10]],
                  }, ensure_ascii=False))
          PY
