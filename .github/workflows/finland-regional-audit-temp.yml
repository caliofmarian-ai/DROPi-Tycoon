name: TEMP Finland Regional Materializer

on:
  push:
    branches:
      - openai/europe-finland-regional-localities-538
    paths:
      - .github/workflows/finland-regional-audit-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Extend generic source-crosswalk contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_representative_regional_localities.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def build(config, cities_zip, admin1_path):')
          end = text.index('\ndef write_doc(payload, output_path):', start)
          replacement = '''def build(config, cities_zip, admin1_path):
              country = config['country']
              country_code = country['sourceCountryCode']
              expected_regions = config['expectedRegions']
              expected_codes = [str(item['admin1Code']) for item in expected_regions]
              source_country_codes = list(config['source'].get('candidateCountryCodes', [country_code]))

              if country_code not in source_country_codes:
                  raise RuntimeError('primary country source code must be included in candidateCountryCodes')
              if len(expected_regions) != int(config['administrativeModel']['unitCount']):
                  raise RuntimeError('expectedRegions count does not match administrativeModel.unitCount')
              if len(set(expected_codes)) != len(expected_codes):
                  raise RuntimeError('expectedRegions contains duplicate canonical admin1 codes')
              if len(set(source_country_codes)) != len(source_country_codes):
                  raise RuntimeError('candidateCountryCodes contains duplicates')

              admins = {code: load_admin1(admin1_path, code) for code in source_country_codes}
              groups_by_country = {code: load_country_places(cities_zip, code) for code in source_country_codes}
              resolved = []

              for expected in expected_regions:
                  code = str(expected['admin1Code'])
                  region_override = expected.get('regionSourceOverride')
                  if region_override:
                      source = {
                          'sourceName': region_override.get('sourceName', expected['sourceName']),
                          'asciiName': region_override.get('asciiName', expected['sourceName']),
                          'sourceRef': region_override['sourceRef'],
                      }
                  else:
                      region_country_code = expected.get('regionSourceCountryCode', country_code)
                      region_admin1_code = str(expected.get('regionSourceAdmin1Code', code))
                      if region_country_code not in admins:
                          raise RuntimeError(f'{region_country_code}: region source country is not in candidateCountryCodes')
                      source = admins[region_country_code].get(region_admin1_code)
                      if not source:
                          raise RuntimeError(f'{region_country_code}.{region_admin1_code}: missing retained admin1 source row')

                  if norm(source['sourceName']) != norm(expected['sourceName']):
                      raise RuntimeError(
                          f'{country_code}.{code}: regional source name {source["sourceName"]!r} '
                          f'does not match configured sourceName {expected["sourceName"]!r}'
                      )

                  locality_country_code = expected.get('localitySourceCountryCode', country_code)
                  if locality_country_code not in groups_by_country:
                      raise RuntimeError(f'{locality_country_code}: locality source country is not in candidateCountryCodes')
                  locality_scope = expected.get('localitySourceScope', 'admin1')
                  locality_admin1_code = str(expected.get('localitySourceAdmin1Code', code))
                  if locality_scope == 'country':
                      rows = [
                          row
                          for admin_rows in groups_by_country[locality_country_code].values()
                          for row in admin_rows
                      ]
                  elif locality_scope == 'admin1':
                      rows = groups_by_country[locality_country_code].get(locality_admin1_code, [])
                  else:
                      raise RuntimeError(f'{country_code}.{code}: unsupported localitySourceScope {locality_scope!r}')
                  if not rows:
                      raise RuntimeError(f'{country_code}.{code}: no retained locality candidates')
                  resolved.append((expected, source, locality_country_code, locality_scope, rows))

              source_count = sum(
                  len(rows)
                  for source_code in source_country_codes
                  for rows in groups_by_country[source_code].values()
              )
              expected_source_count = int(config['source']['expectedCountryCandidateCount'])
              if source_count != expected_source_count:
                  raise RuntimeError(
                      f'{country_code}: retained candidate count drift {source_count} != {expected_source_count}'
                  )

              policy = config['selectionPolicy']
              primary_codes = list(policy['primaryFeatureCodes'])
              fallback_codes = list(policy['fallbackFeatureCodes'])
              units = []
              for expected, source, locality_country_code, locality_scope, rows in resolved:
                  code = str(expected['admin1Code'])
                  chosen, basis = choose_representative(rows, primary_codes, fallback_codes)
                  default_role = (
                      'national-capital-and-regional-node'
                      if chosen['feature_code'] == 'PPLC' and locality_country_code == country_code
                      else 'regional-representative-locality'
                  )
                  presentation_role = expected.get('presentationRole', default_role)
                  units.append({
                      'admin1Code': code,
                      'regionName': expected['canonicalName'],
                      'regionSourceName': source['sourceName'],
                      'regionAsciiName': source['asciiName'],
                      'regionSourceRef': source['sourceRef'],
                      'representativeLocality': {
                          'localityId': f"dropi:locality:geonames:{chosen['geonameid']}",
                          'sourceRef': f"geonames:{chosen['geonameid']}",
                          'sourceCountryCode': locality_country_code,
                          'sourceAdmin1Code': chosen['admin1_code'],
                          'sourceScope': locality_scope,
                          'name': chosen['name'],
                          'asciiName': chosen['asciiname'] or chosen['name'],
                          'latitude': round(float(chosen['latitude']), 6),
                          'longitude': round(float(chosen['longitude']), 6),
                          'featureCode': chosen['feature_code'],
                          'populationSourceValue': int(chosen['population'] or 0),
                          'selectionBasis': basis,
                          'presentationRole': presentation_role,
                      },
                      'economicEmergence': {
                          'authority': config['economicEmergence']['authority'],
                          'personalPlayerProgressionUnlock': bool(config['economicEmergence']['personalPlayerProgressionUnlock']),
                          'numericThresholdsDefined': bool(config['economicEmergence']['numericThresholdsDefined']),
                          'presentationState': 'economy-system-governed',
                      },
                  })

              if len({unit['representativeLocality']['localityId'] for unit in units}) != len(units):
                  raise RuntimeError('representative locality identities must be unique')
              primary_count = sum(
                  unit['representativeLocality']['selectionBasis'] == 'source-first-order-seat-role'
                  for unit in units
              )
              fallback_count = len(units) - primary_count
              if primary_count != int(policy['expectedPrimarySelections']):
                  raise RuntimeError(f'primary selection count drift {primary_count}')
              if fallback_count != int(policy['expectedFallbackSelections']):
                  raise RuntimeError(f'fallback selection count drift {fallback_count}')

              return {
                  'version': '1.0.0',
                  'issue': config['issue'],
                  'continent': config['continent'],
                  'country': country,
                  'administrativeModel': config['administrativeModel'],
                  'source': {
                      **config['source'],
                      'publishedGameplayRepresentativeCount': len(units),
                  },
                  'selectionModel': {
                      **policy,
                      'rule': 'One source-backed representative locality per governed first-order region; retained high-density source remains reference-only.',
                  },
                  'developmentModel': {
                      **config['economicEmergence'],
                      'signalsPlanned': [
                          'company-activity', 'employment-demand', 'production', 'logistics-throughput',
                          'construction-investment', 'transport-connectivity', 'trade-volume',
                          'population-economic-simulation', 'regional-national-policy',
                      ],
                      'rule': 'Representative locality prominence and development are shared-world economic outcomes, not personal progression rewards.',
                  },
                  'units': units,
              }

          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          verifier = Path('scripts/verify_representative_regional_localities.py')
          vtext = verifier.read_text(encoding='utf-8')
          old = """        locality = unit['representativeLocality']\n        assert -90 <= locality['latitude'] <= 90\n        assert -180 <= locality['longitude'] <= 180\n        assert locality['localityId'].startswith('dropi:locality:geonames:')\n        assert locality['sourceRef'].startswith('geonames:')\n"""
          new = """        locality = unit['representativeLocality']\n        expected_source_country = expected.get('localitySourceCountryCode', config['country']['sourceCountryCode'])\n        assert locality.get('sourceCountryCode', config['country']['sourceCountryCode']) == expected_source_country\n        assert -90 <= locality['latitude'] <= 90\n        assert -180 <= locality['longitude'] <= 180\n        assert locality['localityId'].startswith('dropi:locality:geonames:')\n        assert locality['sourceRef'].startswith('geonames:')\n"""
          if old not in vtext:
              raise SystemExit('verifier locality block not found')
          vtext = vtext.replace(old, new)
          old_capitals = """    capitals = [unit for unit in units if unit['representativeLocality']['featureCode'] == 'PPLC']\n    assert len(capitals) == 1\n    assert capitals[0]['representativeLocality']['presentationRole'] == 'national-capital-and-regional-node'\n"""
          new_capitals = """    national_capitals = [\n        unit for unit in units\n        if unit['representativeLocality']['presentationRole'] == 'national-capital-and-regional-node'\n    ]\n    assert len(national_capitals) == 1\n    assert national_capitals[0]['representativeLocality']['featureCode'] == 'PPLC'\n"""
          if old_capitals not in vtext:
              raise SystemExit('verifier capital block not found')
          verifier.write_text(vtext.replace(old_capitals, new_capitals), encoding='utf-8')
          PY
      - name: Write Finland canonical config and context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          stat = 'https://stat.fi/en/luokitukset/maakunta/maakunta_1_20260101'
          aland = 'https://www.aland.ax/en/facts-about-aland'
          config = {
              'version': '1.0.0',
              'issue': 538,
              'continent': 'Europe',
              'country': {
                  'geometryId': '246',
                  'sourceCountryCode': 'FI',
                  'renderedName': 'Finland',
              },
              'administrativeModel': {
                  'level': 'first-order-region-with-autonomous-special-case',
                  'nativeTermSingular': 'maakunta',
                  'nativeTermPlural': 'maakunnat',
                  'englishTerm': 'region',
                  'unitCount': 19,
                  'officialReferences': [stat, aland],
                  'specialCases': [
                      {
                          'type': 'aland-autonomous-region',
                          'canonicalRegionCode': '21',
                          'note': 'Åland is one of Statistics Finland’s 19 regions and has autonomous legislative and budgetary powers under Finland’s constitutional/legal order. DROPi preserves that autonomy semantically without creating duplicate territorial ownership.',
                      },
                      {
                          'type': 'cross-source-locality-ownership',
                          'canonicalRegionCode': '21',
                          'note': 'GeoNames publishes Åland localities under country code AX rather than FI. The Finland regional layer therefore crosswalks official region 21 Åland to the retained AX locality corpus and selects Mariehamn without fabricating coordinates or pretending an AX internal admin1 row is the Finnish region itself.',
                      },
                  ],
              },
              'source': {
                  'provider': 'GeoNames',
                  'license': 'Creative Commons Attribution 4.0',
                  'releaseTag': 'source-geonames-cities500-2026-09-08-f3cda4f9',
                  'cities500Sha256': 'f3cda4f9d256d90045121fb8eebad3ed91695c32370ed93b50fbe0cb616e2bbd',
                  'admin1Sha256': '590651498043f674accda2b7f46d21286cda0e290b02f8561c5005eee9a5448c',
                  'candidateCountryCodes': ['FI', 'AX'],
                  'expectedCountryCandidateCount': 951,
                  'regionalCrosswalkProvider': 'Statistics Finland',
                  'regionalCrosswalkReference': stat,
              },
              'selectionPolicy': {
                  'primaryFeatureCodes': ['PPLC', 'PPLA'],
                  'fallbackFeatureCodes': ['PPLA2', 'PPLA3', 'PPL'],
                  'expectedPrimarySelections': 19,
                  'expectedFallbackSelections': 0,
                  'highDensityGameplayImport': False,
                  'hardcodedCoordinates': False,
              },
              'economicEmergence': {
                  'authority': 'shared-regional-national-multiplayer-economy',
                  'personalPlayerProgressionUnlock': False,
                  'numericThresholdsDefined': False,
              },
              'expectedRegions': [
                  {'admin1Code': '01', 'canonicalName': 'Uusimaa', 'sourceName': 'Uusimaa'},
                  {'admin1Code': '02', 'canonicalName': 'Southwest Finland', 'sourceName': 'Southwest Finland'},
                  {'admin1Code': '04', 'canonicalName': 'Satakunta', 'sourceName': 'Satakunta'},
                  {'admin1Code': '05', 'canonicalName': 'Kanta-Häme', 'sourceName': 'Kanta-Häme'},
                  {'admin1Code': '06', 'canonicalName': 'Pirkanmaa', 'sourceName': 'Pirkanmaa'},
                  {'admin1Code': '07', 'canonicalName': 'Päijät-Häme', 'sourceName': 'Paijat-Hame'},
                  {'admin1Code': '08', 'canonicalName': 'Kymenlaakso', 'sourceName': 'Kymenlaakso'},
                  {'admin1Code': '09', 'canonicalName': 'South Karelia', 'sourceName': 'South Karelia'},
                  {'admin1Code': '10', 'canonicalName': 'South Savo', 'sourceName': 'South Savo'},
                  {'admin1Code': '11', 'canonicalName': 'North Savo', 'sourceName': 'North Savo'},
                  {'admin1Code': '12', 'canonicalName': 'North Karelia', 'sourceName': 'North Karelia'},
                  {'admin1Code': '13', 'canonicalName': 'Central Finland', 'sourceName': 'Central Finland'},
                  {'admin1Code': '14', 'canonicalName': 'South Ostrobothnia', 'sourceName': 'South Ostrobothnia'},
                  {'admin1Code': '15', 'canonicalName': 'Ostrobothnia', 'sourceName': 'Ostrobothnia'},
                  {'admin1Code': '16', 'canonicalName': 'Central Ostrobothnia', 'sourceName': 'Central Ostrobothnia'},
                  {'admin1Code': '17', 'canonicalName': 'North Ostrobothnia', 'sourceName': 'North Ostrobothnia'},
                  {'admin1Code': '18', 'canonicalName': 'Kainuu', 'sourceName': 'Kainuu'},
                  {'admin1Code': '19', 'canonicalName': 'Lapland', 'sourceName': 'Lapland'},
                  {
                      'admin1Code': '21',
                      'canonicalName': 'Åland',
                      'sourceName': 'Åland',
                      'regionSourceOverride': {
                          'sourceName': 'Åland',
                          'asciiName': 'Aland',
                          'sourceRef': stat,
                      },
                      'localitySourceCountryCode': 'AX',
                      'localitySourceScope': 'country',
                      'presentationRole': 'autonomous-region-capital-and-regional-node',
                  },
              ],
          }
          config_path = Path('04_World/Country_Catalog/Continents/Europe/FINLAND_REGIONAL_CONFIG.json')
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          context = f'''# Finland Administrative Context\n\nStatus: canonical country context for issue #538 under Europe rollout #508.\n\n## Current 2026 regional model\n\nStatistics Finland's **Regions 2026** classification is valid from 1 January 2026, reports no region changes on that date, and includes **19 regions (`maakunnat`)**. The regional council territories correspond to the regions and regional councils are responsible for regional development in their operating areas.\n\nOfficial source:\n- {stat}\n\n## Åland boundary\n\nÅland is region **21** in the official Finnish regional classification. It is also an autonomous region with its own Parliament and Government and legislative/budgetary powers in devolved fields.\n\nOfficial Åland source:\n- {aland}\n\nDROPi therefore models Åland as one of Finland's 19 first-order regional/economic territories while preserving its autonomous status. This does **not** create a second national sovereignty surface or duplicate territorial ownership.\n\n## Retained-source crosswalk\n\nThe retained GeoNames release exposes:\n- `FI`: 18 admin1 regional records and 930 candidate localities;\n- `AX`: Åland as a separate source country code with 21 candidate localities across three internal source admin1 groups.\n\nThe source split is a provider/data-model fact, not DROPi political semantics. For official Finland region 21 Åland, DROPi uses the Statistics Finland region identity and the retained `AX` locality corpus for source-backed representative selection. Mariehamn (`geonames:3041732`, `PPLC`) becomes the Åland regional representative with role `autonomous-region-capital-and-regional-node`, never Finland's national capital.\n\nHelsinki remains Finland's unique `national-capital-and-regional-node`.\n\n## Gameplay/economy rule\n\nAll 19 regional nodes belong to the shared Finland economy. `personalPlayerProgressionUnlock=false` and no arbitrary numeric development thresholds are introduced here.\n'''
          Path('04_World/Country_Catalog/Continents/Europe/FINLAND_ADMINISTRATIVE_CONTEXT.md').write_text(context, encoding='utf-8')
          PY
      - name: Download retained GeoNames assets
        run: |
          set -euo pipefail
          base='https://github.com/caliofmarian-ai/DROPi-Tycoon/releases/download/source-geonames-cities500-2026-09-08-f3cda4f9'
          curl -fsSL "$base/cities500.zip" -o /tmp/cities500.zip
          curl -fsSL "$base/admin1CodesASCII.txt" -o /tmp/admin1CodesASCII.txt
          printf '%s  %s\n' 'f3cda4f9d256d90045121fb8eebad3ed91695c32370ed93b50fbe0cb616e2bbd' /tmp/cities500.zip | sha256sum -c -
          printf '%s  %s\n' '590651498043f674accda2b7f46d21286cda0e290b02f8561c5005eee9a5448c' /tmp/admin1CodesASCII.txt | sha256sum -c -
      - name: Generate and verify Finland
        run: |
          set -euo pipefail
          python scripts/build_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/FINLAND_REGIONAL_CONFIG.json \
            --cities-zip /tmp/cities500.zip \
            --admin1 /tmp/admin1CodesASCII.txt \
            --out game-web/public/data/europe-finland-regional-localities-v1.json \
            --doc 04_World/Country_Catalog/Continents/Europe/FINLAND_REGIONAL_LOCALITIES.md
          python scripts/verify_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/FINLAND_REGIONAL_CONFIG.json \
            --data game-web/public/data/europe-finland-regional-localities-v1.json
      - name: Add deterministic Finland test
        run: |
          cat > game-web/tests/finland-regional-localities.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest'
          import registry from '../public/data/europe-finland-regional-localities-v1.json'
          import config from '../../04_World/Country_Catalog/Continents/Europe/FINLAND_REGIONAL_CONFIG.json'

          describe('Finland representative regional localities', () => {
            it('publishes all 19 official 2026 regions with stable unique source identities', () => {
              expect(registry.units).toHaveLength(19)
              expect(config.administrativeModel.unitCount).toBe(19)
              expect(new Set(registry.units.map((unit) => unit.admin1Code)).size).toBe(19)
              expect(new Set(registry.units.map((unit) => unit.representativeLocality.localityId)).size).toBe(19)
              expect(registry.source.expectedCountryCandidateCount).toBe(951)
              expect(registry.selectionModel.expectedPrimarySelections).toBe(19)
              expect(registry.selectionModel.expectedFallbackSelections).toBe(0)
            })

            it('keeps Helsinki national while crosswalking autonomous Åland to source-backed Mariehamn', () => {
              const helsinki = registry.units.find((unit) => unit.representativeLocality.name === 'Helsinki')
              const aland = registry.units.find((unit) => unit.admin1Code === '21')
              expect(helsinki?.regionName).toBe('Uusimaa')
              expect(helsinki?.representativeLocality.presentationRole).toBe('national-capital-and-regional-node')
              expect(aland?.regionName).toBe('Åland')
              expect(aland?.representativeLocality.name).toBe('Mariehamn')
              expect(aland?.representativeLocality.sourceRef).toBe('geonames:3041732')
              expect(aland?.representativeLocality.sourceCountryCode).toBe('AX')
              expect(aland?.representativeLocality.presentationRole).toBe('autonomous-region-capital-and-regional-node')
              expect(registry.units.filter((unit) => unit.representativeLocality.presentationRole === 'national-capital-and-regional-node')).toHaveLength(1)
            })

            it('keeps development controlled by shared multiplayer economy', () => {
              for (const unit of registry.units) {
                expect(unit.economicEmergence.authority).toBe('shared-regional-national-multiplayer-economy')
                expect(unit.economicEmergence.personalPlayerProgressionUnlock).toBe(false)
                expect(unit.economicEmergence.numericThresholdsDefined).toBe(false)
              }
            })
          })
          EOF
      - name: Run country and global validation
        run: |
          set -euo pipefail
          cd game-web
          npm ci
          npx vitest run tests/finland-regional-localities.test.ts
          npm run build
          cd ..
          python scripts/verify_country_catalog_chapters.py
          python scripts/verify_expanded_locality_catalog.py
          python scripts/verify_romania_regional_localities.py
          shopt -s nullglob
          for config in 04_World/Country_Catalog/Continents/Europe/*_REGIONAL_CONFIG.json; do
            base_name="$(basename "$config" _REGIONAL_CONFIG.json)"
            slug="$(printf '%s' "$base_name" | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
            data="game-web/public/data/europe-${slug}-regional-localities-v1.json"
            python scripts/verify_representative_regional_localities.py --config "$config" --data "$data"
          done
          git diff --check
      - name: Commit Finland slice and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/finland-regional-audit-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'world: add Finland 19-region representative model'
          git push
