name: Patch Global Map Touch Guard

on:
  push:
    branches:
      - openai/global-map-touch-guard-v1
    paths:
      - .github/workflows/patch-global-map-touch-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/global-map-touch-guard-v1
          fetch-depth: 0
      - name: Stop map control taps from reaching country selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          scene_path = Path('game-web/src/scenes/GlobalMapScene.ts')
          scene = scene_path.read_text()
          old = "    hit.on('pointerdown', callback)\n"
          new = "    hit.on('pointerdown', (\n      _pointer: Phaser.Input.Pointer,\n      _localX: number,\n      _localY: number,\n      event: Phaser.Types.Input.EventData,\n    ) => {\n      event.stopPropagation()\n      callback()\n    })\n"
          if old not in scene:
              raise SystemExit('createButton pointerdown anchor missing')
          scene_path.write_text(scene.replace(old, new, 1))

          test_path = Path('game-web/tests/global-map-runtime.test.ts')
          test = test_path.read_text()
          anchor = "    expect(mapSource).toContain(\"'Open country view'\")\n"
          addition = anchor + "    expect(mapSource).toContain('event.stopPropagation()')\n"
          if "expect(mapSource).toContain('event.stopPropagation()')" not in test:
              if anchor not in test:
                  raise SystemExit('global map touch test anchor missing')
              test_path.write_text(test.replace(anchor, addition, 1))
          PY

          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add game-web/src/scenes/GlobalMapScene.ts game-web/tests/global-map-runtime.test.ts
          git diff --cached --check
          git commit -m 'fix: isolate global map controls from country taps'
          git push origin HEAD:openai/global-map-touch-guard-v1
