name: Materialize Asia Country Catalog Chapter

on:
  push:
    branches:
      - openai/country-catalog-asia-v1
    paths:
      - .github/workflows/materialize-country-catalog-asia.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-catalog-asia-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry
      - name: Regenerate corrected Europe and audited Asia chapters
        run: |
          set -euo pipefail
          python scripts/build_country_catalog_chapters.py --continent Europe
          python scripts/build_country_catalog_chapters.py --continent Asia
          grep -Fq '| 826 | United Kingdom |' 04_World/Country_Catalog/Continents/europe.md
          if grep -Fq '| 826 | United Kingdom |' 04_World/Country_Catalog/Continents/asia.md; then
            echo 'FAIL: United Kingdom classified in Asia'
            exit 1
          fi
          grep -Fq -- '- countries/territories: **46**' 04_World/Country_Catalog/Continents/asia.md
          grep -Fq -- '- structural PASS: **41**' 04_World/Country_Catalog/Continents/asia.md
          grep -Fq -- '- REVIEW: **5**' 04_World/Country_Catalog/Continents/asia.md
          for issue in 464 465 466 467 468; do
            grep -Fq "#$issue:" 04_World/Country_Catalog/Continents/asia.md
          done
          git diff --check
      - name: Commit generated manifests
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_World/Country_Catalog/Continents/europe.md \
                  04_World/Country_Catalog/Continents/asia.md
          if git diff --cached --quiet; then
            echo 'No generated manifest changes required.'
            exit 0
          fi
          git commit -m 'world-data: apply Asia semantic reviews to chapter manifest'
          git push origin HEAD:openai/country-catalog-asia-v1
