name: TEMP Apply Jerusalem Status 467-468
on:
  push:
    branches:
      - openai/jerusalem-status-semantics-467-468
    paths:
      - scripts/apply_jerusalem_status_467_468_temp.py
      - .github/workflows/apply-jerusalem-status-467-468-temp.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/jerusalem-status-semantics-467-468
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install --disable-pip-version-check pycountry
      - name: Apply governed Jerusalem reconciliation
        run: |
          set -euo pipefail
          python scripts/apply_jerusalem_status_467_468_temp.py
          git diff --check
      - name: Regenerate locality catalog and audit manifests
        run: |
          set -euo pipefail
          python scripts/build_country_locality_catalog.py
          python scripts/build_country_catalog_chapters.py --all
          python scripts/verify_country_catalog_chapters.py --write-report
          git diff --check
      - name: Commit product changes and remove temporary runners
        run: |
          set -euo pipefail
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_jerusalem_status_467_468_temp.py .github/workflows/apply-jerusalem-status-467-468-temp.yml
          git add 04_World game-web scripts/build_country_locality_catalog.py
          git diff --cached --check
          git commit -m 'fix: reconcile Jerusalem capital and status semantics'
          git push origin HEAD:openai/jerusalem-status-semantics-467-468
