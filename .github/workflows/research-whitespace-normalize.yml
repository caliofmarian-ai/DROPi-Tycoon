name: Research Whitespace Normalize

on:
  push:
    branches:
      - openai/research-r1-player-lifecycle-001

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: openai/research-r1-player-lifecycle-001
          fetch-depth: 0

      - name: Strip trailing whitespace from research markdown
        shell: bash
        run: |
          set -euo pipefail
          find 09_Development/Research/GAME_LOGIC -type f -name '*.md' -print0 \
            | xargs -0 sed -i 's/[[:space:]]\+$//'

          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD || true

          if git diff --quiet; then
            echo "No whitespace changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 09_Development/Research/GAME_LOGIC
          git commit -m "chore: normalize research markdown whitespace"
          git push origin HEAD:openai/research-r1-player-lifecycle-001
