name: TEMP Build Expanded Locality Pilot

on:
  push:
    branches:
      - openai/expanded-locality-importer-pilot-502

permissions:
  contents: write

jobs:
  build-pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/expanded-locality-importer-pilot-502
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check pycountry
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: game-web/package-lock.json
      - name: Generate pilot from retained GeoNames snapshot
        run: |
          set -euo pipefail
          python scripts/build_expanded_locality_catalog.py | tee /tmp/expanded-locality-build.json
          python scripts/verify_expanded_locality_catalog.py
          git diff --check
      - name: Test bounded query API and production build
        working-directory: game-web
        run: |
          set -euo pipefail
          npm ci
          npx vitest run \
            tests/expanded-locality-query.test.ts \
            tests/expanded-locality-source-contract.test.ts \
            tests/expanded-locality-snapshot-retention.test.ts
          npm run build
      - name: Write deterministic pilot audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('game-web/public/data/expanded-localities-v1')
          index = json.loads((root / 'index.json').read_text())
          rows = []
          total_bytes = 0
          total_partitions = 0
          total_matched = 0
          total_anchors = 0
          for country in sorted(index['countries'], key=lambda item: item['countryCode']):
              country_index_path = root / country['indexFile']
              country_index = json.loads(country_index_path.read_text())
              partition_bytes = 0
              for partition in country_index['partitions']:
                  partition_path = country_index_path.parent / partition['file']
                  partition_bytes += partition_path.stat().st_size
              country_index_bytes = country_index_path.stat().st_size
              country_bytes = partition_bytes + country_index_bytes
              total_bytes += country_bytes
              total_partitions += country_index['admin1PartitionCount']
              matched = country_index['anchorReconciliation']['matchedCount']
              anchors = country_index['anchorReconciliation']['globalAnchorCount']
              total_matched += matched
              total_anchors += anchors
              rows.append({
                  'code': country['countryCode'],
                  'geometryId': country['geometryId'],
                  'name': country['renderedName'],
                  'records': country['recordCount'],
                  'partitions': country['admin1PartitionCount'],
                  'anchors': anchors,
                  'matched': matched,
                  'bytes': country_bytes,
              })
          total_bytes += (root / 'index.json').stat().st_size
          output_files = [path for path in root.rglob('*.json')]
          audit = [
              '# Expanded Locality Pilot Audit',
              '',
              'Status: generated and deterministically verified pilot evidence for issue #502.',
              '',
              'Coordinates: #417 #446 #491 #498 #502 #503 #504',
              '',
              '## Source',
              '',
              f"- retained release: `{index['source']['releaseTag']}`;",
              f"- `cities500.zip` SHA-256: `{index['source']['cities500Sha256']}`;",
              f"- source license: {index['source']['license']};",
              f"- attribution: {index['source']['attributionText']}.",
              '',
              '## Pilot totals',
              '',
              f"- countries: **{index['countryCount']}**;",
              f"- imported localities: **{index['localityCount']:,}**;",
              f"- admin1 partitions: **{total_partitions}**;",
              f"- generated JSON files: **{len(output_files)}**;",
              f"- generated catalog bytes: **{total_bytes:,}**;",
              f"- Global LOD anchors reconciled: **{total_matched}/{total_anchors}**;",
              '- raw GeoNames source archives are not committed into the game source tree.',
              '',
              '## Country evidence',
              '',
              '| Source code | DROPi geometry | Country | Localities | Admin1 partitions | Global anchors matched | Generated bytes |',
              '|---|---:|---|---:|---:|---:|---:|',
          ]
          for row in rows:
              audit.append(
                  f"| {row['code']} | {row['geometryId']} | {row['name']} | {row['records']:,} | "
                  f"{row['partitions']} | {row['matched']}/{row['anchors']} | {row['bytes']:,} |"
              )
          audit.extend([
              '',
              '## Validation result',
              '',
              'The pilot passed the offline expanded-locality verifier after generation. The verifier checks retained-source identity, exact country counts, unique locality/source IDs, DROPi geometry ownership, coordinates, importance tiers, admin1 partition accounting, deterministic sort order, antimeridian-aware bounds, Global-anchor reconciliation, and the absence of raw source archives from the game tree.',
              '',
              'The TypeScript bounded-query tests and full production build also passed before the generated pilot was committed.',
              '',
              '## Runtime boundary',
              '',
              'This pilot does **not** draw all imported localities. `expandedLocalityCatalog.ts` loads only viewport-intersecting admin1 partitions, filters by semantic-zoom importance tier, and enforces an explicit caller-provided marker budget. Country Layer rendering integration remains a later #502 slice.',
              '',
              '## Next gate',
              '',
              'Before global expansion, review pilot anchor-match rates and define explicit ownership rules for special-status source codes/geometries. Global generation must preserve the existing neutral status layer and must not infer sovereignty directly from GeoNames country codes.',
              '',
          ])
          Path('04_World/Country_Catalog/EXPANDED_LOCALITY_PILOT_AUDIT.md').write_text('\n'.join(audit), encoding='utf-8')
          print(json.dumps({
              'countries': index['countryCount'],
              'localities': index['localityCount'],
              'partitions': total_partitions,
              'files': len(output_files),
              'bytes': total_bytes,
              'anchorMatches': total_matched,
              'anchors': total_anchors,
              'countryRows': rows,
          }, indent=2))
          PY
          git diff --check
      - name: Commit generated pilot and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-expanded-locality-pilot-temp.yml
          git add \
            game-web/public/data/expanded-localities-v1 \
            04_World/Country_Catalog/EXPANDED_LOCALITY_PILOT_AUDIT.md
          git diff --cached --check
          git commit -m 'data: generate retained-source expanded locality pilot'
          git push origin HEAD:openai/expanded-locality-importer-pilot-502
