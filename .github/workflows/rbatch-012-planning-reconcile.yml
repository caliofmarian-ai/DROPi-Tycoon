name: RBATCH-012 Planning Reconcile

on:
  push:
    branches:
      - openai/rbatch-012-company-management-upgrades

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/rbatch-012-company-management-upgrades
          fetch-depth: 0

      - name: Apply deterministic planning reconciliation
        run: python3 scripts/reconcile_rbatch_012_planning.py

      - name: Verify reconciled markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'RBATCH-011 | 1 | M-005 | E-012 | MainMenu Flow | MERGED in PR #255' 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F 'RBATCH-012 | 1 | M-006 | E-013 | CompanyManagement + Upgrade Purchase Flow | PR #256 — validation complete; pending merge' 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F 'E-013 | 1 | M-006 | Company Management Scene | PR #256 — validation complete; pending merge' 09_Development/Planning/EPIC_CATALOG.md
          grep -F 'M-006 | 1 | Company Management & Bicycle | In Progress' 09_Development/Planning/MILESTONE_ARCHITECTURE.md
          grep -F 'ISSUE-010 | Implement upgrade purchase flow | RBATCH-012' 09_Development/Planning/ISSUE_CATALOG.md
          grep -F 'ISSUE-011 | Implement CompanyManagement scene navigation | RBATCH-012' 09_Development/Planning/ISSUE_CATALOG.md
          grep -F 'PR #256' 00_Project/PROJECT_STATUS.md

      - name: Commit planning reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_Project/PROJECT_STATUS.md 09_Development/CHANGELOG.md 09_Development/Planning/BATCH_ARCHITECTURE.md 09_Development/Planning/EPIC_CATALOG.md 09_Development/Planning/ISSUE_CATALOG.md 09_Development/Planning/MILESTONE_ARCHITECTURE.md 09_Development/Planning/github_creation_plan.yaml
          git commit -m 'docs: reconcile RBATCH-011 merge and RBATCH-012 active state'
          git push origin HEAD:openai/rbatch-012-company-management-upgrades
