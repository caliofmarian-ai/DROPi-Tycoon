name: Materialize North America Country Catalog Chapter

on:
  push:
    branches:
      - openai/country-catalog-north-america-v1
    paths:
      - .github/workflows/materialize-country-catalog-north-america.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/country-catalog-north-america-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pycountry
      - name: Generate North America chapter only
        run: |
          set -euo pipefail
          python scripts/build_country_catalog_chapters.py --continent 'North America'
          git diff --check
      - name: Commit generated North America manifest
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add 04_World/Country_Catalog/Continents/north-america.md
          git commit -m 'world-data: materialize North America country catalog chapter'
          git push origin HEAD:openai/country-catalog-north-america-v1
