name: RBATCH-016 Post-Merge Checkpoint V2

on:
  push:
    branches:
      - openai/post-rbatch-016-checkpoint

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/post-rbatch-016-checkpoint
          fetch-depth: 0

      - name: Reconcile ordinary planning files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          ROOT = Path('.')
          merged = 'MERGED in PR #265 — automated integration verified; release evidence pending RBATCH-017 owner review'
          issue_done = 'COMPLETED — merged PR #265; PR CI 33563515533 and main CI 33563908596 succeeded'
          epic_status = 'In Progress — RBATCH-016 merged; RBATCH-017 pending human owner approval'

          def load(p):
              path=ROOT/p; raw=path.read_bytes().decode('utf-8'); nl='\r\n' if '\r\n' in raw else '\n'; return path,raw.replace('\r\n','\n'),nl
          def save(path,text,nl): path.write_bytes(text.replace('\n',nl).encode('utf-8'))
          def row(text,prefix,fn):
              lines=text.splitlines(); ix=[i for i,x in enumerate(lines) if x.startswith(prefix)]
              if len(ix)!=1: raise RuntimeError(f'{prefix}: {len(ix)} matches')
              i=ix[0]; cells=[c.strip() for c in lines[i].strip().strip('|').split('|')]; fn(cells); lines[i]='| '+' | '.join(cells)+' |'; return '\n'.join(lines)+('\n' if text.endswith('\n') else '')
          def block(text,item):
              marker=f'- id: {item}\n'; s=text.find(marker)
              if s<0: raise RuntimeError(f'missing {item}')
              n=text.find('\n- id: ',s+len(marker)); e=len(text) if n<0 else n+1; return s,e,text[s:e]
          def field(text,item,key,value):
              s,e,b=block(text,item); p=rf'(^  {re.escape(key)}: ).+$'; u,c=re.subn(p,lambda m:m.group(1)+repr(value),b,count=1,flags=re.MULTILINE)
              if c!=1: raise RuntimeError(f'{item}.{key}')
              return text[:s]+u+text[e:]
          def done_label(text,item):
              s,e,b=block(text,item); b=b.replace('status:ready','status:done').replace('status:in-progress','status:done'); return text[:s]+b+text[e:]

          p,t,n=load('09_Development/Planning/BATCH_ARCHITECTURE.md'); t=row(t,'| BATCH-015 | RBATCH-016 |',lambda c:c.__setitem__(2,merged)); t=row(t,'| RBATCH-016 |',lambda c:c.__setitem__(5,merged)); save(p,t,n)
          p,t,n=load('09_Development/Planning/EPIC_CATALOG.md'); t=row(t,'| E-017 |',lambda c:c.__setitem__(4,epic_status)); save(p,t,n)
          p,t,n=load('09_Development/Planning/ISSUE_CATALOG.md')
          for iid in ('ISSUE-020','ISSUE-021'):
              def f(c): c[6]=issue_done; c[7]=c[7].replace('status:ready','status:done').replace('status:in-progress','status:done')
              t=row(t,f'| {iid} |',f)
          save(p,t,n)
          p,t,n=load('09_Development/Planning/github_creation_plan.yaml'); t=field(t,'RBATCH-016','status',merged); t=field(t,'E-017','status',epic_status)
          for iid in ('ISSUE-020','ISSUE-021'): t=done_label(field(t,iid,'status',issue_done),iid)
          save(p,t,n)
          p,t,n=load('00_Project/PROJECT_STATUS.md'); t=re.sub(r'Last Updated: .*','Last Updated: 2026-09-01 (RBATCH-016 merged in PR #265; RBATCH-017 release checklist pending human owner approval)',t,count=1); t=re.sub(r'Prototype v0\.1 — .*?\n\n---','Prototype v0.1 — RBATCH-010 through RBATCH-016 MERGED; automated integration verified; RBATCH-017 Release-Checklist Verification Package pending human owner approval\n\n---',t,count=1,flags=re.DOTALL); t=re.sub(r'# Current Objective\n\n.*?\n\n---','# Current Objective\n\nAwait explicit human owner approval for RBATCH-017, then assemble the release-checklist evidence and owner review package without self-approval claims. Railway/public/physical-device evidence remains distinct from automated CI evidence.\n\n---',t,count=1,flags=re.DOTALL); save(p,t,n)
          p,t,n=load('09_Development/CHANGELOG.md'); marker='# [2026-09-01] - RBATCH-015 MERGE CHECKPOINT'; section='''# [2026-09-01] - RBATCH-016 FULL-LOOP INTEGRATION MERGE CHECKPOINT\n\n## Merged\n\n- PR #265 / RBATCH-016 merged into `main` as `9fc494d098dc860bb337ce1e1504aba8c08d4171`.\n- PR CI run `33563515533` succeeded.\n- Main post-merge CI run `33563908596` succeeded.\n- ISSUE-020/#206 and ISSUE-021/#207 closed as completed and synchronized to `status:done`.\n\n## Next gate\n\n- RBATCH-017 remains Planned — Not Started.\n- Human owner approval required.\n- No self-approval is recorded.\n\n---\n\n''';
          if section.strip() not in t: t=t.replace(marker,section+marker,1)
          save(p,t,n)
          PY
          cat > 09_Development/AI_Reports/2026-09-01_096_RBATCH_016_FULL_LOOP_INTEGRATION_VERIFICATION.md <<'EOF'
          # RBATCH-016 — Full-Loop Integration Verification Report

          Date: 2026-09-01
          Pull Request: #265
          Merge commit: `9fc494d098dc860bb337ce1e1504aba8c08d4171`

          ## Result

          Automated integration verification is complete.

          - PR run `33563515533` on `ce32e118828a858542a3f6af05b361ea76f01974`: SUCCESS.
          - Main post-merge run `33563908596` on `9fc494d098dc860bb337ce1e1504aba8c08d4171`: SUCCESS.

          ## Connected coverage

          Fresh-start success and failure delivery paths, economy/reputation settlement, Bicycle purchase and derived speed, approved autosave/load continuity, transient-state reset, and representative mobile viewport/touch contracts are covered by the integrated automated suite.

          ## Boundary

          Railway/public URL and physical-device observations are not claimed by automated CI. RBATCH-017 requires human owner approval and is not self-approved here.
          EOF

      - name: Verify and commit ordinary checkpoint files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          with open('09_Development/Planning/github_creation_plan.yaml',encoding='utf-8') as f:data=yaml.safe_load(f)
          b={x['id']:x for x in data['batches']}; e={x['id']:x for x in data['epics']}; i={x['id']:x for x in data['issues']}
          assert 'MERGED' in b['RBATCH-016']['status']; assert b['RBATCH-017']['status']=='Planned — Not Started'; assert b['RBATCH-017']['owner_gates']=='Human owner approval required'; assert e['E-017']['status'].startswith('In Progress')
          for iid in ('ISSUE-020','ISSUE-021'): assert i[iid]['status'].startswith('COMPLETED') and 'status:done' in i[iid]['label_names']
          print('RBATCH-016 ordinary checkpoint: PASS')
          PY
          git -c core.whitespace=cr-at-eol diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_Project/PROJECT_STATUS.md 09_Development/AI_Reports/2026-09-01_096_RBATCH_016_FULL_LOOP_INTEGRATION_VERIFICATION.md 09_Development/CHANGELOG.md 09_Development/Planning/BATCH_ARCHITECTURE.md 09_Development/Planning/EPIC_CATALOG.md 09_Development/Planning/ISSUE_CATALOG.md 09_Development/Planning/github_creation_plan.yaml
          git commit -m 'docs: reconcile RBATCH-016 merge checkpoint'
          git push origin HEAD:openai/post-rbatch-016-checkpoint
