name: Babylon Android Owner Installability Gate

on:
  pull_request:
    paths:
      - '09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/**'
      - 'game-mobile/**'
      - '.github/workflows/babylon-android-owner-verified.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DROPI_TRIGGER_EVENT: ${{ github.event_name }}
  DROPI_TRIGGER_REF: ${{ github.ref }}
  DROPI_TRIGGER_SHA: ${{ github.sha }}
  DROPI_PR_NUMBER: ${{ github.event.pull_request.number || 'NOT_APPLICABLE' }}
  DROPI_BASE_SHA: ${{ github.event.pull_request.base.sha || 'NOT_APPLICABLE' }}
  DROPI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DROPI_RUN_ID: ${{ github.run_id }}
  DROPI_RUN_ATTEMPT: ${{ github.run_attempt }}
  DROPI_PACKAGE_ID: com.dropi.tycoon.babyloneval
  VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  android-owner-installability:
    name: Android owner installability gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$DROPI_HEAD_SHA"
          echo "DROPI_CHECKOUT_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
          echo "DROPI_STAGE_ROOT=$RUNNER_TEMP/dropi-babylon-android-evaluation-$DROPI_RUN_ID-$DROPI_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "DROPI_ARM64_STAGE_ROOT=$RUNNER_TEMP/dropi-babylon-android-evaluation-arm64-$DROPI_RUN_ID-$DROPI_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "DROPI_APK_OUTPUT=$RUNNER_TEMP/dropi-babylon-android-eval-$DROPI_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Setup Node 22.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/package-lock.json
            game-mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version | grep -Fx 'v22.13.0'
          npm --version | grep -Fx '10.9.2'
          java -version
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Resolve explicit owner release and verified signing identity
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY=09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/evaluationReleaseIdentity.mjs
          echo "DROPI_ANDROID_VERSION_CODE=$(node "$IDENTITY")" >> "$GITHUB_ENV"
          echo "DROPI_UPGRADE_PROBE_VERSION=$(node "$IDENTITY" --probe)" >> "$GITHUB_ENV"
          echo "DROPI_REFERENCE_SIGNER=$(node "$IDENTITY" --signer)" >> "$GITHUB_ENV"

      - name: Verify Android AVD discovery regression contract
        working-directory: 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1
        shell: bash
        run: node --test scripts/verifyAndroidOwnerAvd.test.mjs scripts/verifyAndroidOwnerAbiIsolation.test.mjs scripts/verifyEvaluationReleaseIdentity.test.mjs

      - name: Build exact tested static Babylon payload
        working-directory: 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node scripts/writeAndroidRuntimeManifest.mjs
          grep -R -F -q "$DROPI_HEAD_SHA" dist/assets
          grep -F -q '"productionEligible": false' dist/dropi-runtime-manifest.json
          grep -F -q '"authenticGameplay": false' dist/dropi-runtime-manifest.json

      - name: Prepare isolated Android evaluation stage
        shell: bash
        run: |
          set -euo pipefail
          node 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/prepareAndroidEvaluationStage.mjs \
            "$GITHUB_WORKSPACE/game-mobile" \
            "$GITHUB_WORKSPACE/09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/dist" \
            "$DROPI_STAGE_ROOT"
          cd "$DROPI_STAGE_ROOT/game-mobile"
          npm ci --no-audit --no-fund
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE=bundled npm run typecheck
          CI=1 NODE_ENV=production EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE=bundled \
            ./node_modules/.bin/expo prebuild --platform android --clean --no-install
          grep -F -q "applicationId 'com.dropi.tycoon.babyloneval'" android/app/build.gradle
          grep -F -q "versionCode $DROPI_ANDROID_VERSION_CODE" android/app/build.gradle
          grep -F -q '<string name="app_name">DROPi Babylon Eval</string>' android/app/src/main/res/values/strings.xml
          test -f android/app/src/main/assets/dropi-game/index.html
          cmp \
            "$GITHUB_WORKSPACE/09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/dist/dropi-runtime-manifest.json" \
            android/app/src/main/assets/dropi-game/dropi-runtime-manifest.json

      - name: Resolve Android build tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/aapt"
          echo "DROPI_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Build x86_64 emulator preflight APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$DROPI_STAGE_ROOT/game-mobile/android"
          CI=1 NODE_ENV=production EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE=bundled \
            ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=x86_64
          APK_PATH="$DROPI_STAGE_ROOT/game-mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          cp "$APK_PATH" "$RUNNER_TEMP/dropi-x86_64-preflight.apk"
          ABI_LIST="$(unzip -Z1 "$RUNNER_TEMP/dropi-x86_64-preflight.apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, -)"
          test "$ABI_LIST" = 'x86_64'
          echo "DROPI_EMULATOR_APK=$RUNNER_TEMP/dropi-x86_64-preflight.apk" >> "$GITHUB_ENV"
          echo "DROPI_EMULATOR_APK_SIZE=$(stat -c%s "$RUNNER_TEMP/dropi-x86_64-preflight.apk")" >> "$GITHUB_ENV"

      - name: Verify x86_64 preflight APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$DROPI_EMULATOR_APK"
          unzip -Z1 "$DROPI_EMULATOR_APK" | grep -Fx 'assets/dropi-game/index.html'
          unzip -Z1 "$DROPI_EMULATOR_APK" | grep -Fx 'assets/dropi-game/dropi-runtime-manifest.json'
          "$DROPI_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$DROPI_EMULATOR_APK"
          "$DROPI_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$DROPI_EMULATOR_APK"
          "$DROPI_BUILD_TOOLS/aapt" dump badging "$DROPI_EMULATOR_APK" | grep -F "package: name='$DROPI_PACKAGE_ID'"
          "$DROPI_BUILD_TOOLS/aapt" dump badging "$DROPI_EMULATOR_APK" | grep -Fx "native-code: 'x86_64'"

      - name: Prepare lower-version update probe without altering the candidate
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY="$GITHUB_WORKSPACE/09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/evaluationReleaseIdentity.mjs"
          GRADLE_FILE="$DROPI_STAGE_ROOT/game-mobile/android/app/build.gradle"
          node "$IDENTITY" prepare "$GRADLE_FILE"
          restore_probe() { node "$IDENTITY" restore "$GRADLE_FILE"; }
          trap restore_probe EXIT
          cd "$DROPI_STAGE_ROOT/game-mobile/android"
          CI=1 NODE_ENV=production EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE=bundled \
            ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dropi-update-probe.apk"
          "$DROPI_BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/dropi-update-probe.apk" | grep -F "versionCode='$DROPI_UPGRADE_PROBE_VERSION'"
          for APK in "$DROPI_EMULATOR_APK" "$RUNNER_TEMP/dropi-update-probe.apk"; do
            CERT="$("$DROPI_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | node "$GITHUB_WORKSPACE/09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/evaluationReleaseIdentity.mjs" --parse-signer)"
            test "$CERT" = "$DROPI_REFERENCE_SIGNER"
          done
          echo "DROPI_UPDATE_PROBE_APK=$RUNNER_TEMP/dropi-update-probe.apk" >> "$GITHUB_ENV"

      - name: Install and launch x86_64 preflight on clean Android emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ ! -x "$AVDMANAGER" ]; then AVDMANAGER="$(command -v avdmanager)"; fi
          test -x "$ADB"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          source 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/prepareAndroidOwnerAvd.sh
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi
          "$EMULATOR" -accel-check || true
          "$ADB" start-server
          "$EMULATOR" \
            -avd dropi_owner_ci \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -no-metrics \
            -gpu swiftshader_indirect -accel auto \
            > "$RUNNER_TEMP/dropi-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            "$ADB" emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          DEVICE_READY=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo 'Android emulator exited before ADB became ready.' >&2
              cat "$RUNNER_TEMP/dropi-emulator.log" >&2
              exit 1
            fi
            if "$ADB" get-state 2>/dev/null | grep -Fxq 'device'; then
              DEVICE_READY=1
              break
            fi
            sleep 2
          done
          if [ "$DEVICE_READY" != '1' ]; then
            echo 'Timed out waiting for Android emulator ADB device.' >&2
            "$ADB" devices -l >&2 || true
            cat "$RUNNER_TEMP/dropi-emulator.log" >&2
            exit 1
          fi
          BOOTED=0
          for _ in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo 'Android emulator exited before boot completed.' >&2
              cat "$RUNNER_TEMP/dropi-emulator.log" >&2
              exit 1
            fi
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [ "$BOOTED" != '1' ]; then
            echo 'Timed out waiting for Android boot completion.' >&2
            "$ADB" devices -l >&2 || true
            cat "$RUNNER_TEMP/dropi-emulator.log" >&2
            exit 1
          fi
          DEVICE_ABI="$("$ADB" shell getprop ro.product.cpu.abi | tr -d '\r')"
          DEVICE_ABILIST="$("$ADB" shell getprop ro.product.cpu.abilist | tr -d '\r')"
          echo "Android emulator ABI: $DEVICE_ABI ($DEVICE_ABILIST)"
          test "$DEVICE_ABI" = 'x86_64'
          # The fixture is current payload with the observed legacy version 16.
          # It proves Android update mechanics/signing, not migration of old saves.
          "$ADB" install "$DROPI_UPDATE_PROBE_APK" | tee "$RUNNER_TEMP/dropi-probe-install.txt"
          grep -Fxq 'Success' "$RUNNER_TEMP/dropi-probe-install.txt"
          "$ADB" shell dumpsys package "$DROPI_PACKAGE_ID" | grep -F "versionCode=$DROPI_UPGRADE_PROBE_VERSION "
          "$ADB" install -r "$DROPI_EMULATOR_APK" | tee "$RUNNER_TEMP/dropi-adb-install.txt"
          grep -Fxq 'Success' "$RUNNER_TEMP/dropi-adb-install.txt"
          "$ADB" shell dumpsys package "$DROPI_PACKAGE_ID" | grep -F "versionCode=$DROPI_ANDROID_VERSION_CODE "
          echo 'DROPI_EMULATOR_UPDATE_PROBE=PASS' >> "$GITHUB_ENV"
          "$ADB" shell pm path "$DROPI_PACKAGE_ID" | grep -F "package:"
          "$ADB" logcat -c
          "$ADB" shell monkey -p "$DROPI_PACKAGE_ID" -c android.intent.category.LAUNCHER 1
          sleep 8
          APP_PID="$("$ADB" shell pidof "$DROPI_PACKAGE_ID" | tr -d '\r')"
          test -n "$APP_PID"
          "$ADB" shell dumpsys activity activities | grep -F "$DROPI_PACKAGE_ID" | sed -n '1,5p'
          sleep 7
          STABLE_PID="$("$ADB" shell pidof "$DROPI_PACKAGE_ID" | tr -d '\r')"
          test "$STABLE_PID" = "$APP_PID"
          "$ADB" logcat --pid="$APP_PID" -d -v threadtime > "$RUNNER_TEMP/dropi-app-logcat.txt"
          if grep -Fq 'FATAL EXCEPTION' "$RUNNER_TEMP/dropi-app-logcat.txt"; then
            cat "$RUNNER_TEMP/dropi-app-logcat.txt" >&2
            exit 1
          fi
          "$ADB" shell dumpsys package "$DROPI_PACKAGE_ID" | grep -F 'versionCode=' | sed -n '1p'
          echo 'DROPI_EMULATOR_INSTALL=PASS' >> "$GITHUB_ENV"
          echo 'DROPI_EMULATOR_LAUNCH=PASS' >> "$GITHUB_ENV"
          echo 'DROPI_EMULATOR_STABLE_15S=PASS' >> "$GITHUB_ENV"
          echo "DROPI_EMULATOR_ABI=$DEVICE_ABI" >> "$GITHUB_ENV"

      - name: Prepare independent ARM64 evaluation stage
        shell: bash
        run: |
          set -euo pipefail
          # Do not run Gradle clean on the tested x86_64 project. React Native's
          # native clean can consume codegen directories deleted by other clean tasks.
          # Recreate the same exact-head payload in a fresh project and node_modules.
          test "$DROPI_ARM64_STAGE_ROOT" != "$DROPI_STAGE_ROOT"
          test ! -e "$DROPI_ARM64_STAGE_ROOT"
          node 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/prepareAndroidEvaluationStage.mjs \
            "$GITHUB_WORKSPACE/game-mobile" \
            "$GITHUB_WORKSPACE/09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/dist" \
            "$DROPI_ARM64_STAGE_ROOT"
          cd "$DROPI_ARM64_STAGE_ROOT/game-mobile"
          npm ci --no-audit --no-fund
          EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE=bundled npm run typecheck
          CI=1 NODE_ENV=production EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE=bundled \
            ./node_modules/.bin/expo prebuild --platform android --clean --no-install
          grep -F -q "applicationId 'com.dropi.tycoon.babyloneval'" android/app/build.gradle
          grep -F -q "versionCode $DROPI_ANDROID_VERSION_CODE" android/app/build.gradle
          grep -F -q '<string name="app_name">DROPi Babylon Eval</string>' android/app/src/main/res/values/strings.xml
          test -f android/app/src/main/assets/dropi-game/index.html
          cmp \
            "$GITHUB_WORKSPACE/09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/dist/dropi-runtime-manifest.json" \
            android/app/src/main/assets/dropi-game/dropi-runtime-manifest.json
          cmp "$DROPI_STAGE_ROOT/evaluation-stage.json" "$DROPI_ARM64_STAGE_ROOT/evaluation-stage.json"

      - name: Build ARM64 owner test APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$DROPI_ARM64_STAGE_ROOT/game-mobile/android"
          CI=1 NODE_ENV=production EXPO_PUBLIC_DROPITYCOON_RUNTIME_MODE=bundled \
            ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
          APK_PATH="$DROPI_ARM64_STAGE_ROOT/game-mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          ARM64_SIZE="$(stat -c%s "$APK_PATH")"
          ABI_LIST="$(unzip -Z1 "$APK_PATH" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, -)"
          test "$ABI_LIST" = 'arm64-v8a'
          "$DROPI_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH"
          CERT="$("$DROPI_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH" | node "$GITHUB_WORKSPACE/09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/evaluationReleaseIdentity.mjs" --parse-signer)"
          test "$CERT" = "$DROPI_REFERENCE_SIGNER"
          "$DROPI_BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK_PATH"
          "$DROPI_BUILD_TOOLS/aapt" dump badging "$APK_PATH" | grep -F "package: name='$DROPI_PACKAGE_ID'"
          "$DROPI_BUILD_TOOLS/aapt" dump badging "$APK_PATH" | grep -Fx "native-code: 'arm64-v8a'"
          unzip -t "$APK_PATH"
          echo "DROPI_ARM64_APK=$APK_PATH" >> "$GITHUB_ENV"
          echo "DROPI_ARM64_SIZE=$ARM64_SIZE" >> "$GITHUB_ENV"

      - name: Attest owner APK and record installability evidence
        shell: bash
        run: |
          set -euo pipefail
          node 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/scripts/attestAndroidEvaluationApk.mjs \
            "$DROPI_ARM64_APK" \
            "$DROPI_ARM64_STAGE_ROOT" \
            "$DROPI_APK_OUTPUT"
          cp 09_Development/Spikes/BABYLON_THIRD_PERSON_BRAILA_V1/INSTALL_ANDROID_EVALUATION_APK.md "$DROPI_APK_OUTPUT/"
          {
            echo 'classification=INTERNAL OWNER EVALUATION ONLY'
            echo "head_sha=$DROPI_HEAD_SHA"
            echo 'emulator_api=35'
            echo "emulator_abi=$DROPI_EMULATOR_ABI"
            echo "architecture_matched_emulator_preflight_install=$DROPI_EMULATOR_INSTALL"
            echo "architecture_matched_emulator_preflight_launch=$DROPI_EMULATOR_LAUNCH"
            echo "architecture_matched_emulator_stable_15s=$DROPI_EMULATOR_STABLE_15S"
            echo "emulator_preflight_bytes=$DROPI_EMULATOR_APK_SIZE"
            echo "candidate_version_code=$DROPI_ANDROID_VERSION_CODE"
            echo "lower_version_probe=$DROPI_UPGRADE_PROBE_VERSION"
            echo "emulator_update_mechanics=$DROPI_EMULATOR_UPDATE_PROBE"
            echo 'exact_old_payload_save_migration=UNKNOWN_NOT_TESTED_BY_VERSION_FIXTURE'
            echo "verified_previous_signer_sha256=$DROPI_REFERENCE_SIGNER"
            echo 'final_abi=arm64-v8a'
            echo 'final_arm64_physical_install=UNKNOWN_UNTIL_OWNER_DEVICE_TEST'
            echo 'apk_signature_v2_or_newer=PASS'
            echo 'zipalign_16kb=PASS'
            echo "owner_arm64_bytes=$DROPI_ARM64_SIZE"
          } > "$DROPI_APK_OUTPUT/owner-installability-evidence.txt"
          cp "$RUNNER_TEMP/dropi-app-logcat.txt" "$DROPI_APK_OUTPUT/emulator-app-logcat.txt"
          cd "$DROPI_APK_OUTPUT"
          sha256sum -c SHA256SUMS.txt
          cat owner-installability-evidence.txt

      - name: Upload owner-ready ARM64 APK and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropi-babylon-owner-ready-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/dropi-babylon-android-eval-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve emulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropi-babylon-installability-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/dropi-emulator.log
            ${{ runner.temp }}/dropi-avd-list.txt
            ${{ runner.temp }}/dropi-adb-install.txt
            ${{ runner.temp }}/dropi-app-logcat.txt
          if-no-files-found: warn
          retention-days: 7
