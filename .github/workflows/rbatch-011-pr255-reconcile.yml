name: RBATCH-011 PR255 Reconcile

on:
  push:
    branches:
      - openai/rbatch-011-mainmenu-flow

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/rbatch-011-mainmenu-flow
          fetch-depth: 0

      - name: Reconcile replacement PR references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('00_Project/PROJECT_STATUS.md'),
              Path('09_Development/Planning/BATCH_ARCHITECTURE.md'),
              Path('09_Development/Planning/EPIC_CATALOG.md'),
              Path('09_Development/Planning/ISSUE_CATALOG.md'),
              Path('09_Development/Planning/github_creation_plan.yaml'),
              Path('09_Development/CHANGELOG.md'),
          ]

          replacements = [
              ('Draft PR #254 implementation exists — pending independent review', 'PR #255 implementation exists — validation/review in progress'),
              ('Draft PR #254 — pending independent review', 'PR #255 — validation/review in progress'),
              ('DRAFT PR #254 OPEN — PENDING INDEPENDENT REVIEW', 'PR #255 OPEN — VALIDATION/REVIEW IN PROGRESS'),
              ('Draft PR #254 open — pending independent review', 'PR #255 open — validation/review in progress'),
              ('Draft PR #254', 'PR #255'),
          ]

          changed = 0
          for path in files:
              raw = path.read_bytes()
              newline = b'\r\n' if b'\r\n' in raw else b'\n'
              text = raw.decode('utf-8').replace('\r\n', '\n')
              before = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != before:
                  path.write_bytes(text.replace('\n', newline.decode()).encode('utf-8'))
                  changed += 1
          if changed == 0:
              raise SystemExit('No PR #254 active-state references were reconciled')
          print(f'Reconciled {changed} files')
          PY

      - name: Verify active state references
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'PR #255' 00_Project/PROJECT_STATUS.md
          grep -F 'PR #255 — validation/review in progress' 09_Development/Planning/BATCH_ARCHITECTURE.md
          grep -F 'PR #255 implementation exists — validation/review in progress' 09_Development/Planning/ISSUE_CATALOG.md
          grep -F "PR #255" 09_Development/Planning/github_creation_plan.yaml

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00_Project/PROJECT_STATUS.md 09_Development/Planning/BATCH_ARCHITECTURE.md 09_Development/Planning/EPIC_CATALOG.md 09_Development/Planning/ISSUE_CATALOG.md 09_Development/Planning/github_creation_plan.yaml 09_Development/CHANGELOG.md
          git commit -m 'docs: reconcile RBATCH-011 replacement PR #255'
          git push origin HEAD:openai/rbatch-011-mainmenu-flow
