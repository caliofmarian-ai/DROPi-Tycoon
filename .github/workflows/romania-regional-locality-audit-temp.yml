name: TEMP Romania Regional Locality Materializer

on:
  push:
    branches:
      - openai/europe-romania-regional-localities-509
    paths:
      - .github/workflows/romania-regional-locality-audit-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openai/europe-romania-regional-localities-509
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: game-web/package-lock.json
      - name: Download retained GeoNames assets
        run: |
          set -euo pipefail
          base='https://github.com/caliofmarian-ai/DROPi-Tycoon/releases/download/source-geonames-cities500-2026-09-08-f3cda4f9'
          curl -fsSL "$base/cities500.zip" -o /tmp/cities500.zip
          curl -fsSL "$base/admin1CodesASCII.txt" -o /tmp/admin1CodesASCII.txt
          printf '%s  %s\n' 'f3cda4f9d256d90045121fb8eebad3ed91695c32370ed93b50fbe0cb616e2bbd' /tmp/cities500.zip | sha256sum -c -
          printf '%s  %s\n' '590651498043f674accda2b7f46d21286cda0e290b02f8561c5005eee9a5448c' /tmp/admin1CodesASCII.txt | sha256sum -c -
      - name: Generate and verify Romania registry
        run: |
          set -euo pipefail
          python scripts/build_romania_regional_localities.py --cities-zip /tmp/cities500.zip --admin1 /tmp/admin1CodesASCII.txt
          python scripts/verify_romania_regional_localities.py
          git diff --check
      - name: Run targeted tests and build
        working-directory: game-web
        run: |
          set -euo pipefail
          npm ci
          npx vitest run tests/romania-regional-localities.test.ts
          npm run build
      - name: Commit generated country slice and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/romania-regional-locality-audit-temp.yml
          git add game-web/public/data/europe-romania-regional-localities-v1.json 04_World/Country_Catalog/Continents/Europe/ROMANIA_REGIONAL_LOCALITIES.md
          git diff --cached --check
          git commit -m 'data: materialize Romania representative regional nodes'
          git push origin HEAD:openai/europe-romania-regional-localities-509
