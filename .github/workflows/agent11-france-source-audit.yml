name: Agent 11 France pre-PR verification

on:
  push:
    branches:
      - agent/world-localities-france-543

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dropi_test
          POSTGRES_PASSWORD: dropi_test
          POSTGRES_DB: dropi_authority_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dropi_test -d dropi_authority_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHORITY_TEST_DATABASE_URL: postgresql://dropi_test:dropi_test@127.0.0.1:5432/dropi_authority_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main for range checks
        run: git fetch origin main:refs/remotes/origin/main

      - name: Download retained GeoNames snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/france-source
          gh release download source-geonames-cities500-2026-09-08-f3cda4f9 \
            --repo caliofmarian-ai/DROPi-Tycoon \
            --pattern cities500.zip \
            --pattern admin1CodesASCII.txt \
            --dir .tmp/france-source
          echo 'f3cda4f9d256d90045121fb8eebad3ed91695c32370ed93b50fbe0cb616e2bbd  .tmp/france-source/cities500.zip' | sha256sum -c -
          echo '590651498043f674accda2b7f46d21286cda0e290b02f8561c5005eee9a5448c  .tmp/france-source/admin1CodesASCII.txt' | sha256sum -c -

      - name: Verify deterministic France generation
        run: |
          python scripts/build_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_CONFIG.json \
            --cities-zip .tmp/france-source/cities500.zip \
            --admin1 .tmp/france-source/admin1CodesASCII.txt \
            --out /tmp/europe-france-regional-localities-v1.json \
            --doc /tmp/FRANCE_REGIONAL_LOCALITIES.md
          cmp /tmp/europe-france-regional-localities-v1.json game-web/public/data/europe-france-regional-localities-v1.json
          cmp /tmp/FRANCE_REGIONAL_LOCALITIES.md 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_LOCALITIES.md
          python scripts/verify_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_CONFIG.json \
            --data game-web/public/data/europe-france-regional-localities-v1.json

      - name: Verify global Country Catalog and all Europe regional models
        run: |
          set -euo pipefail
          python scripts/verify_country_catalog_chapters.py
          python scripts/verify_expanded_locality_catalog.py
          python scripts/verify_romania_regional_localities.py
          shopt -s nullglob
          configs=(04_World/Country_Catalog/Continents/Europe/*_REGIONAL_CONFIG.json)
          test "${#configs[@]}" -gt 0
          for config in "${configs[@]}"; do
            base_name="$(basename "$config" _REGIONAL_CONFIG.json)"
            slug="$(printf '%s' "$base_name" | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
            data="game-web/public/data/europe-${slug}-regional-localities-v1.json"
            test -f "$data"
            python scripts/verify_representative_regional_localities.py --config "$config" --data "$data"
          done

      - name: Verify France runtime geometry 250
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          topo = json.loads(Path('game-web/public/data/world-atlas-countries-110m.json').read_text(encoding='utf-8'))
          geometry = next(g for g in topo['objects']['countries']['geometries'] if str(g.get('id')).zfill(3) == '250')
          assert geometry['type'] == 'MultiPolygon'
          assert len(geometry['arcs']) == 3
          print('France geometry 250: PASS (MultiPolygon, 3 components)')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: game-web/package-lock.json

      - name: Install game-web dependencies
        working-directory: game-web
        run: npm ci

      - name: Run full Vitest repository suite
        working-directory: game-web
        run: npm test

      - name: TypeScript and production Vite build
        working-directory: game-web
        run: npm run build

      - name: Production server HTTP smoke
        working-directory: game-web
        run: |
          set -euo pipefail
          PORT=3000 npm start > /tmp/dropi-tycoon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/dropi-tycoon-index.html; then
              test -s /tmp/dropi-tycoon-index.html
              echo 'HTTP smoke: PASS'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dropi-tycoon-server.log
          exit 1

      - name: PR-range whitespace and archived runtime checks
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD
          if git diff --name-only origin/main...HEAD | grep -q '^Game/'; then
            echo 'Archived Game/ files changed unexpectedly.' >&2
            exit 1
          fi
          echo 'Whitespace and archived Game/: PASS'

      - name: Production Docker runtime smoke
        run: |
          set -euo pipefail
          IMAGE="dropi-tycoon-production-smoke:${GITHUB_SHA}"
          CONTAINER="dropi-tycoon-production-smoke"
          docker build --target production --tag "$IMAGE" game-web
          docker run --detach --name "$CONTAINER" --publish 127.0.0.1:3001:3000 "$IMAGE"
          cleanup() {
            docker logs "$CONTAINER" > /tmp/dropi-tycoon-production-container.log 2>&1 || true
            docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/ > /tmp/dropi-tycoon-production-index.html \
              && curl --fail --silent --show-error http://127.0.0.1:3001/api/authority/status > /tmp/dropi-tycoon-authority-status.json; then
              test -s /tmp/dropi-tycoon-production-index.html
              grep -q '"durability":"session-only"' /tmp/dropi-tycoon-authority-status.json
              grep -q '"persistent":false' /tmp/dropi-tycoon-authority-status.json
              docker logs "$CONTAINER" | grep -q 'Session authority prototype enabled at /api/authority/'
              echo 'Production Docker image runtime smoke: PASS'
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$CONTAINER" 2>/dev/null | grep -q '^true$'; then
              docker logs "$CONTAINER" || true
              exit 1
            fi
            sleep 1
          done
          docker logs "$CONTAINER" || true
          exit 1
