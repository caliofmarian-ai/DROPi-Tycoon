name: Agent 11 France source audit

on:
  push:
    branches:
      - agent/world-localities-france-543

permissions:
  contents: write

jobs:
  audit-and-generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip agent11-audit]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download retained GeoNames snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/france-source
          gh release download source-geonames-cities500-2026-09-08-f3cda4f9 \
            --repo caliofmarian-ai/DROPi-Tycoon \
            --pattern cities500.zip \
            --pattern admin1CodesASCII.txt \
            --dir .tmp/france-source
      - name: Verify source hashes and generate governed slice
        run: |
          echo 'f3cda4f9d256d90045121fb8eebad3ed91695c32370ed93b50fbe0cb616e2bbd  .tmp/france-source/cities500.zip' | sha256sum -c -
          echo '590651498043f674accda2b7f46d21286cda0e290b02f8561c5005eee9a5448c  .tmp/france-source/admin1CodesASCII.txt' | sha256sum -c -
          python scripts/build_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_CONFIG.json \
            --cities-zip .tmp/france-source/cities500.zip \
            --admin1 .tmp/france-source/admin1CodesASCII.txt \
            --out game-web/public/data/europe-france-regional-localities-v1.json \
            --doc 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_LOCALITIES.md
          python scripts/verify_representative_regional_localities.py \
            --config 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_CONFIG.json \
            --data game-web/public/data/europe-france-regional-localities-v1.json
      - name: Audit runtime geometry 250
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          topo = json.loads(Path('game-web/public/data/world-atlas-countries-110m.json').read_text(encoding='utf-8'))
          geometry = next(g for g in topo['objects']['countries']['geometries'] if str(g.get('id')).zfill(3) == '250')
          assert geometry['type'] == 'MultiPolygon'
          assert len(geometry['arcs']) == 3
          print('PASS: France geometry 250 is MultiPolygon with 3 retained runtime components')
          PY
      - name: Commit generated deterministic outputs
        run: |
          if git diff --quiet -- game-web/public/data/europe-france-regional-localities-v1.json 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_LOCALITIES.md; then
            echo 'Generated outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game-web/public/data/europe-france-regional-localities-v1.json 04_World/Country_Catalog/Continents/Europe/FRANCE_REGIONAL_LOCALITIES.md
          git commit -m 'feat(world): generate France regional localities [skip agent11-audit]'
          git push origin HEAD:agent/world-localities-france-543
