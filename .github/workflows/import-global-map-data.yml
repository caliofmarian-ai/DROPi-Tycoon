name: Import Global Map Dataset

on:
  push:
    branches:
      - openai/global-map-runtime-v1
    paths:
      - .github/workflows/import-global-map-data.yml

permissions:
  contents: write

jobs:
  import-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: openai/global-map-runtime-v1
          fetch-depth: 0

      - name: Import pinned mobile world topology
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game-web/public/data
          curl --fail --location --retry 3 \
            'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json' \
            --output game-web/public/data/world-atlas-countries-110m.json
          test -s game-web/public/data/world-atlas-countries-110m.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('game-web/public/data/world-atlas-countries-110m.json','utf8')); if(data.type!=='Topology'||!data.objects?.countries||!Array.isArray(data.arcs)) process.exit(1); console.log('countries', data.objects.countries.geometries.length, 'arcs', data.arcs.length)"
          sha256sum game-web/public/data/world-atlas-countries-110m.json | tee /tmp/world-map.sha256

      - name: Commit imported dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DROPi Tycoon automation'
          git config user.email 'actions@users.noreply.github.com'
          git add game-web/public/data/world-atlas-countries-110m.json
          if git diff --cached --quiet; then
            echo 'Dataset already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'world-map: vendor pinned 110m country topology'
          git push origin HEAD:openai/global-map-runtime-v1
