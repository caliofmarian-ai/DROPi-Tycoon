issues:
  # RBATCH-009 — Economy
  - id: ISSUE-001
    title: "Implement money reward on order completion"
    milestone_id: M-005
    label_names:
      - "type:implementation"
      - "phase:1"
      - "batch:rbatch-009"
      - "epic:economy-reputation"
    body: |
      **Batch:** RBATCH-009
      **Epic:** E-010 Economy & Reputation Core

      When an order transitions to Completed, apply the canonical money reward to PlayerData.Money.

      **Acceptance Criteria:**
      - PlayerData.Money increases by the configured reward value when PickedUp→Completed fires.
      - Affordability checks remain coherent after reward application.

  - id: ISSUE-002
    title: "Implement reputation increase on delivery completion"
    milestone_id: M-005
    label_names:
      - "type:implementation"
      - "phase:1"
      - "batch:rbatch-009"
      - "epic:economy-reputation"
    body: |
      **Batch:** RBATCH-009
      **Epic:** E-010 Economy & Reputation Core

      When an order transitions to Completed, increase PlayerData.Reputation by the canonical value.

      **Acceptance Criteria:**
      - Reputation increases correctly after completion.
      - Remains bounded by canonical maximum.

  - id: ISSUE-003
    title: "Implement money penalty on order failure"
    milestone_id: M-005
    label_names:
      - "type:implementation"
      - "phase:1"
      - "batch:rbatch-009"
      - "epic:economy-reputation"
    body: |
      **Batch:** RBATCH-009
      **Epic:** E-010 Economy & Reputation Core

      When an order transitions to Failed, apply the canonical money penalty clamped to zero minimum.

      **Acceptance Criteria:**
      - PlayerData.Money decreases correctly on failure.
      - Negative money is prevented (clamped to 0).

  - id: ISSUE-004
    title: "Implement reputation decrease on order failure"
    milestone_id: M-005
