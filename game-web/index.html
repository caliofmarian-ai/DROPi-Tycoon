<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#10151d" />
    <title>DROPi Tycoon</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #10151d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #10151d;
      }

      body {
        touch-action: manipulation;
      }

      canvas {
        display: block;
        margin: 0 auto;
      }

      #rotate-device {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: rgba(16, 21, 29, 0.95);
        color: #f8fafc;
        font-size: 20px;
        font-weight: 700;
        z-index: 10;
      }

      @media (orientation: portrait) {
        #rotate-device {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate-device">Rotate your phone to landscape for the prototype view.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
